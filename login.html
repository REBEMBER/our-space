<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Our Space — Login</title>

  <meta name="theme-color" content="#F7F9FC">

  <style>
    :root {
      --navy: #152B46;
      --navy-dark: #102238;
      --peach: #F3B29F;
      --peach-soft: #F9D5C9;
      --blue-light: #EEF5FA;
      --white: #FFFFFF;
      --off-white: #F7F9FC;
      --charcoal: #26313D;
      --muted: #718092;
      --border: #E2E9F0;
      --danger: #B14D4D;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(243,178,159,0.2),
          transparent 30%
        ),
        radial-gradient(
          circle at 95% 95%,
          rgba(220,234,245,0.4),
          transparent 35%
        ),
        var(--off-white);
      color: var(--charcoal);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: min(100%, 430px);
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 20px 55px rgba(21,43,70,0.09);
    }

    .logo {
      font-size: 27px;
      font-weight: 750;
      color: var(--navy);
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 27px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--blue-light);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 23px;
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 11px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 650;
      cursor: pointer;
    }

    .tab.active {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 2px 7px rgba(21,43,70,0.07);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 7px;
      color: var(--charcoal);
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--white);
      border-radius: 13px;
      padding: 14px;
      font-size: 16px;
      outline: none;
      color: var(--charcoal);
      margin-bottom: 16px;
    }

    input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(21,43,70,0.08);
    }

    .primary {
      width: 100%;
      border: 0;
      background: var(--navy);
      color: white;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .primary:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      margin-top: 15px;
      padding: 12px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }

    .message.error {
      display: block;
      background: #FFF0F0;
      color: var(--danger);
    }

    .message.success {
      display: block;
      background: var(--blue-light);
      color: var(--navy);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">Our Space</div>

    <div class="subtitle">
      A private space for the two of you.
    </div>

    <div class="tabs">
      <button
        id="loginTab"
        class="tab active"
        type="button"
      >
        Log in
      </button>

      <button
        id="signupTab"
        class="tab"
        type="button"
      >
        Create account
      </button>
    </div>

    <form id="authForm">

      <div id="nameGroup" class="hidden">
        <label for="name">Name</label>

        <input
          id="name"
          type="text"
          autocomplete="name"
          placeholder="Your name"
        >
      </div>

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Your password"
        required
      >

      <button
        id="submitButton"
        class="primary"
        type="submit"
      >
        Log in
      </button>

    </form>

    <div
      id="message"
      class="message"
      aria-live="polite"
    ></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const CONFIRMATION_URL =
      "https://our-space-topaz.vercel.app/confirmation.html";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const authForm = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const nameGroup = document.getElementById("nameGroup");
    const nameInput = document.getElementById("name");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let mode = "login";

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function setMode(newMode) {
      mode = newMode;

      clearMessage();

      if (mode === "signup") {
        loginTab.classList.remove("active");
        signupTab.classList.add("active");

        nameGroup.classList.remove("hidden");
        nameInput.required = true;

        submitButton.textContent = "Create account";

      } else {
        signupTab.classList.remove("active");
        loginTab.classList.add("active");

        nameGroup.classList.add("hidden");
        nameInput.required = false;

        submitButton.textContent = "Log in";
      }
    }

    loginTab.addEventListener("click", () => {
      setMode("login");
    });

    signupTab.addEventListener("click", () => {
      setMode("signup");
    });

    authForm.addEventListener("submit", async event => {
      event.preventDefault();

      clearMessage();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const name = nameInput.value.trim();

      submitButton.disabled = true;
      submitButton.textContent =
        mode === "signup"
          ? "Creating account..."
          : "Logging in...";

      try {
        if (mode === "signup") {

          const {
            data,
            error
          } = await client.auth.signUp({
            email,
            password,
            options: {
              data: {
                name
              },
              emailRedirectTo: CONFIRMATION_URL
            }
          });

          if (error) {
            throw error;
          }

          if (data.user && data.session) {
            window.location.replace("index.html");
            return;
          }

          showMessage(
            "Account created. Check your email to confirm your account.",
            "success"
          );

        } else {

          const {
            data,
            error
          } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            throw error;
          }

          if (data.user) {
            window.location.replace("index.html");
            return;
          }
        }

      } catch (error) {
        console.error(error);

        showMessage(
          error.message || "Something went wrong. Please try again.",
          "error"
        );

      } finally {
        submitButton.disabled = false;

        if (mode === "login") {
          submitButton.textContent = "Log in";
        } else {
          submitButton.textContent = "Create account";
        }
      }
    });

    async function checkExistingSession() {
      try {
        const {
          data: {
            user
          }
        } = await client.auth.getUser();

        if (user) {
          window.location.replace("index.html");
        }
      } catch (error) {
        console.log("No active user.");
      }
    }

    checkExistingSession();
  </script>

</body>
</html>
