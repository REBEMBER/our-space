<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="theme-color"
    content="#F7F9FC"
  />

  <title>Our Space — Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #26313d;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      border-radius: 24px;
      padding: 38px 30px 32px;
      box-shadow:
        0 12px 40px rgba(21, 43, 70, 0.10);
      border: 1px solid #e7edf3;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #152b46;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 700;
    }

    h1 {
      text-align: center;
      color: #152b46;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #7a8794;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #26313d;
    }

    .password-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #d9e2eb;
      border-radius: 13px;
      padding: 0 15px;
      font-size: 16px;
      color: #26313d;
      background: #fbfcfe;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #5c9bb2;
      box-shadow:
        0 0 0 3px rgba(92, 155, 178, 0.12);
      background: #ffffff;
    }

    .password-wrapper input {
      padding-right: 58px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #5c7183;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: none;
      border-radius: 13px;
      background: #152b46;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .login-button:hover {
      background: #1d3b5e;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      color: #c45c5c;
    }

    .message.success {
      color: #4f8a70;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9aa5af;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .login-card {
        padding: 32px 22px 28px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">♡</div>

    <h1>Our Space</h1>

    <p class="subtitle">
      Your private space, just for two.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          autocomplete="username"
          placeholder="Enter your username"
          required
        />
      </div>

      <div class="field">
        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          />

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>

        </div>
      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>

    </form>

    <div class="footer">
      Private • Personal • Our Space
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const USERNAME_LOGIN_FUNCTION =
      `${SUPABASE_URL}/functions/v1/username-login`;

    const { createClient } = supabase;

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const loginForm =
      document.getElementById("loginForm");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const showPasswordButton =
      document.getElementById("showPassword");

    const message =
      document.getElementById("message");

    function showMessage(
      text,
      type = "error"
    ) {
      message.textContent = text;
      message.className =
        `message ${type}`;
    }

    showPasswordButton.addEventListener(
      "click",
      () => {
        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        showPasswordButton.textContent =
          isPassword
            ? "Hide"
            : "Show";
      }
    );

    loginForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const username =
          usernameInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;

        if (!username || !password) {
          showMessage(
            "Please enter your username and password."
          );
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent =
          "Logging in...";

        showMessage("", "");

        try {
          const response =
            await fetch(
              USERNAME_LOGIN_FUNCTION,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_PUBLISHABLE_KEY
                },

                body: JSON.stringify({
                  username,
                  password
                })
              }
            );

          let result = {};

          try {
            result =
              await response.json();
          } catch {
            result = {};
          }

          if (!response.ok) {
            throw new Error(
              result.error ||
              `Login failed (${response.status}).`
            );
          }

          if (
            !result.access_token ||
            !result.refresh_token
          ) {
            throw new Error(
              "Login succeeded but no session was returned."
            );
          }

          const {
            data: sessionData,
            error: sessionError
          } =
            await client.auth.setSession({
              access_token:
                result.access_token,

              refresh_token:
                result.refresh_token
            });

          if (sessionError) {
            throw sessionError;
          }

          if (!sessionData.session) {
            throw new Error(
              "Unable to create your session."
            );
          }

          showMessage(
            "Login successful. Entering Our Space...",
            "success"
          );

          setTimeout(() => {
            window.location.href =
              "index.html";
          }, 300);

        } catch (error) {
          console.error(
            "Login error:",
            error
          );

          showMessage(
            error.message ||
            "Unable to log in. Please try again."
          );

        } finally {
          loginButton.disabled = false;
          loginButton.textContent =
            "Login";
        }
      }
    );

    usernameInput.focus();
  </script>

</body>
</html>
