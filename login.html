<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="theme-color"
    content="#F8F0EC"
  />

  <title>Our Space — Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #26313d;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      border-radius: 24px;
      padding: 38px 30px 32px;
      box-shadow:
        0 12px 40px rgba(21, 43, 70, 0.10);
      border: 1px solid #e7edf3;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #152b46;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 700;
    }

    h1 {
      text-align: center;
      color: #152b46;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #7a8794;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #26313d;
    }

    .password-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #d9e2eb;
      border-radius: 13px;
      padding: 0 15px;
      font-size: 16px;
      color: #26313d;
      background: #fbfcfe;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #5c9bb2;
      box-shadow:
        0 0 0 3px rgba(92, 155, 178, 0.12);
      background: #ffffff;
    }

    .password-wrapper input {
      padding-right: 58px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #5c7183;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: none;
      border-radius: 13px;
      background: #152b46;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .login-button:hover {
      background: #1d3b5e;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      color: #c45c5c;
    }

    .message.success {
      color: #4f8a70;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9aa5af;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .login-card {
        padding: 32px 22px 28px;
      }

      h1 {
        font-size: 25px;
      }
    }

    :root {
      --os-bg: #F8F0EC;
      --os-navy: #152B46;
      --os-peach: #F3B29F;
      --os-blue: #DCEAF5;
      --os-text: #26313D;
      --os-muted: #7A8794;
      --os-border: rgba(21,43,70,0.10);
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        radial-gradient(
          520px 340px at 88% 8%,
          rgba(243,178,159,0.24),
          transparent 68%
        ),
        radial-gradient(
          520px 360px at 8% 92%,
          rgba(220,234,245,0.58),
          transparent 66%
        ),
        var(--os-bg);
      color: var(--os-text);
    }

    .login-card {
      max-width: 420px;
      padding: 42px 34px 30px;
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid var(--os-border);
      box-shadow:
        0 26px 80px rgba(21,43,70,0.13);
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background:
        linear-gradient(90deg, var(--os-peach), #F7C5B5 46%, #BFD9E9);
    }

    .logo {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: var(--os-navy);
      color: #FFFFFF;
      box-shadow:
        0 12px 25px rgba(21,43,70,0.18);
    }

    .logo svg {
      width: 28px;
      height: 28px;
      stroke-width: 1.6;
    }

    h1 {
      color: var(--os-navy);
      font-size: 30px;
      letter-spacing: -0.035em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--os-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      color: var(--os-text);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    input {
      height: 54px;
      border: 1px solid rgba(21,43,70,0.14);
      border-radius: 15px;
      padding: 0 16px;
      color: var(--os-text);
      background: #FFFFFF;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
    }

    input::placeholder {
      color: #9AA6B2;
    }

    input:focus {
      border-color: rgba(21,43,70,0.34);
      box-shadow:
        0 0 0 4px rgba(220,234,245,0.95);
      background: #FFFFFF;
    }

    .show-password {
      color: var(--os-navy);
      opacity: 0.72;
    }

    .show-password:hover {
      opacity: 1;
    }

    .login-button {
      height: 54px;
      margin-top: 9px;
      border-radius: 15px;
      background: var(--os-navy);
      box-shadow:
        0 12px 24px rgba(21,43,70,0.15);
      transition:
        transform 0.16s ease,
        background 0.16s ease,
        box-shadow 0.16s ease;
    }

    .login-button:hover {
      background: #1D3B5D;
      transform: translateY(-1px);
      box-shadow:
        0 16px 30px rgba(21,43,70,0.19);
    }

    .login-button:active {
      transform: translateY(0) scale(0.985);
    }

    .message.error {
      color: #A94F4F;
    }

    .message.success {
      color: #356C59;
    }

    .footer {
      margin-top: 26px;
      color: #8A96A2;
    }

    @media (max-width: 420px) {
      .login-card {
        padding: 38px 22px 28px;
      }

      h1 {
        font-size: 27px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      input,
      .login-button {
        transition: none;
      }
    }

  
    /* ===== STRONG VISUAL REFRESH ===== */
    html, body { min-height:100%; }
    body {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding:18px;
      background:
        radial-gradient(620px 420px at 100% 0%, rgba(243,178,159,.24), transparent 68%),
        radial-gradient(560px 420px at 0% 100%, rgba(220,234,245,.58), transparent 66%),
        #F6F1EE;
      position:relative;
      overflow:hidden;
    }
    body::before {
      content:"";
      position:fixed;
      width:460px; height:460px;
      border-radius:50%;
      background:#152B46;
      left:-280px; top:-250px;
      opacity:.08;
      pointer-events:none;
    }
    .login-card {
      max-width:450px;
      padding:46px 40px 34px;
      border-radius:30px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(21,43,70,.10);
      box-shadow:0 30px 90px rgba(21,43,70,.16);
      position:relative;
      overflow:hidden;
    }
    .login-card::before {
      content:"";
      position:absolute; inset:0 0 auto 0; height:6px;
      background:linear-gradient(90deg,#152B46 0 42%,#F3B29F 42% 72%,#B8D5E5 72%);
    }
    .logo {
      width:68px; height:68px; border-radius:20px;
      background:#152B46;
      box-shadow:0 16px 34px rgba(21,43,70,.22);
      margin-bottom:22px;
    }
    .logo svg{width:30px;height:30px;stroke-width:1.55;}
    h1{font-size:32px;letter-spacing:-.04em;}
    .subtitle{font-size:14px;line-height:1.6;margin-bottom:32px;}
    .field{margin-bottom:16px;}
    label{font-size:13px;font-weight:750;margin-bottom:8px;}
    input{
      height:56px; border-radius:16px;
      border:1px solid rgba(21,43,70,.13);
      background:#FBFCFE;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }
    input:focus{
      border-color:rgba(21,43,70,.38);
      box-shadow:0 0 0 4px rgba(220,234,245,.95), 0 8px 18px rgba(21,43,70,.05);
    }
    .show-password{
      color:#152B46;font-weight:750;
      background:#EEF4F8;
      border-radius:10px;
    }
    .login-button{
      height:56px; border-radius:16px;
      margin-top:10px;
      box-shadow:0 14px 28px rgba(21,43,70,.16);
    }
    .message{min-height:24px;margin-top:16px;}
    .footer{margin-top:26px;}
    @media(max-width:420px){
      .login-card{padding:42px 22px 30px;}
      h1{font-size:28px;}
    }

  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 9h10"></path>
        <path d="M7 13h6"></path>
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H11l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5Z"></path>
      </svg>
    </div>

    <h1>Our Space</h1>

    <p class="subtitle">
      Your private space, just for two.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          autocomplete="username"
          placeholder="Enter your username"
          required
        />
      </div>

      <div class="field">
        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          />

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>

        </div>
      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>

    </form>

    <div class="footer">
      Private • Personal • Our Space
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const USERNAME_LOGIN_FUNCTION =
      `${SUPABASE_URL}/functions/v1/username-login`;

    const { createClient } = supabase;

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const loginForm =
      document.getElementById("loginForm");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const showPasswordButton =
      document.getElementById("showPassword");

    const message =
      document.getElementById("message");

    function showMessage(
      text,
      type = "error"
    ) {
      message.textContent = text;
      message.className =
        `message ${type}`;
    }

    showPasswordButton.addEventListener(
      "click",
      () => {
        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        showPasswordButton.textContent =
          isPassword
            ? "Hide"
            : "Show";
      }
    );

    loginForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const username =
          usernameInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;

        if (!username || !password) {
          showMessage(
            "Please enter your username and password."
          );
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent =
          "Logging in...";

        showMessage("", "");

        try {
          const response =
            await fetch(
              USERNAME_LOGIN_FUNCTION,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_PUBLISHABLE_KEY
                },

                body: JSON.stringify({
                  username,
                  password
                })
              }
            );

          let result = {};

          try {
            result =
              await response.json();
          } catch {
            result = {};
          }

          if (!response.ok) {
            throw new Error(
              result.error ||
              `Login failed (${response.status}).`
            );
          }

          if (
            !result.access_token ||
            !result.refresh_token
          ) {
            throw new Error(
              "Login succeeded but no session was returned."
            );
          }

          const {
            data: sessionData,
            error: sessionError
          } =
            await client.auth.setSession({
              access_token:
                result.access_token,

              refresh_token:
                result.refresh_token
            });

          if (sessionError) {
            throw sessionError;
          }

          if (!sessionData.session) {
            throw new Error(
              "Unable to create your session."
            );
          }

          showMessage(
            "Login successful. Entering Our Space...",
            "success"
          );

          setTimeout(() => {
            window.location.href =
              "index.html";
          }, 300);

        } catch (error) {
          console.error(
            "Login error:",
            error
          );

          showMessage(
            error.message ||
            "Unable to log in. Please try again."
          );

        } finally {
          loginButton.disabled = false;
          loginButton.textContent =
            "Login";
        }
      }
    );

    usernameInput.focus();
  </script>

</body>
</html>
