<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#F7F9FC">

  <title>Our Space — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #F7F9FC;
      color: #26313D;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 38px 28px 30px;
      box-shadow: 0 18px 50px rgba(21, 43, 70, 0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand h1 {
      margin: 0;
      color: #152B46;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .brand p {
      margin: 9px 0 0;
      color: #718092;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #26313D;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid #E2E9F0;
      border-radius: 15px;
      padding: 0 16px;

      background: #F7F9FC;
      color: #26313D;

      font-size: 16px;
      outline: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    input:focus {
      border-color: #152B46;
      box-shadow: 0 0 0 3px rgba(21, 43, 70, 0.08);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #718092;
      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .login-button {
      width: 100%;
      height: 56px;
      margin-top: 8px;

      border: none;
      border-radius: 16px;

      background: #152B46;
      color: #FFFFFF;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.08s ease,
        filter 0.08s ease;
    }

    .login-button:active {
      transform: scale(0.98);
      filter: brightness(0.94);
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;

      border-radius: 12px;

      background: #FFF0EC;
      color: #A34D3B;

      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #9AA5B1;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="brand">
      <h1>Our Space</h1>
      <p>Welcome back</p>
    </div>

    <form id="loginForm">

      <div class="field">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>

        </div>
      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Log In
      </button>

      <div
        class="error"
        id="errorMessage"
      ></div>

    </form>

    <div class="footer">
      Our Space
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/username-login";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");
    const showPassword = document.getElementById("showPassword");

    showPassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        showPassword.textContent = "Hide";
      } else {
        passwordInput.type = "password";
        showPassword.textContent = "Show";
      }

    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }

    function hideError() {
      errorMessage.style.display = "none";
      errorMessage.textContent = "";
    }

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      hideError();

      const username =
        usernameInput.value.trim().toLowerCase();

      const password =
        passwordInput.value;

      if (!username || !password) {
        showError("Enter your username and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        const response = await fetch(
          FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_PUBLISHABLE_KEY
            },

            body: JSON.stringify({
              username,
              password
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "Invalid username or password."
          );
        }

        if (!result.access_token || !result.refresh_token) {
          throw new Error("Login session could not be created.");
        }

        const { error: sessionError } =
          await client.auth.setSession({
            access_token: result.access_token,
            refresh_token: result.refresh_token
          });

        if (sessionError) {
          throw sessionError;
        }

        window.location.href = "index.html";

      } catch (error) {

        console.error(error);

        showError(
          error.message ||
          "Unable to log in. Please try again."
        );

        loginButton.disabled = false;
        loginButton.textContent = "Log In";
      }

    });
  </script>

</body>
</html>
