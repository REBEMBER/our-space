<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#F7F9FC">

  <title>Calculator</title>

  <link rel="icon" type="image/png" href="calculator.png">
  <link rel="apple-touch-icon" href="calculator.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #F7F9FC;
      color: #26313D;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calculator {
      width: min(390px, 100vw);
      height: min(820px, 100vh);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .display {
      width: 100%;
      min-height: 145px;
      margin-bottom: 18px;
      padding: 24px 20px;

      display: flex;
      align-items: flex-end;
      justify-content: flex-end;

      background: #152B46;
      border-radius: 24px;

      color: #EEF5FA;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 1px;

      overflow: hidden;
      word-break: break-all;

      box-shadow: 0 12px 30px rgba(21, 43, 70, 0.12);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      outline: none;
      height: 76px;
      border-radius: 20px;

      font-size: 25px;
      font-weight: 500;

      cursor: pointer;
      user-select: none;

      transition:
        transform 0.08s ease,
        filter 0.08s ease;
    }

    button:active {
      transform: scale(0.94);
      filter: brightness(0.94);
    }

    .number {
      background: #DCEAF5;
      color: #152B46;
    }

    .function {
      background: #152B46;
      color: #FFFFFF;
    }

    .operator {
      background: #F3B29F;
      color: #152B46;
    }

    .zero {
      grid-column: span 2;
    }

    @media (max-height: 650px) {
      .calculator {
        padding: 12px;
      }

      .display {
        min-height: 105px;
        margin-bottom: 10px;
        font-size: 42px;
      }

      .buttons {
        gap: 8px;
      }

      button {
        height: 58px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">

    <div class="display" id="display">0</div>

    <div class="buttons">

      <button class="function" onclick="clearDisplay()">AC</button>
      <button class="function" onclick="deleteLast()">⌫</button>
      <button class="function" onclick="percent()">%</button>
      <button class="operator" onclick="pressOperator('÷')">÷</button>

      <button class="number" onclick="pressNumber('7')">7</button>
      <button class="number" onclick="pressNumber('8')">8</button>
      <button class="number" onclick="pressNumber('9')">9</button>
      <button class="operator" onclick="pressOperator('×')">×</button>

      <button class="number" onclick="pressNumber('4')">4</button>
      <button class="number" onclick="pressNumber('5')">5</button>
      <button class="number" onclick="pressNumber('6')">6</button>
      <button class="operator" onclick="pressOperator('−')">−</button>

      <button class="number" onclick="pressNumber('1')">1</button>
      <button class="number" onclick="pressNumber('2')">2</button>
      <button class="number" onclick="pressNumber('3')">3</button>
      <button class="operator" onclick="pressOperator('+')">+</button>

      <button class="number zero" onclick="pressNumber('0')">0</button>
      <button class="number" onclick="pressNumber('.')">.</button>
      <button class="operator" onclick="calculate()">=</button>

    </div>

  </main>

  <script>
    const UNLOCK_CODE = "0000";

    const display = document.getElementById("display");

    let currentInput = "";
    let previousInput = "";
    let operator = null;
    let justCalculated = false;

    function updateDisplay(value) {
      display.textContent = value || "0";
    }

    function checkUnlock() {
      /*
       * Only unlock when the displayed calculator input
       * becomes exactly 0000.
       */
      if (currentInput === UNLOCK_CODE) {
        window.location.href = "index.html";
        return true;
      }

      return false;
    }

    function pressNumber(number) {

      if (justCalculated) {
        currentInput = "";
        justCalculated = false;
      }

      /*
       * Do not allow multiple leading zeros.
       */
      if (currentInput === "0" && number === "0") {
        return;
      }

      /*
       * Keep calculator normal.
       */
      if (number === ".") {
        if (currentInput.includes(".")) {
          return;
        }

        if (currentInput === "") {
          currentInput = "0.";
        } else {
          currentInput += ".";
        }
      } else {
        currentInput += number;
      }

      updateDisplay(currentInput);

      /*
       * Secret entry.
       */
      checkUnlock();
    }

    function pressOperator(selectedOperator) {

      if (currentInput === "") {
        return;
      }

      previousInput = currentInput;
      currentInput = "";
      operator = selectedOperator;

      updateDisplay(selectedOperator);
    }

    function calculate() {

      if (
        previousInput === "" ||
        currentInput === "" ||
        operator === null
      ) {
        return;
      }

      const a = parseFloat(previousInput);
      const b = parseFloat(currentInput);

      let result;

      if (operator === "+") {
        result = a + b;
      }

      if (operator === "−") {
        result = a - b;
      }

      if (operator === "×") {
        result = a * b;
      }

      if (operator === "÷") {
        if (b === 0) {
          updateDisplay("Error");
          currentInput = "";
          previousInput = "";
          operator = null;
          return;
        }

        result = a / b;
      }

      if (Number.isInteger(result)) {
        result = result.toString();
      } else {
        result = result.toFixed(8).replace(/0+$/, "").replace(/\.$/, "");
      }

      currentInput = result;
      previousInput = "";
      operator = null;
      justCalculated = true;

      updateDisplay(result);
    }

    function clearDisplay() {
      currentInput = "";
      previousInput = "";
      operator = null;
      justCalculated = false;

      updateDisplay("0");
    }

    function deleteLast() {
      if (justCalculated) {
        clearDisplay();
        return;
      }

      currentInput = currentInput.slice(0, -1);

      updateDisplay(currentInput);
    }

    function percent() {
      if (currentInput === "") {
        return;
      }

      currentInput = String(parseFloat(currentInput) / 100);

      updateDisplay(currentInput);
    }

    /*
     * Keyboard support.
     */
    document.addEventListener("keydown", function(event) {

      const key = event.key;

      if (/^[0-9]$/.test(key)) {
        pressNumber(key);
        return;
      }

      if (key === ".") {
        pressNumber(".");
        return;
      }

      if (key === "+") {
        pressOperator("+");
        return;
      }

      if (key === "-") {
        pressOperator("−");
        return;
      }

      if (key === "*") {
        pressOperator("×");
        return;
      }

      if (key === "/") {
        event.preventDefault();
        pressOperator("÷");
        return;
      }

      if (key === "Enter" || key === "=") {
        calculate();
        return;
      }

      if (key === "Escape") {
        clearDisplay();
        return;
      }

      if (key === "Backspace") {
        deleteLast();
      }
    });
  </script>

</body>
</html>
