<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Calculator</title>

  <link rel="icon" type="image/png" href="calculator.png">
  <link rel="apple-touch-icon" href="calculator.png">
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#F7F9FC">

  <style>
    :root {
      --navy: #152B46;
      --navy-dark: #102238;
      --navy-soft: #294967;

      --peach: #F3B29F;
      --peach-soft: #F9D5C9;

      --blue: #DCEAF5;
      --blue-light: #EEF5FA;

      --white: #FFFFFF;
      --off-white: #F7F9FC;

      --charcoal: #26313D;
      --muted: #718092;
      --border: #E2E9F0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(243,178,159,0.18), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(220,234,245,0.35), transparent 35%),
        var(--off-white);
      color: var(--charcoal);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .calculator {
      width: min(100%, 390px);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 18px;
      box-shadow: 0 20px 55px rgba(21, 43, 70, 0.12);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 14px;
    }

    .top-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--charcoal);
    }

    .top-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--peach);
    }

    .display {
      min-height: 125px;
      background: linear-gradient(145deg, var(--navy-dark), var(--navy));
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-align: right;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .expression {
      min-height: 22px;
      color: rgba(255,255,255,0.58);
      font-size: 14px;
      margin-bottom: 7px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .result {
      color: #ffffff;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: -1px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      min-height: 64px;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform 0.08s ease,
        filter 0.12s ease,
        box-shadow 0.12s ease;
      user-select: none;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.95);
    }

    .number {
      background: var(--blue-light);
      color: var(--charcoal);
      border: 1px solid var(--border);
    }

    .number:hover {
      filter: brightness(0.98);
    }

    .function {
      background: var(--navy);
      color: #ffffff;
    }

    .function:hover {
      background: var(--navy-soft);
    }

    .operator {
      background: var(--peach);
      color: var(--navy-dark);
    }

    .operator:hover {
      filter: brightness(1.03);
    }

    .zero {
      grid-column: span 2;
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 14px;
      opacity: 0.7;
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .calculator {
        border-radius: 25px;
        padding: 14px;
      }

      button {
        min-height: 60px;
      }

      .result {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">

    <div class="top-bar">
      <div class="top-title">Calculator</div>
      <div class="top-dot"></div>
    </div>

    <section class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </section>

    <section class="buttons">

      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="delete">⌫</button>
      <button class="function" data-action="percent">%</button>
      <button class="operator" data-value="/">÷</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="number zero" data-value="0">0</button>
      <button class="number" data-value=".">.</button>
      <button class="operator" data-action="equals">=</button>

    </section>

    <div class="hint">Calculator</div>

  </main>

  <script>
    const UNLOCK_CODE = "0000";

    const resultEl = document.getElementById("result");
    const expressionEl = document.getElementById("expression");

    let currentInput = "0";
    let storedValue = null;
    let operator = null;
    let waitingForNewInput = false;

    function updateDisplay() {
      resultEl.textContent = currentInput;
    }

    function clearCalculator() {
      currentInput = "0";
      storedValue = null;
      operator = null;
      waitingForNewInput = false;
      expressionEl.textContent = "";
      updateDisplay();
    }

    function inputNumber(value) {
      if (waitingForNewInput) {
        currentInput = value === "." ? "0." : value;
        waitingForNewInput = false;
        updateDisplay();
        return;
      }

      if (value === "." && currentInput.includes(".")) {
        return;
      }

      if (currentInput === "0" && value !== ".") {
        currentInput = value;
      } else {
        currentInput += value;
      }

      checkUnlock();
      updateDisplay();
    }

    function inputOperator(nextOperator) {
      const value = parseFloat(currentInput);

      if (operator && !waitingForNewInput) {
        calculate();
      }

      storedValue = parseFloat(currentInput);
      operator = nextOperator;
      waitingForNewInput = true;

      expressionEl.textContent =
        `${formatNumber(storedValue)} ${displayOperator(nextOperator)}`;
    }

    function calculate() {
      if (storedValue === null || operator === null) {
        return;
      }

      const currentValue = parseFloat(currentInput);
      let result;

      switch (operator) {
        case "+":
          result = storedValue + currentValue;
          break;

        case "-":
          result = storedValue - currentValue;
          break;

        case "*":
          result = storedValue * currentValue;
          break;

        case "/":
          if (currentValue === 0) {
            currentInput = "Error";
            storedValue = null;
            operator = null;
            waitingForNewInput = true;
            expressionEl.textContent = "Cannot divide by zero";
            updateDisplay();
            return;
          }

          result = storedValue / currentValue;
          break;

        default:
          return;
      }

      currentInput = formatNumber(result);
      storedValue = null;
      operator = null;
      waitingForNewInput = true;
      expressionEl.textContent = "";
      checkUnlock();
      updateDisplay();
    }

    function deleteLast() {
      if (waitingForNewInput || currentInput === "Error") {
        return;
      }

      if (currentInput.length <= 1) {
        currentInput = "0";
      } else {
        currentInput = currentInput.slice(0, -1);
      }

      updateDisplay();
    }

    function percent() {
      const value = parseFloat(currentInput);

      if (Number.isNaN(value)) {
        return;
      }

      currentInput = formatNumber(value / 100);
      checkUnlock();
      updateDisplay();
    }

    function formatNumber(number) {
      if (!Number.isFinite(number)) {
        return "Error";
      }

      const rounded = Number.parseFloat(Number(number).toPrecision(12));

      return String(rounded);
    }

    function displayOperator(value) {
      if (value === "*") return "×";
      if (value === "/") return "÷";
      if (value === "-") return "−";
      return value;
    }

    function checkUnlock() {
      const normalized = currentInput.replace(/\D/g, "");

      if (normalized === UNLOCK_CODE) {
        window.location.href = "index.html";
      }
    }

    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        const value = button.dataset.value;
        const action = button.dataset.action;

        if (value !== undefined) {
          if (["+", "-", "*", "/"].includes(value)) {
            inputOperator(value);
          } else {
            inputNumber(value);
          }

          return;
        }

        if (action === "clear") {
          clearCalculator();
        } else if (action === "delete") {
          deleteLast();
        } else if (action === "percent") {
          percent();
        } else if (action === "equals") {
          calculate();
        }
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key >= "0" && event.key <= "9") {
        inputNumber(event.key);
        return;
      }

      if (event.key === ".") {
        inputNumber(".");
        return;
      }

      if (["+", "-", "*", "/"].includes(event.key)) {
        inputOperator(event.key);
        return;
      }

      if (event.key === "Enter" || event.key === "=") {
        calculate();
        return;
      }

      if (event.key === "Backspace") {
        deleteLast();
        return;
      }

      if (event.key === "Escape") {
        clearCalculator();
      }
    });

    updateDisplay();
  </script>

</body>
</html>
