<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <script src="/theme.js?v=final"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/gateway.js?v=2"></script>
<style>html.gateway-pending body{visibility:hidden}</style>
<script>document.documentElement.classList.add("gateway-pending");</script>
  <title>Our Space — Gallery</title>
  <style>
    :root{
      --bg:#F8F0EC;--navy:#152B46;--peach:#F3B29F;--blue:#DCEAF5;
      --white:#fff;--text:#26313D;--muted:#7A8794;--border:rgba(21,43,70,.09);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:18px}
    button{font:inherit;cursor:pointer}
    .app{width:min(100%,1080px);margin:0 auto}
    .header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0 18px}
    .header-left{display:flex;align-items:center;gap:10px}
    .back-button{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.86);color:var(--navy);display:grid;place-items:center}
    .back-button svg{width:18px;height:18px}
    .title{margin:0;color:var(--navy);font-size:20px;font-weight:850}
    .subtitle{margin:4px 0 0;color:var(--muted);font-size:11px}
    .refresh-button{height:40px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--white);color:var(--navy);font-size:10px;font-weight:800}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .photo-card{position:relative;overflow:hidden;min-height:220px;border-radius:20px;background:var(--white);border:1px solid var(--border);box-shadow:0 10px 28px rgba(21,43,70,.06)}
    .photo-card a{display:block;width:100%;height:100%}
    .photo-card img{display:block;width:100%;height:100%;min-height:220px;object-fit:cover;background:var(--blue)}
    .photo-delete{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.7);background:rgba(21,43,70,.82);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(21,43,70,.2);backdrop-filter:blur(8px)}
    .photo-delete:hover{background:#B54A3C}
    .photo-card{position:relative}
    .photo-date{position:absolute;left:8px;bottom:8px;padding:5px 7px;border-radius:8px;background:rgba(21,43,70,.72);color:#fff;font-size:8px;font-weight:700}
    .photo-card.deleted img{filter:grayscale(.18) brightness(.72)}
    .photo-card.deleted::after{content:"";position:absolute;inset:0;background:rgba(21,43,70,.12);pointer-events:none}
    .photo-deleted-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:8px 12px;border-radius:999px;background:rgba(21,43,70,.84);color:#fff;font-size:10px;font-weight:850;letter-spacing:.02em;box-shadow:0 10px 26px rgba(21,43,70,.24);pointer-events:none}
    .state{padding:60px 20px;text-align:center;color:var(--muted)}
    .state strong{display:block;margin-bottom:7px;color:var(--navy);font-size:16px}
    @media(max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo-card,.photo-card img{min-height:180px}}
    @media(max-width:430px){body{padding:12px}.photo-card,.photo-card img{min-height:145px}.title{font-size:18px}}
    .gallery-delete-layer{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;background:rgba(21,43,70,.18);backdrop-filter:blur(8px)}
    .gallery-delete-layer.open{display:grid}
    .gallery-delete-sheet{width:min(100%,340px);padding:20px;border-radius:22px;background:#fff;border:1px solid rgba(21,43,70,.1);box-shadow:0 24px 70px rgba(21,43,70,.22)}
    .gallery-delete-title{color:#152B46;font-size:16px;font-weight:850}
    .gallery-delete-copy{margin-top:7px;color:#7A8794;font-size:12px;line-height:1.5}
    .gallery-delete-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
    .gallery-delete-cancel,.gallery-delete-confirm{height:44px;border-radius:13px;font-size:12px;font-weight:800;cursor:pointer}
    .gallery-delete-cancel{background:#F7F2EF;color:#152B46}
    .gallery-delete-confirm{background:#B54A3C;color:#fff}
    .gallery-delete-confirm:disabled{opacity:.55;cursor:wait}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <button class="back-button" id="backButton" type="button" aria-label="Back to Our Space">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <div>
          <h1 class="title">Our Gallery</h1>
          <p class="subtitle">Photos shared in your private space</p>
        </div>
      </div>
      <button class="refresh-button" id="refreshButton" type="button">Refresh</button>
    </header>
    <main id="gallery" class="gallery"></main>
  </div>

  <div class="gallery-delete-layer" id="galleryDeleteLayer" aria-hidden="true">
    <div class="gallery-delete-sheet" role="dialog" aria-modal="true" aria-labelledby="galleryDeleteTitle">
      <div class="gallery-delete-title" id="galleryDeleteTitle">Delete photo?</div>
      <div class="gallery-delete-copy">This removes the photo from the shared gallery.</div>
      <div class="gallery-delete-actions">
        <button type="button" class="gallery-delete-cancel" id="galleryDeleteCancel">Cancel</button>
        <button type="button" class="gallery-delete-confirm" id="galleryDeleteConfirm">Delete photo</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ywflohxufmfydkpkkqly.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";
    const SPACE_ID = "6547fe99-ed80-421c-8572-50ae3fb6fbe4";
    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
    );

    const galleryEl = document.getElementById("gallery");
    let currentUser = null;
    let galleryRealtimeChannel = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function formatDate(value) {
      return new Date(value).toLocaleDateString([], {
        day:"numeric", month:"short", year:"numeric"
      });
    }

    async function loadGallery() {
      galleryEl.innerHTML =
        '<div class="state"><strong>Loading gallery...</strong><span>Loading your shared photos.</span></div>';

      const { data:{ user }, error:authError } = await client.auth.getUser();
      if (authError || !user) {
        window.location.href = "login.html";
        return;
      }
      if (!await window.OurSpaceGateway.requireUnlock(client)) return;

      currentUser = user;

      if (window.OurSpaceTheme?.syncFromUser) {
        window.OurSpaceTheme.syncFromUser(user);
      }

      const { data:rows, error } = await client
        .from("messages")
        .select("id,created_at,media_path,message_type,sender_id,deleted_at")
        .eq("space_id", SPACE_ID)
        .eq("message_type", "image")
        .not("media_path", "is", null)
        .order("created_at", { ascending:false });

      if (error) {
        galleryEl.innerHTML =
          '<div class="state"><strong>Could not load the gallery</strong><span>' +
          escapeHtml(error.message) +
          '</span></div>';
        return;
      }

      if (!rows?.length) {
        galleryEl.innerHTML =
          '<div class="state"><strong>No photos yet</strong><span>Photos you send in chat will appear here.</span></div>';
        return;
      }

      const paths = rows.map((row) => row.media_path).filter(Boolean);
      const { data:signed, error:signedError } =
        await client.storage.from("chat-media").createSignedUrls(paths, 3600);

      if (signedError) {
        galleryEl.innerHTML =
          '<div class="state"><strong>Could not open the photos</strong><span>' +
          escapeHtml(signedError.message) +
          '</span></div>';
        return;
      }

      const urlByPath = new Map(
        (signed || []).map((item) => [item.path, item.signedUrl])
      );

      galleryEl.innerHTML = rows.map((row) => {
        const url = urlByPath.get(row.media_path);
        if (!url) return "";
        const deleted = Boolean(row.deleted_at);
        const canDelete = !deleted;
        const cardClass = deleted ? "photo-card deleted" : "photo-card";

        return '<article class="' + cardClass + '">' +
          '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' +
          '<img src="' + escapeHtml(url) + '" alt="Shared photo" loading="lazy" decoding="async">' +
          '<span class="photo-date">' + escapeHtml(formatDate(row.created_at)) + '</span>' +
          (deleted ? '<span class="photo-deleted-badge">Deleted</span>' : '') +
          '</a>' +
          (canDelete
            ? '<button class="photo-delete" type="button" data-gallery-delete="' + row.id + '" aria-label="Delete photo" title="Delete photo">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14"/><path d="M9 7V4.5h6V7"/><path d="m8 7 .8 13h6.4L16 7"/><path d="M10 11v5M14 11v5"/></svg>' +
              '</button>'
            : '') +
          '</article>';
      }).join("");
    }

    let pendingGalleryDeleteId = null;

    function closeGalleryDelete() {
      pendingGalleryDeleteId = null;
      document.getElementById("galleryDeleteLayer").classList.remove("open");
      document.getElementById("galleryDeleteLayer").setAttribute("aria-hidden","true");
    }

    function openGalleryDelete(messageId) {
      pendingGalleryDeleteId = Number(messageId);
      document.getElementById("galleryDeleteLayer").classList.add("open");
      document.getElementById("galleryDeleteLayer").setAttribute("aria-hidden","false");
    }

    galleryEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-gallery-delete]");
      if (!button || !currentUser) return;
      event.preventDefault();
      event.stopPropagation();
      openGalleryDelete(button.dataset.galleryDelete);
    });

    document.getElementById("galleryDeleteCancel").addEventListener("click", closeGalleryDelete);

    document.getElementById("galleryDeleteLayer").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeGalleryDelete();
    });

    document.getElementById("galleryDeleteConfirm").addEventListener("click", async () => {
      const button = document.getElementById("galleryDeleteConfirm");
      const messageId = pendingGalleryDeleteId;
      if (!messageId || !currentUser) return;

      const row = { id: messageId };
      const galleryMessage = Array.from(document.querySelectorAll("[data-gallery-delete]"))
        .find((node) => Number(node.dataset.galleryDelete) === Number(messageId));

      button.disabled = true;
      try {
        const { data:mediaRow, error:mediaLookupError } = await client
          .from("messages")
          .select("media_path,sender_id")
          .eq("id", row.id)
          .maybeSingle();

        if (mediaLookupError || !mediaRow?.media_path) {
          throw mediaLookupError || new Error("Could not find the photo.");
        }

        if (!mediaRow?.media_path) {
          throw new Error("Could not find the photo.");
        }

        const { data:changed, error:rpcError } = await client.rpc("delete_message_for_everyone", { p_message_id: row.id });
        if (rpcError || changed === false) {
          throw rpcError || new Error("Could not delete the photo.");
        }

        // Keep the storage object. Mohammad retains the original photo as
        // the visible Deleted record; Salma loses the row through RLS.
        if (galleryMessage) {
          galleryMessage.closest(".photo-card")?.remove();
        }

        closeGalleryDelete();
        await loadGallery();
      } catch (error) {
        console.error("Gallery delete error:", error);
        alert(error.message || "Could not delete the photo.");
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("backButton").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    document.getElementById("refreshButton").addEventListener("click", loadGallery);

    function subscribeGalleryRealtime() {
      if (galleryRealtimeChannel) {
        client.removeChannel(galleryRealtimeChannel);
      }
      galleryRealtimeChannel = client
        .channel("our-space-gallery-" + SPACE_ID, { config:{ private:true } })
        .on("postgres_changes", { event:"*", schema:"public", table:"messages" }, (payload) => {
          const row = payload.new || payload.old || {};
          if (row.space_id && String(row.space_id) !== String(SPACE_ID)) return;
          if (row.message_type === "image" || payload.eventType === "DELETE") {
            loadGallery();
          }
        })
        .subscribe();
    }

    client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" || !session) {
        window.location.href = "login.html";
      }
    });

    loadGallery().then(() => subscribeGalleryRealtime());
  </script>
</body>
</html>
