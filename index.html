<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Space</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: min(100%, 460px);
      padding: 28px;
      text-align: center;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: #f3f8f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    h1 {
      font-size: 42px;
      letter-spacing: -1.8px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle {
      color: #777;
      font-size: 16px;
      margin-bottom: 38px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .primary {
      background: #173f3b;
      color: white;
    }

    .primary:hover {
      background: #0f332f;
      transform: translateY(-1px);
    }

    .secondary {
      background: #f3f5f5;
      color: #173f3b;
    }

    .secondary:hover {
      background: #e9eeee;
    }

    .small {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="page" id="page">
    <div class="loading">Loading Our Space...</div>
  </main>

  <script>
    const SUPABASE_URL = "https://ywflohxufmfydkpkkqly.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    async function start() {
      const { data } = await db.auth.getSession();

      if (data.session) {
        window.location.href = "app.html";
        return;
      }

      document.getElementById("page").innerHTML = `
        <div class="logo">♡</div>

        <h1>Our Space</h1>

        <p class="subtitle">
          A little space, just for us.
        </p>

        <div class="buttons">
          <button class="primary" onclick="goLogin()">
            Log In
          </button>

          <button class="secondary" onclick="goSignup()">
            Create Account
          </button>
        </div>

        <p class="small">
          Private. Personal. Ours.
        </p>
      `;
    }

    function goLogin() {
      window.location.href = "login.html?mode=login";
    }

    function goSignup() {
      window.location.href = "login.html?mode=signup";
    }

    start();
  </script>

</body>
</html>
