<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Space ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 35px 28px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .heart {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #888;
      margin: 8px 0 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn {
      background: #111;
      color: white;
    }

    .create-btn {
      background: #eeeeee;
      color: #111;
      margin-top: 12px;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="card">

      <div class="heart">❤️</div>

      <h1>Our Space</h1>

      <p class="subtitle">Just for us.</p>

      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="login-btn"
        onclick="login()"
      >
        Log In
      </button>

      <button
        class="create-btn"
        onclick="createAccount()"
      >
        Create Account
      </button>

      <div id="message"></div>

    </div>

  </div>

  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const APP_URL =
      "https://our-space-topaz.vercel.app/";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text) {
      document.getElementById("message").textContent = text;
    }


    // ==========================================
    // LOG IN
    // ==========================================

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password."
        );

        return;
      }


      showMessage("Logging in...");


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        showMessage(
          "❌ " + error.message
        );

        return;
      }


      showMessage(
        "❤️ Login successful!"
      );


      console.log(
        "Logged in user:",
        data.user
      );

    }


    // ==========================================
    // CREATE ACCOUNT
    // ==========================================

    async function createAccount() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage(
          "Please enter an email and password."
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters."
        );

        return;
      }


      showMessage(
        "Creating your account..."
      );


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo: APP_URL

          }

        });


      if (error) {

        showMessage(
          "❌ " + error.message
        );

        return;
      }


      if (data.session) {

        showMessage(
          "❤️ Account created! You're logged in."
        );

      } else {

        showMessage(
          "❤️ Account created! Check your email to confirm your account."
        );

      }


      console.log(
        "Created user:",
        data.user
      );

    }


    // ==========================================
    // CHECK EXISTING SESSION
    // ==========================================

    async function checkSession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (session) {

        console.log(
          "Already logged in:",
          session.user
        );

      }

    }


    checkSession();

  </script>

</body>
</html>
