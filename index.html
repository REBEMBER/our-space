  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =========================================================
       SUPABASE CONFIG
       ========================================================= */

    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const loadingScreen =
      document.getElementById("loadingScreen");

    const calculatorScreen =
      document.getElementById("calculatorScreen");

    const ourSpaceScreen =
      document.getElementById("ourSpaceScreen");

    const currentDisplay =
      document.getElementById("currentDisplay");

    const previousOperation =
      document.getElementById("previousOperation");

    const logoutButton =
      document.getElementById("logoutButton");

    const userStatus =
      document.getElementById("userStatus");


    /* =========================================================
       HIDDEN UNLOCK CODE
       =========================================================

       Change this to whatever code you want.

       Example:
       1432

       The calculator will still behave normally.
       When the exact code is entered, Our Space opens.
       ========================================================= */

    const UNLOCK_CODE = "1432";


    /* =========================================================
       CALCULATOR STATE
       ========================================================= */

    let currentValue = "0";
    let previousValue = null;
    let currentOperator = null;
    let waitingForNewValue = false;

    /*
      Stores the digits entered since the last calculator reset.
      This allows the secret code to be detected without changing
      the normal calculator experience.
    */
    let unlockSequence = "";


    /* =========================================================
       CALCULATOR DISPLAY
       ========================================================= */

    function updateDisplay() {
      currentDisplay.textContent = currentValue;
    }


    /* =========================================================
       SECRET CODE DETECTION
       ========================================================= */

    function registerUnlockDigit(number) {

      unlockSequence += String(number);

      /*
        Keep only the last characters necessary to compare
        against the secret code.
      */
      if (unlockSequence.length > UNLOCK_CODE.length) {
        unlockSequence =
          unlockSequence.slice(-UNLOCK_CODE.length);
      }

      if (unlockSequence === UNLOCK_CODE) {
        unlockSequence = "";
        unlockOurSpace();
      }
    }


    /* =========================================================
       NUMBER INPUT
       ========================================================= */

    function inputNumber(number) {

      registerUnlockDigit(number);

      if (waitingForNewValue) {
        currentValue = String(number);
        waitingForNewValue = false;
      } else if (currentValue === "0") {
        currentValue = String(number);
      } else {
        currentValue += String(number);
      }

      updateDisplay();
    }


    /* =========================================================
       DECIMAL
       ========================================================= */

    function inputDecimal() {

      if (waitingForNewValue) {
        currentValue = "0.";
        waitingForNewValue = false;
        updateDisplay();
        return;
      }

      if (!currentValue.includes(".")) {
        currentValue += ".";
        updateDisplay();
      }
    }


    /* =========================================================
       CLEAR
       ========================================================= */

    function clearCalculator() {

      currentValue = "0";
      previousValue = null;
      currentOperator = null;
      waitingForNewValue = false;
      unlockSequence = "";

      previousOperation.textContent = "";

      updateDisplay();
    }


    /* =========================================================
       SIGN
       ========================================================= */

    function toggleSign() {

      if (currentValue === "0") {
        return;
      }

      if (currentValue.startsWith("-")) {
        currentValue =
          currentValue.substring(1);
      } else {
        currentValue =
          "-" + currentValue;
      }

      updateDisplay();
    }


    /* =========================================================
       PERCENT
       ========================================================= */

    function percentage() {

      const number =
        parseFloat(currentValue);

      if (Number.isNaN(number)) {
        return;
      }

      currentValue =
        String(number / 100);

      updateDisplay();
    }


    /* =========================================================
       OPERATOR
       ========================================================= */

    function chooseOperator(operator) {

      const inputValue =
        parseFloat(currentValue);

      if (Number.isNaN(inputValue)) {
        return;
      }

      if (
        previousValue !== null &&
        currentOperator !== null &&
        !waitingForNewValue
      ) {
        calculate();
      }

      previousValue =
        parseFloat(currentValue);

      currentOperator =
        operator;

      waitingForNewValue = true;

      previousOperation.textContent =
        `${formatNumber(previousValue)} ${displayOperator(operator)}`;
    }


    /* =========================================================
       CALCULATION
       ========================================================= */

    function calculate() {

      if (
        previousValue === null ||
        currentOperator === null
      ) {
        return;
      }

      const current =
        parseFloat(currentValue);

      let result;

      switch (currentOperator) {

        case "+":
          result = previousValue + current;
          break;

        case "-":
          result = previousValue - current;
          break;

        case "*":
          result = previousValue * current;
          break;

        case "/":

          if (current === 0) {
            currentValue = "Error";
            previousValue = null;
            currentOperator = null;
            waitingForNewValue = true;

            previousOperation.textContent = "";

            updateDisplay();
            return;
          }

          result = previousValue / current;
          break;

        default:
          return;
      }

      result =
        Number.parseFloat(result.toPrecision(12));

      currentValue =
        String(result);

      previousOperation.textContent =
        `${formatNumber(previousValue)} ${displayOperator(currentOperator)} ${formatNumber(current)}`;

      previousValue = null;
      currentOperator = null;
      waitingForNewValue = true;

      updateDisplay();
    }


    /* =========================================================
       OPERATOR DISPLAY
       ========================================================= */

    function displayOperator(operator) {

      switch (operator) {
        case "*":
          return "×";

        case "/":
          return "÷";

        case "-":
          return "−";

        case "+":
          return "+";

        default:
          return operator;
      }
    }


    /* =========================================================
       NUMBER FORMATTING
       ========================================================= */

    function formatNumber(number) {

      if (typeof number !== "number") {
        return number;
      }

      return String(
        Number.parseFloat(number.toPrecision(12))
      );
    }


    /* =========================================================
       BUTTON EVENTS
       ========================================================= */

    document
      .querySelectorAll("[data-number]")
      .forEach(button => {

        button.addEventListener("click", () => {

          const number =
            button.dataset.number;

          inputNumber(number);
        });

      });


    document
      .querySelectorAll('[data-action="decimal"]')
      .forEach(button => {

        button.addEventListener(
          "click",
          inputDecimal
        );

      });


    document
      .querySelectorAll('[data-action="clear"]')
      .forEach(button => {

        button.addEventListener(
          "click",
          clearCalculator
        );

      });


    document
      .querySelectorAll('[data-action="sign"]')
      .forEach(button => {

        button.addEventListener(
          "click",
          toggleSign
        );

      });


    document
      .querySelectorAll('[data-action="percent"]')
      .forEach(button => {

        button.addEventListener(
          "click",
          percentage
        );

      });


    document
      .querySelectorAll('[data-action="operator"]')
      .forEach(button => {

        button.addEventListener("click", () => {

          chooseOperator(
            button.dataset.value
          );

        });

      });


    document
      .querySelectorAll('[data-action="equals"]')
      .forEach(button => {

        button.addEventListener(
          "click",
          calculate
        );

      });


    /* =========================================================
       KEYBOARD SUPPORT
       ========================================================= */

    document.addEventListener(
      "keydown",
      event => {

        const key = event.key;

        if (/^[0-9]$/.test(key)) {
          inputNumber(key);
          return;
        }

        if (key === ".") {
          inputDecimal();
          return;
        }

        if (
          key === "+" ||
          key === "-" ||
          key === "*" ||
          key === "/"
        ) {
          chooseOperator(key);
          return;
        }

        if (
          key === "Enter" ||
          key === "="
        ) {
          calculate();
          return;
        }

        if (
          key === "Escape" ||
          key === "Delete"
        ) {
          clearCalculator();
        }

      }
    );


    /* =========================================================
       OUR SPACE UNLOCK
       ========================================================= */

    async function unlockOurSpace() {

      /*
        First validate the real Supabase account.
        The calculator code is NOT the security mechanism.
      */

      const {
        data,
        error
      } = await client.auth.getUser();

      if (
        error ||
        !data ||
        !data.user
      ) {

        await client.auth.signOut({
          scope: "local"
        });

        window.location.href =
          "login.html";

        return;
      }

      calculatorScreen.style.display =
        "none";

      ourSpaceScreen.style.display =
        "block";

      userStatus.textContent =
        "Your private space is unlocked.";

      window.scrollTo(0, 0);
    }


    /* =========================================================
       LOGOUT
       ========================================================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        await client.auth.signOut({
          scope: "local"
        });

        window.location.href =
          "login.html";

      }
    );


    /* =========================================================
       AUTH CHECK
       ========================================================= */

    async function checkAuthentication() {

      try {

        const {
          data,
          error
        } = await client.auth.getUser();

        if (
          error ||
          !data ||
          !data.user
        ) {

          await client.auth.signOut({
            scope: "local"
          });

          window.location.href =
            "login.html";

          return;
        }

        /*
          User is authenticated.

          We intentionally keep the calculator visible
          instead of automatically opening Our Space.
        */

        loadingScreen.style.display =
          "none";

        calculatorScreen.style.display =
          "flex";

      } catch (error) {

        console.error(
          "Authentication check failed:",
          error
        );

        await client.auth.signOut({
          scope: "local"
        });

        window.location.href =
          "login.html";
      }
    }


    /* =========================================================
       SUPABASE AUTH STATE LISTENER
       ========================================================= */

    client.auth.onAuthStateChange(
      async (event, session) => {

        if (event === "SIGNED_OUT") {

          window.location.href =
            "login.html";

          return;
        }

        if (
          event === "SIGNED_IN" ||
          event === "TOKEN_REFRESHED" ||
          event === "USER_UPDATED"
        ) {

          /*
            Nothing needs to happen here.
            The current screen remains the calculator
            until the secret code is entered.
          */

        }

      }
    );


    /* =========================================================
       START
       ========================================================= */

    checkAuthentication();

  </script>

</body>
