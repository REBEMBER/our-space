<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Space ❤️</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background: white;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 36px;
    }

    p {
      color: #777;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>❤️ Our Space</h1>
  <p>Just for us.</p>

  <h2>Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button onclick="login()">Login</button>

  <div id="message"></div>

</div>

<script>

  // ==========================
  // SUPABASE CONNECTION
  // ==========================

  const SUPABASE_URL = "https://ywflohxufmfydkpkkqly.supabase.co";

  const SUPABASE_KEY = "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================
  // LOGIN
  // ==========================

  async function login() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.textContent =
        "Login failed: " + error.message;

      return;
    }

    message.textContent =
      "❤️ Welcome to Our Space!";

  }

</script>

</body>
</html>
