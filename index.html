<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Our Space</title>

  <meta name="theme-color" content="#F7F9FC">

  <style>
    :root {
      --navy: #152B46;
      --navy-dark: #102238;
      --navy-soft: #294967;

      --peach: #F3B29F;
      --peach-soft: #F9D5C9;

      --blue: #DCEAF5;
      --blue-light: #EEF5FA;

      --white: #FFFFFF;
      --off-white: #F7F9FC;

      --charcoal: #26313D;
      --muted: #718092;
      --border: #E2E9F0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(243,178,159,0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(220,234,245,0.38),
          transparent 35%
        ),
        var(--off-white);
      color: var(--charcoal);
    }

    body {
      min-height: 100vh;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      min-height: 100vh;
      padding: 22px 18px 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -0.7px;
      color: var(--navy);
    }

    .logout {
      border: 1px solid var(--border);
      background: var(--blue-light);
      color: var(--navy);
      padding: 10px 15px;
      border-radius: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .welcome {
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 27px;
      box-shadow: 0 15px 40px rgba(21,43,70,0.07);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(29px, 7vw, 43px);
      line-height: 1.08;
      letter-spacing: -1.4px;
    }

    .description {
      margin: 13px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
      max-width: 550px;
    }

    .status {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--peach-soft);
      color: var(--navy-dark);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--peach);
      border-radius: 50%;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      .app {
        padding: 17px 14px 30px;
      }

      .welcome {
        padding: 22px;
        border-radius: 22px;
      }

      .brand {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div class="brand">Our Space</div>

      <button
        id="logoutButton"
        class="logout"
        type="button"
      >
        Log out
      </button>
    </header>

    <div id="loading" class="loading">
      Entering Our Space...
    </div>

    <section
      id="mainContent"
      class="welcome hidden"
    >
      <div class="eyebrow">Just us</div>

      <h1>Welcome to Our Space.</h1>

      <p class="description">
        A private place for our conversations, memories, notes,
        plans, games and everything we build together.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Private & connected
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const loading = document.getElementById("loading");
    const mainContent = document.getElementById("mainContent");
    const logoutButton = document.getElementById("logoutButton");

    let checkingAuth = false;

    async function showLogin() {
      try {
        await client.auth.signOut({
          scope: "local"
        });
      } catch (error) {
        console.warn("Local sign out failed:", error);
      }

      window.location.replace("login.html");
    }

    async function checkAuthentication() {
      if (checkingAuth) {
        return;
      }

      checkingAuth = true;

      try {
        const {
          data: {
            user
          },
          error
        } = await client.auth.getUser();

        if (error || !user) {
          await showLogin();
          return;
        }

        loading.classList.add("hidden");
        mainContent.classList.remove("hidden");

      } catch (error) {
        console.error("Authentication check failed:", error);
        await showLogin();

      } finally {
        checkingAuth = false;
      }
    }

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      try {
        await client.auth.signOut({
          scope: "local"
        });
      } finally {
        window.location.replace("login.html");
      }
    });

    client.auth.onAuthStateChange((event) => {
      if (
        event === "SIGNED_IN" ||
        event === "TOKEN_REFRESHED" ||
        event === "USER_UPDATED"
      ) {
        if (!checkingAuth) {
          checkAuthentication();
        }
      }

      if (event === "SIGNED_OUT") {
        window.location.replace("login.html");
      }
    });

    checkAuthentication();
  </script>

</body>
</html>
