<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Email confirmed — Our Space</title>

  <meta
    name="description"
    content="Your Our Space email has been confirmed."
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {
      --bg: #f7f8fa;
      --white: #ffffff;
      --text: #17181c;
      --muted: #777a84;
      --border: #e5e6ea;
      --accent: #6c63ff;
      --success: #278a61;
      --danger: #d94b5b;
    }


    body {

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(108,99,255,.09),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(108,99,255,.07),
          transparent 30%
        ),
        var(--bg);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }


    .box {

      width: 100%;
      max-width: 470px;

      background: white;

      border: 1px solid var(--border);

      border-radius: 26px;

      padding: 44px 34px;

      text-align: center;

      box-shadow:
        0 25px 70px rgba(0,0,0,.07);
    }


    /* Success icon */

    .success-icon {

      width: 82px;
      height: 82px;

      border-radius: 50%;

      background: #eefaf4;

      border: 1px solid #d0efdf;

      color: var(--success);

      display: flex;

      align-items: center;
      justify-content: center;

      margin: 0 auto 25px;

      font-size: 37px;

      font-weight: 700;
    }


    h1 {

      font-size: 31px;

      letter-spacing: -.045em;

      margin-bottom: 12px;
    }


    .description {

      color: var(--muted);

      font-size: 14px;

      line-height: 1.65;

      max-width: 370px;

      margin: 0 auto 25px;
    }


    .confirmed-email {

      display: inline-block;

      max-width: 100%;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      background: #f5f5f7;

      border-radius: 10px;

      padding: 9px 14px;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 28px;
    }


    .button {

      width: 100%;

      border: 0;

      border-radius: 13px;

      padding: 14px;

      background: var(--text);

      color: white;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .15s,
        background .2s;
    }


    .button:hover {

      background: #2b2c31;

      transform: translateY(-1px);
    }


    .button:disabled {

      opacity: .55;

      cursor: not-allowed;

      transform: none;
    }


    .secondary {

      margin-top: 10px;

      background: white;

      color: var(--text);

      border: 1px solid var(--border);
    }


    .secondary:hover {

      background: #f7f7f8;
    }


    .message {

      display: none;

      border-radius: 11px;

      padding: 12px 13px;

      margin-bottom: 18px;

      font-size: 13px;

      line-height: 1.5;

      text-align: left;
    }


    .message.error {

      display: block;

      background: #fff1f3;

      color: var(--danger);

      border: 1px solid #ffd8de;
    }


    .message.success {

      display: block;

      background: #eefaf4;

      color: var(--success);

      border: 1px solid #d0efdf;
    }


    .footer {

      margin-top: 21px;

      color: var(--muted);

      font-size: 11px;

      line-height: 1.5;
    }


    /* Loading */

    .loading {

      position: fixed;

      inset: 0;

      background: white;

      display: flex;

      justify-content: center;

      align-items: center;

      z-index: 100;
    }


    .loading-content {

      text-align: center;
    }


    .logo {

      width: 55px;
      height: 55px;

      border-radius: 17px;

      background: var(--text);

      color: white;

      display: grid;

      place-items: center;

      font-weight: 800;

      margin: 0 auto 18px;
    }


    .spinner {

      width: 27px;
      height: 27px;

      border: 3px solid #e8e8ec;

      border-top-color: var(--accent);

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin: auto;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    @media (max-width: 500px) {

      .box {
        padding: 35px 23px;
      }

      h1 {
        font-size: 27px;
      }

    }

  </style>

</head>


<body>


  <!-- Temporary loading screen -->

  <div
    id="loading"
    class="loading"
  >

    <div class="loading-content">

      <div class="logo">
        OS
      </div>

      <div class="spinner"></div>

    </div>

  </div>


  <!-- Confirmation page -->

  <div class="box">

    <div class="success-icon">
      ✓
    </div>


    <h1>
      Your email was confirmed.
    </h1>


    <p class="description">
      Your Our Space account is now confirmed.
      Everything is ready — welcome to your private space.
    </p>


    <div
      id="confirmedEmail"
      class="confirmed-email"
      style="display:none;"
    ></div>


    <div
      id="message"
      class="message"
    ></div>


    <button
      id="enterBtn"
      class="button"
      type="button"
      disabled
    >
      Enter Our Space
    </button>


    <button
      id="loginBtn"
      class="button secondary"
      type="button"
      style="display:none;"
    >
      Go to login
    </button>


    <div class="footer">
      This account is protected by Supabase Authentication.
    </div>

  </div>


  <script>

    /* ============================
       SUPABASE
    ============================ */

    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";


    const APP_URL =
      "https://our-space-topaz.vercel.app/";


    const { createClient } = supabase;


    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {

          /*
            This is important because Supabase
            places confirmation tokens in the URL.
          */

          detectSessionInUrl: true,

          persistSession: true,

          autoRefreshToken: true

        }
      }
    );


    /* ============================
       ELEMENTS
    ============================ */

    const loading =
      document.getElementById(
        "loading"
      );


    const confirmedEmail =
      document.getElementById(
        "confirmedEmail"
      );


    const message =
      document.getElementById(
        "message"
      );


    const enterBtn =
      document.getElementById(
        "enterBtn"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    /* ============================
       HELPERS
    ============================ */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message " + type;

    }


    function goHome() {

      window.location.replace(
        "index.html"
      );

    }


    function goLogin() {

      window.location.replace(
        "login.html"
      );

    }


    /* ============================
       DISPLAY EMAIL
    ============================ */

    try {

      const email =
        sessionStorage.getItem(
          "confirmationEmail"
        );


      if (email) {

        confirmedEmail.textContent =
          email;

        confirmedEmail.style.display =
          "inline-block";

      }

    } catch (error) {}


    /* ============================
       CHECK CONFIRMATION
    ============================ */

    async function verifyConfirmation() {

      try {

        /*
          First give Supabase time to process
          the confirmation tokens from the URL.
        */

        await new Promise(
          resolve =>
            setTimeout(resolve, 700)
        );


        const {
          data,
          error
        } =
          await client.auth.getUser();


        if (
          !error &&
          data?.user
        ) {

          /*
            Confirmation succeeded.

            We now have a real authenticated
            user session.
          */

          enterBtn.disabled = false;

          enterBtn.textContent =
            "Enter Our Space";


          /*
            Use the actual confirmed email
            if available.
          */

          if (data.user.email) {

            confirmedEmail.textContent =
              data.user.email;

            confirmedEmail.style.display =
              "inline-block";

          }


          try {

            sessionStorage.removeItem(
              "confirmationEmail"
            );

          } catch (error) {}


          loading.style.display =
            "none";


          return;

        }


        /*
          No valid authenticated user.
          This normally means the confirmation
          link was invalid, expired, already used,
          or the browser did not complete the
          Supabase auth redirect.
        */

        loading.style.display =
          "none";


        enterBtn.style.display =
          "none";


        loginBtn.style.display =
          "block";


        showMessage(
          "We couldn't verify the confirmation session. Please try logging in. If your email was just confirmed, the account should now be available.",
          "error"
        );


      } catch (error) {

        console.error(
          "Confirmation verification:",
          error
        );


        loading.style.display =
          "none";


        enterBtn.style.display =
          "none";


        loginBtn.style.display =
          "block";


        showMessage(
          "We couldn't verify your email confirmation. Please try logging in.",
          "error"
        );

      }

    }


    /* ============================
       ENTER OUR SPACE
    ============================ */

    enterBtn.addEventListener(
      "click",
      async () => {

        enterBtn.disabled = true;

        enterBtn.textContent =
          "Opening Our Space...";


        /*
          Verify the user one more time
          before entering the app.
        */

        try {

          const {
            data,
            error
          } =
            await client.auth.getUser();


          if (
            !error &&
            data?.user
          ) {

            goHome();

            return;

          }


          showMessage(
            "Your session is no longer active. Please log in again.",
            "error"
          );


          enterBtn.disabled =
            false;

          enterBtn.textContent =
            "Enter Our Space";


        } catch (error) {

          showMessage(
            "Something went wrong. Please try logging in again.",
            "error"
          );


          enterBtn.disabled =
            false;

          enterBtn.textContent =
            "Enter Our Space";

        }

      }
    );


    /* ============================
       LOGIN BUTTON
    ============================ */

    loginBtn.addEventListener(
      "click",
      () => {

        goLogin();

      }
    );


    /* ============================
       AUTH EVENTS
    ============================ */

    client.auth.onAuthStateChange(
      (event, session) => {

        /*
          When Supabase processes the
          confirmation link and signs the
          user in, this event fires.
        */

        if (
          event === "SIGNED_IN" &&
          session
        ) {

          enterBtn.style.display =
            "block";

          enterBtn.disabled =
            false;

          enterBtn.textContent =
            "Enter Our Space";


          loginBtn.style.display =
            "none";


          loading.style.display =
            "none";


          if (session.user.email) {

            confirmedEmail.textContent =
              session.user.email;

            confirmedEmail.style.display =
              "inline-block";

          }

        }

      }
    );


    /* ============================
       START
    ============================ */

    verifyConfirmation();

  </script>

</body>
</html>
