<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Our Space — Confirmed</title>

  <meta name="theme-color" content="#F7F9FC">

  <style>
    :root {
      --navy: #152B46;
      --navy-dark: #102238;
      --peach: #F3B29F;
      --peach-soft: #F9D5C9;
      --blue-light: #EEF5FA;
      --white: #FFFFFF;
      --off-white: #F7F9FC;
      --charcoal: #26313D;
      --muted: #718092;
      --border: #E2E9F0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(243,178,159,0.2),
          transparent 30%
        ),
        radial-gradient(
          circle at 95% 95%,
          rgba(220,234,245,0.4),
          transparent 35%
        ),
        var(--off-white);
      color: var(--charcoal);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: min(100%, 450px);
      background: rgba(255,255,255,0.97);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 35px 30px;
      text-align: center;
      box-shadow: 0 20px 55px rgba(21,43,70,0.09);
    }

    .check {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--peach-soft);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin: 0 auto 22px;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .main-text {
      margin: 13px auto 5px;
      color: var(--charcoal);
      line-height: 1.55;
    }

    .sub-text {
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .email {
      display: inline-block;
      max-width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--blue-light);
      color: var(--navy);
      font-size: 13px;
      overflow-wrap: anywhere;
      margin-bottom: 22px;
    }

    .primary {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      background: var(--navy);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .secondary {
      display: block;
      margin-top: 11px;
      color: var(--navy);
      font-size: 13px;
      text-decoration: none;
    }

    .loading {
      color: var(--muted);
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="card">

    <div id="loading" class="loading">
      Confirming your account...
    </div>

    <div id="confirmedContent" class="hidden">

      <div class="check">✓</div>

      <h1>Your email was confirmed.</h1>

      <p class="main-text">
        Your Our Space account is now confirmed.
      </p>

      <p class="sub-text">
        You can now enter your private space.
      </p>

      <div
        id="email"
        class="email hidden"
      ></div>

      <a
        class="primary"
        href="index.html"
      >
        Enter Our Space
      </a>

    </div>

    <div id="fallbackContent" class="hidden">

      <div class="check">✓</div>

      <h1>Email confirmed</h1>

      <p class="main-text">
        Your email may have been confirmed successfully.
      </p>

      <p class="sub-text">
        If Our Space does not open automatically, log in again.
      </p>

      <a
        class="primary"
        href="login.html"
      >
        Go to login
      </a>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const loading = document.getElementById("loading");
    const confirmedContent =
      document.getElementById("confirmedContent");
    const fallbackContent =
      document.getElementById("fallbackContent");
    const emailElement =
      document.getElementById("email");

    async function initialize() {

      await new Promise(resolve => {
        setTimeout(resolve, 1200);
      });

      try {

        const {
          data: {
            user
          },
          error
        } = await client.auth.getUser();

        loading.classList.add("hidden");

        if (error || !user) {
          fallbackContent.classList.remove("hidden");
          return;
        }

        if (user.email) {
          emailElement.textContent = user.email;
          emailElement.classList.remove("hidden");
        }

        confirmedContent.classList.remove("hidden");

      } catch (error) {

        console.error(error);

        loading.classList.add("hidden");
        fallbackContent.classList.remove("hidden");
      }
    }

    initialize();
  </script>

</body>
</html>
