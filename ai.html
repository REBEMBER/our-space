<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/calculator.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>document.documentElement.classList.add("gateway-pending");</script>
<style>
:root{--bg:#F8F0EC;--surface:#fff;--soft:#FFF8F5;--navy:#152B46;--text:#26313D;--muted:#7A8794;--border:rgba(21,43,70,.10);--accent:#F3B29F;--user:#152B46;--userText:#fff}
html[data-theme="dark"]{--bg:#0B121B;--surface:#182431;--soft:#202F3E;--navy:#F1F6FA;--text:#EDF3F7;--muted:#A6B5C1;--border:rgba(237,243,247,.14);--accent:#EFA58C;--user:#F1F6FA;--userText:#0B121B}
html[data-theme="ocean"]{--bg:#ECF7FC;--navy:#0E4266;--soft:#F4FBFE;--text:#193547;--muted:#6A8495;--border:rgba(14,66,102,.12);--accent:#72CAE6;--user:#0E4266}
html[data-theme="forest"]{--bg:#EEF6F1;--navy:#164638;--soft:#F4FAF6;--text:#253A32;--muted:#71857D;--border:rgba(22,70,56,.12);--accent:#DDA187;--user:#164638}
html[data-theme="blush"]{--bg:#FFF1F5;--navy:#762B49;--soft:#FFF7F9;--text:#3D2731;--muted:#8D6A78;--border:rgba(118,43,73,.12);--accent:#F3A2BC;--user:#762B49}
html[data-theme="sunset"]{--bg:#FFF4EC;--navy:#71381F;--soft:#FFF9F5;--text:#3E2A22;--muted:#8A6F63;--border:rgba(113,56,31,.12);--accent:#F4A77E;--user:#71381F}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(650px 400px at 100% 0%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),var(--bg)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100%;padding:10px}
.shell{height:100%;max-width:1280px;margin:auto;display:flex;min-width:0}
.sidebar{width:272px;flex:none;display:flex;flex-direction:column;padding:4px 10px 4px 2px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 10px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.mark{width:40px;height:40px;border-radius:13px;background:var(--navy);color:var(--surface);display:grid;place-items:center;flex:none}
.mark svg{width:18px}
.title{font-weight:800;letter-spacing:.09em;font-size:14px;color:var(--navy)}
.sub{font-size:10px;color:var(--muted);margin-top:2px}
.new-chat{width:100%;height:42px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--navy);font-size:12px;font-weight:800;box-shadow:0 8px 22px rgba(21,43,70,.05);margin-bottom:9px}
.new-chat:hover,.side-action:hover,.chat-item:hover{background:var(--soft)}
.search{width:100%;height:38px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:0 11px;outline:0;font-size:11px;margin-bottom:8px}
.search:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.history{min-height:0;flex:1;overflow:auto;padding-right:3px}
.group-title{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);padding:12px 8px 6px}
.chat-item{width:100%;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--text);display:flex;align-items:center;gap:6px;padding:9px 7px;text-align:left;margin-bottom:2px}
.chat-item.active{background:var(--soft);border-color:var(--border)}
.chat-label{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.chat-delete{width:24px;height:24px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:15px;opacity:0;flex:none}
.chat-item:hover .chat-delete,.chat-item.active .chat-delete{opacity:1}
.chat-delete:hover{background:var(--surface);color:var(--navy)}
.empty-history{padding:24px 10px;color:var(--muted);font-size:11px;line-height:1.6;text-align:center}
.side-foot{padding-top:8px}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-action{height:36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--navy);font-size:10px;font-weight:700}
.workspace{min-width:0;flex:1;display:flex;flex-direction:column;padding-left:4px}
.topbar{height:47px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 8px}
.top-actions{display:flex;gap:6px}
.topbtn{height:36px;padding:0 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--navy);font-size:10px;font-weight:700}
.mobile-menu{display:none}
.card{min-height:0;flex:1;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 18px 55px rgba(21,43,70,.08);overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.headtitle{display:flex;align-items:center;gap:9px;min-width:0}
.dot{width:30px;height:30px;border-radius:10px;background:var(--navy);color:var(--surface);display:grid;place-items:center;flex:none}
.dot svg{width:15px}
.name{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:10px;color:var(--muted);margin-top:2px}
.head-right{display:flex;align-items:center;gap:6px}
.memory-btn{height:32px;padding:0 9px;border-radius:9px;border:1px solid var(--border);background:var(--soft);color:var(--navy);font-size:10px;font-weight:700}
.messages{min-height:0;flex:1;overflow:auto;padding:20px 18px 22px;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;text-align:center;max-width:510px;padding:24px}
.empty h1{font-size:27px;color:var(--navy);letter-spacing:-.04em;margin:0}
.empty p{font-size:12px;line-height:1.7;color:var(--muted);margin:9px 0 16px}
.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--soft);color:var(--navy);border-radius:999px;padding:8px 11px;font-size:10px}
.row{display:flex;align-items:flex-end;gap:7px}
.row.user{justify-content:flex-end}
.avatar{width:26px;height:26px;border-radius:9px;background:var(--soft);border:1px solid var(--border);color:var(--navy);display:grid;place-items:center;font-size:9px;font-weight:800;flex:none}
.bubble{max-width:min(82%,760px);padding:11px 13px;border-radius:16px;background:var(--soft);border:1px solid var(--border);white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.62}
.row.user .bubble{background:var(--user);color:var(--userText);border-color:transparent;border-bottom-right-radius:6px}
.row.ai .bubble{border-bottom-left-radius:6px}
.typing{display:flex;gap:3px}.typing span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:p 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes p{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{padding:9px;border-top:1px solid var(--border)}
.composebox{display:flex;gap:7px;align-items:flex-end;background:var(--soft);border:1px solid var(--border);border-radius:15px;padding:7px}
.prompt{flex:1;border:0;outline:0;background:transparent;color:var(--text);resize:none;min-height:22px;max-height:140px;padding:6px;font-size:12px;line-height:1.45}
.send{width:36px;height:36px;border:0;border-radius:11px;background:var(--navy);color:var(--surface);display:grid;place-items:center}
.send:disabled{opacity:.4;cursor:default}
.send svg{width:16px}
.hint{text-align:center;color:var(--muted);font-size:9px;padding:5px 2px 0}
.modal-layer{position:fixed;inset:0;background:rgba(21,43,70,.30);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.modal-layer.open{display:flex}
.modal{width:min(560px,100%);max-height:min(80vh,700px);background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 28px 90px rgba(21,43,70,.22);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px;border-bottom:1px solid var(--border)}
.modal-title{font-size:14px;font-weight:800;color:var(--navy)}
.close{width:32px;height:32px;border:1px solid var(--border);border-radius:9px;background:var(--soft);color:var(--navy);font-size:16px}
.modal-body{padding:13px;overflow:auto}
.memory-item{display:flex;align-items:flex-start;gap:8px;padding:11px 9px;border:1px solid var(--border);border-radius:12px;background:var(--soft);margin-bottom:7px}
.memory-text{flex:1;min-width:0;font-size:11px;line-height:1.55;color:var(--text)}
.memory-cat{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.memory-delete{width:28px;height:28px;border:0;border-radius:8px;background:var(--surface);color:var(--muted);font-size:15px}
.memory-delete:hover{color:var(--navy)}
.no-memories{text-align:center;color:var(--muted);font-size:11px;line-height:1.6;padding:25px 12px}
@media(max-width:820px){
  .sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(290px,86vw);padding:12px;background:var(--bg);box-shadow:24px 0 70px rgba(21,43,70,.15);transform:translateX(-105%);transition:transform .18s ease}
  .sidebar.open{transform:translateX(0)}
  .workspace{padding-left:0}
  .mobile-menu{display:inline-flex;align-items:center;justify-content:center;width:36px}
}
@media(max-width:700px){
  .app{padding:7px}
  .topbar{height:42px}
  .topbtn{width:36px;padding:0}
  .topbtn span{display:none}
  .card{border-radius:18px}
  .messages{padding:14px 10px 18px}
  .bubble{max-width:88%}
  .head{padding:11px 10px}
  .memory-btn{padding:0 8px}
}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <div class="brand">
          <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg></div>
          <div><div class="title">OUR SPACE</div><div class="sub" id="username">Private AI</div></div>
        </div>
      </div>
      <button class="new-chat" id="newChat">+ New chat</button>
      <input class="search" id="search" type="search" placeholder="Search chats">
      <div class="history" id="history"></div>
      <div class="side-foot">
        <div class="side-actions">
          <button class="side-action" id="memories">Memory</button>
          <button class="side-action" id="home">Home</button>
        </div>
      </div>
    </aside>

    <main class="workspace">
      <div class="topbar">
        <button class="topbtn mobile-menu" id="menu" aria-label="Open chats">Menu</button>
        <div></div>
        <div class="top-actions"><button class="topbtn" id="settings"><span>Settings</span></button></div>
      </div>

      <section class="card">
        <header class="head">
          <div class="headtitle">
            <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg></div>
            <div><div class="name" id="chatTitle">New chat</div><div class="status" id="status">Ready</div></div>
          </div>
          <div class="head-right"><button class="memory-btn" id="memoryBtn">Memory</button></div>
        </header>

        <div class="messages" id="messages">
          <div class="empty" id="empty">
            <h1>What should we work on?</h1>
            <p>Your AI workspace is private to your account. Previous conversations stay here and can be reopened anytime.</p>
            <div class="chips">
              <button class="chip">Help me plan something</button>
              <button class="chip">Explain a topic simply</button>
              <button class="chip">Write something for me</button>
            </div>
          </div>
        </div>

        <form class="composer" id="form">
          <div class="composebox">
            <textarea id="prompt" class="prompt" rows="1" maxlength="6000" placeholder="Message Our Space AI..."></textarea>
            <button id="send" class="send" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg>
            </button>
          </div>
          <div class="hint">Do not share passwords or API keys.</div>
        </form>
      </section>
    </main>
  </div>
</div>

<div class="modal-layer" id="memoryModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">What I remember about you</div><button class="close" id="closeMemory">×</button></div>
    <div class="modal-body" id="memoryList"></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://ywflohxufmfydkpkkqly.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";
const API="/api/ai";
const {createClient}=supabase;
const client=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
let currentUser=null,currentSession=null,currentChatId=null,chats=[],messages=[],busy=false;

function escapeText(v){return String(v||"").trim()}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function groupName(date){
  const d=new Date(date),now=new Date(),y=new Date();y.setDate(now.getDate()-1);
  if(sameDay(d,now))return"Today";
  if(sameDay(d,y))return"Yesterday";
  const week=new Date();week.setDate(now.getDate()-7);
  if(d>=week)return"Previous 7 days";
  return"Older";
}
function closeSidebar(){ $("sidebar").classList.remove("open") }
function openSidebar(){ $("sidebar").classList.add("open") }

async function session(){
  const {data,error}=await client.auth.getSession();
  if(error||!data.session)return false;
  currentSession=data.session;
  const user=await client.auth.getUser();
  if(user.error||!user.data.user)return false;
  currentUser=user.data.user;
  return true;
}

async function migrateLocalHistory(){
  const KEY="our_space_ai_history_v1";
  const DONE="our_space_ai_history_migrated_v1";
  if(localStorage.getItem(DONE))return;
  let oldHistory=[];
  try{oldHistory=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{}
  oldHistory=Array.isArray(oldHistory)?oldHistory.filter(m=>m&&(m.role==="user"||m.role==="model")&&typeof m.content==="string").slice(-100):[];
  if(!oldHistory.length){localStorage.setItem(DONE,"1");return}
  try{
    const title=(oldHistory.find(m=>m.role==="user")?.content||"Imported chat").replace(/\s+/g," ").trim().slice(0,55)||"Imported chat";
    const created=await client.from("ai_chats").insert({user_id:currentUser.id,title}).select("id").single();
    if(created.error||!created.data)throw created.error||new Error("chat migration failed");
    const rows=oldHistory.map(m=>({chat_id:created.data.id,user_id:currentUser.id,role:m.role,content:m.content}));
    const inserted=await client.from("ai_messages").insert(rows);
    if(inserted.error)throw inserted.error;
    localStorage.removeItem(KEY);
    localStorage.setItem(DONE,"1");
  }catch(error){console.error("AI history migration:",error)}
}

async function loadChats(){
  const {data,error}=await client.from("ai_chats").select("id,user_id,title,created_at,updated_at").order("updated_at",{ascending:false}).limit(1000);
  if(error){console.error(error);return}
  chats=(data||[]).filter(chat=>String(chat.user_id)===String(currentUser.id));
  renderChats();
}

function renderChats(){
  const root=$("history"),query=$("search").value.trim().toLowerCase();
  root.innerHTML="";
  const filtered=chats.filter(c=>!query||String(c.title||"").toLowerCase().includes(query));
  if(!filtered.length){root.innerHTML='<div class="empty-history">No saved chats yet.</div>';return}
  const groups={};
  filtered.forEach(c=>{const g=groupName(c.updated_at);(groups[g] ||= []).push(c)});
  ["Today","Yesterday","Previous 7 days","Older"].forEach(g=>{
    if(!groups[g])return;
    const title=document.createElement("div");title.className="group-title";title.textContent=g;root.appendChild(title);
    groups[g].forEach(c=>{
      const item=document.createElement("button");item.className="chat-item"+(c.id===currentChatId?" active":"");item.type="button";
      const label=document.createElement("span");label.className="chat-label";label.textContent=c.title||"New chat";
      const del=document.createElement("span");del.className="chat-delete";del.textContent="×";del.title="Delete chat";
      del.addEventListener("click",async e=>{e.stopPropagation();await deleteChat(c.id)});
      item.append(label,del);item.addEventListener("click",()=>selectChat(c.id));root.appendChild(item);
    });
  });
}

async function selectChat(id){
  closeSidebar();
  currentChatId=id;
  $("status").textContent="Loading…";
  const chat=chats.find(c=>c.id===id);
  $("chatTitle").textContent=chat?.title||"Chat";
  const {data,error}=await client.from("ai_messages").select("id,role,content,created_at").eq("chat_id",id).order("created_at",{ascending:true});
  if(error){$("status").textContent="Error";return}
  messages=data||[];
  renderMessages();
  $("status").textContent="Ready";
  renderChats();
}

async function createChat(){
  const {data,error}=await client.from("ai_chats").insert({user_id:currentUser.id,title:"New chat"}).select("id,title,created_at,updated_at").single();
  if(error||!data)throw error||new Error("Could not create chat.");
  chats.unshift(data);
  currentChatId=data.id;
  messages=[];
  $("chatTitle").textContent="New chat";
  renderMessages();
  renderChats();
  closeSidebar();
  return data;
}

async function deleteChat(id){
  const chat=chats.find(c=>c.id===id);
  if(!confirm("Delete this chat?"))return;
  const {error}=await client.from("ai_chats").delete().eq("id",id);
  if(error){alert("Could not delete this chat.");return}
  chats=chats.filter(c=>c.id!==id);
  if(currentChatId===id){
    currentChatId=null;messages=[];$("chatTitle").textContent="New chat";renderMessages();
  }
  renderChats();
}

function renderMessages(){
  const root=$("messages");root.innerHTML="";
  if(!messages.length){
    root.innerHTML='<div class="empty" id="empty"><h1>What should we work on?</h1><p>Your AI workspace is private to your account. Previous conversations stay here and can be reopened anytime.</p><div class="chips"><button class="chip">Help me plan something</button><button class="chip">Explain a topic simply</button><button class="chip">Write something for me</button></div></div>';
    bindChips();return;
  }
  messages.forEach(m=>addMessage(m.role,m.content));
}

function bindChips(){document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{$("prompt").value=ch.textContent;resize();$("prompt").focus()}))}
function addMessage(role,text){
  $("empty")?.remove();
  const row=document.createElement("div");row.className="row "+(role==="user"?"user":"ai");
  if(role!=="user"){const a=document.createElement("div");a.className="avatar";a.textContent="AI";row.appendChild(a)}
  const b=document.createElement("div");b.className="bubble";b.textContent=text;row.appendChild(b);$("messages").appendChild(row);
  requestAnimationFrame(()=>{$("messages").scrollTop=$("messages").scrollHeight});
}
function typing(){
  const row=document.createElement("div");row.className="row ai";row.id="typing";
  const a=document.createElement("div");a.className="avatar";a.textContent="AI";
  const b=document.createElement("div");b.className="bubble";b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  row.append(a,b);$("messages").appendChild(row);requestAnimationFrame(()=>{$("messages").scrollTop=$("messages").scrollHeight});
}
function resize(){$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,140)+"px"}

async function send(text){
  if(!text||busy)return;
  busy=true;$("send").disabled=true;$("prompt").disabled=true;$("status").textContent="Thinking…";
  try{
    if(!currentChatId)await createChat();
    const {error:insertError}=await client.from("ai_messages").insert({chat_id:currentChatId,user_id:currentUser.id,role:"user",content:text});
    if(insertError)throw insertError;
    messages.push({role:"user",content:text});addMessage("user",text);$("prompt").value="";resize();typing();
    async function freshAccessToken(forceRefresh=false){
      if(!forceRefresh){
        const sessionResult=await client.auth.getSession();
        const sessionValue=sessionResult.data.session||null;
        const expiresAt=Number(sessionValue?.expires_at||0)*1000;
        if(sessionValue?.access_token && expiresAt-Date.now()>60000){
          currentSession=sessionValue;
          return sessionValue.access_token;
        }
      }
      const refreshed=await client.auth.refreshSession();
      if(refreshed.error||!refreshed.data.session){
        throw new Error("Your session expired. Please sign in again.");
      }
      currentSession=refreshed.data.session;
      return currentSession.access_token;
    }

    async function requestAi(token){
      return fetch(API,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+token
        },
        body:JSON.stringify({chat_id:currentChatId})
      });
    }

    async function requestAiWithRetry(token){
      try{
        let response=await requestAi(token);

        if(response.status===401){
          token=await freshAccessToken(true);
          return requestAi(token);
        }

        if(response.status===502||response.status===503||response.status===504){
          await new Promise(resolve=>setTimeout(resolve,450));
          return requestAi(token);
        }

        return response;
      }catch(error){
        await new Promise(resolve=>setTimeout(resolve,450));
        return requestAi(token);
      }
    }

    let accessToken=await freshAccessToken();
    let r=await requestAiWithRetry(accessToken);

    const data=await r.json().catch(()=>({}));
    $("typing")?.remove();
    if(!r.ok)throw new Error(data.error||"AI request failed.");
    const {data:updated,error:reloadError}=await client.from("ai_messages").select("id,role,content,created_at").eq("chat_id",currentChatId).order("created_at",{ascending:true});
    if(reloadError)throw reloadError;
    messages=updated||[];
    $("chatTitle").textContent=chats.find(c=>c.id===currentChatId)?.title||data.reply?.slice(0,55)||"Chat";
    await migrateLocalHistory();
  await loadChats();
    const fresh=chats.find(c=>c.id===currentChatId);if(fresh)$("chatTitle").textContent=fresh.title;
    renderMessages();$("status").textContent=data.memory_saved?"Saved to memory":"Ready";
  }catch(e){
    $("typing")?.remove();
    addMessage("model","Sorry — "+(e.message||"Something went wrong."));
    $("status").textContent="Error";
    if(String(e.message||"").toLowerCase().includes("session")){await client.auth.signOut({scope:"local"});location.href="login.html";return}
  }finally{busy=false;$("send").disabled=false;$("prompt").disabled=false;$("prompt").focus()}
}

async function loadMemories(){
  const {data,error}=await client.from("ai_memories").select("id,memory,category,updated_at").order("updated_at",{ascending:false}).limit(200);
  const root=$("memoryList");root.innerHTML="";
  if(error){root.innerHTML='<div class="no-memories">Could not load memories.</div>';return}
  if(!data?.length){root.innerHTML='<div class="no-memories">Nothing saved yet.<br>Say “Remember that…” in a chat and I can save it.</div>';return}
  data.forEach(m=>{
    const row=document.createElement("div");row.className="memory-item";
    const body=document.createElement("div");body.className="memory-text";
    const cat=document.createElement("div");cat.className="memory-cat";cat.textContent=m.category||"general";
    const text=document.createElement("div");text.textContent=m.memory;body.append(cat,text);
    const del=document.createElement("button");del.className="memory-delete";del.textContent="×";del.title="Forget this";
    del.addEventListener("click",async()=>{const {error}=await client.from("ai_memories").delete().eq("id",m.id);if(!error)loadMemories()});
    row.append(body,del);root.appendChild(row);
  });
}

$("form").addEventListener("submit",e=>{e.preventDefault();const text=$("prompt").value.trim();if(!text)return;send(text)});
$("prompt").addEventListener("input",resize);
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
$("newChat").addEventListener("click",()=>{currentChatId=null;messages=[];$("chatTitle").textContent="New chat";$("status").textContent="Ready";renderMessages();renderChats();closeSidebar();$("prompt").focus()});
$("search").addEventListener("input",renderChats);
$("menu").addEventListener("click",openSidebar);
$("home").addEventListener("click",()=>location.href="index.html");
$("settings").addEventListener("click",()=>location.href="settings.html");
$("memories").addEventListener("click",()=>{$("memoryModal").classList.add("open");loadMemories();closeSidebar()});
$("memoryBtn").addEventListener("click",()=>$("memoryModal").classList.add("open"));
$("closeMemory").addEventListener("click",()=>$("memoryModal").classList.remove("open"));
$("memoryModal").addEventListener("click",e=>{if(e.target===$("memoryModal"))$("memoryModal").classList.remove("open")});

async function init(){
  if(!await session()){location.href="login.html";return}
  if(!window.OurSpaceGateway.isUnlocked(currentUser.id)){location.href="/calculator.html";return}
  document.documentElement.classList.remove("gateway-pending");
  $("username").textContent=currentUser?.user_metadata?.username||"Private AI";
  window.OurSpaceTheme?.apply?.(window.OurSpaceTheme.getCookie?.()||"warm");
  await loadChats();
  if(chats.length)await selectChat(chats[0].id);else renderMessages();
}
client.auth.onAuthStateChange((event,sessionValue)=>{if(event==="SIGNED_OUT"||!sessionValue)location.href="login.html"});
init();
</script>
