t-size:8px;font-weight:900;text-transform:uppercase}.memory-text{margin-top:4px;font-size:10.5px;line-height:1.55}.memory-delete{width:28px;height:28px;border:0;border-radius:8px;background:var(--surface);color:var(--muted);font-size:15px}.no-memories{text-align:center;color:var(--muted);font-size:10.5px;line-height:1.65;padding:25px 10px}
@media(max-width:900px){.sidebar{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(300px,88vw);padding:13px;background:var(--bg);box-shadow:24px 0 70px rgba(21,43,70,.18);transform:translateX(-105%);transition:transform .18s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:grid;width:36px;padding:0}.shell{gap:0}.workspace{width:100%}}

<body>
<div class="app"><div class="shell">
<aside class="sidebar" id="sidebar" aria-label="AI conversations">
<div class="side-head"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg></div><div><div class="brand-title">OUR SPACE</div><div class="brand-sub" id="username">Private AI</div></div></div></div>
<button class="new-chat" id="newChat" type="button">+ New chat</button>
<div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input class="search" id="search" type="search" placeholder="Search chats" aria-label="Search chats"></div>
<div class="history" id="history"></div>
<div class="side-foot"><button class="side-button" id="memories" type="button">Memory</button><button class="side-button" id="home" type="button">Home</button></div>
</aside>
<main class="workspace">
<div class="topbar"><button class="top-button mobile-menu" id="menu" type="button" aria-label="Open conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="top-button" id="settings" type="button"><span>Settings</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg></button></div>
<section class="card">
<header class="head"><div class="head-main"><div class="ai-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg></div><div><div class="head-title" id="chatTitle">Our Space AI</div><div class="head-status" aria-live="polite"><span class="status-dot live" id="statusDot"></span><span id="status">Ready</span></div></div></div><button class="head-button" id="memoryBtn" type="button"><span>Memory</span></button></header>
<div class="messages" id="messages" aria-live="polite" aria-busy="false"><div class="message-stack" id="messageStack"></div></div>
<form class="composer" id="form"><div class="composer-inner"><div class="composebox"><textarea id="prompt" class="prompt" rows="1" maxlength="6000" placeholder="Ask Our Space AI anything..." aria-label="Message Our Space AI"></textarea><button id="send" class="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg></button><button id="stop" class="stop" type="button" aria-label="Stop generating"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button></div><div class="composer-foot"><span>Enter to send · Shift + Enter for a new line</span><span id="charCount">0 / 6000</span></div></div></form>
</section></main></div></div>
<div class="modal-layer" id="memoryModal" role="dialog" aria-modal="true" aria-labelledby="memoryTitle"><div class="modal"><div class="modal-head"><div class="modal-title" id="memoryTitle">What I remember about you</div><button class="close" id="closeMemory" type="button" aria-label="Close memory">×</button></div><div class="modal-body" id="memoryList"></div></div></div>
<script>
const SUPABASE_URL="https://ywflohxufmfydkpkkqly.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";
const API="/api/ai";const {createClient}=supabase;
const client=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
let currentUser=null,currentSession=null,currentChatId=null,chats=[],messages=[],busy=false,abortController=null,streamingBubble=null;

function groupName(v){const d=new Date(v),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);const w=new Date(n);w.setDate(n.getDate()-7);if(d.toDateString()===n.toDateString())return"Today";if(d.toDateString()===y.toDateString())return"Yesterday";if(d>=w)return"Previous 7 days";return"Older"}
function time(v){return new Date(v).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function closeSidebar(){$("sidebar").classList.remove("open")}function openSidebar(){$("sidebar").classList.add("open")}
function status(text,state="live"){$("status").textContent=text;$("statusDot").className="status-dot "+state}
function setBusy(v){busy=v;$("form").classList.toggle("generating",v);$("prompt").disabled=v;$("messages").setAttribute("aria-busy",String(v));if(!v)$("prompt").focus()}
function scrollBottom(force=false){const r=$("messages"),near=r.scrollHeight-r.scrollTop-r.clientHeight<150;if(force||near)requestAnimationFrame(()=>r.scrollTop=r.scrollHeight)}
function resize(){const p=$("prompt");p.style.height="auto";p.style.height=Math.min(p.scrollHeight,150)+"px";$("charCount").textContent=p.value.length.toLocaleString()+" / 6000"}
async function session(){const r=await client.auth.getSession();if(r.error||!r.data.session)return false;currentSession=r.data.session;const u=await client.auth.getUser();if(u.error||!u.data.user)return false;currentUser=u.data.user;return true}
async function token(force=false){if(!force){const r=await client.auth.getSession(),s=r.data.session;if(s?.access_token&&Number(s.expires_at||0)*1000-Date.now()>60000){currentSession=s;return s.access_token}}const r=await client.auth.refreshSession();if(r.error||!r.data.session)throw new Error("Your session expired. Please sign in again.");currentSession=r.data.session;return currentSession.access_token}

async function migrateLocalHistory(){const K="our_space_ai_history_v1",D="our_space_ai_history_migrated_v1";if(localStorage.getItem(D))return;let old=[];try{old=JSON.parse(localStorage.getItem(K)||"[]")}catch{}old=Array.isArray(old)?old.filter(m=>m&&(m.role==="user"||m.role==="model")&&typeof m.content==="string").slice(-100):[];if(!old.length){localStorage.setItem(D,"1");return}try{const title=(old.find(m=>m.role==="user")?.content||"Imported chat").replace(/\s+/g," ").trim().slice(0,55)||"Imported chat";const c=await client.from("ai_chats").insert({user_id:currentUser.id,title}).select("id").single();if(c.error)throw c.error;const rows=old.map(m=>({chat_id:c.data.id,user_id:currentUser.id,role:m.role,content:m.content}));const r=await client.from("ai_messages").insert(rows);if(r.error)throw r.error;localStorage.removeItem(K);localStorage.setItem(D,"1")}catch(e){console.warn("AI history migration",e)}}
async function loadChats(){const r=await client.from("ai_chats").select("id,user_id,title,created_at,updated_at").order("updated_at",{ascending:false}).limit(1000);if(r.error){console.warn(r.error);return}chats=(r.data||[]).filter(c=>String(c.user_id)===String(currentUser.id));renderChats()}
function renderChats(){const root=$("history"),q=$("search").value.trim().toLowerCase();root.innerHTML="";const list=chats.filter(c=>!q||String(c.title||"").toLowerCase().includes(q));if(!list.length){root.innerHTML='<div class="empty-history">No saved chats yet.</div>';return}const groups={};list.forEach(c=>(groups[groupName(c.updated_at)]??=[]).push(c));["Today","Yesterday","Previous 7 days","Older"].forEach(g=>{if(!groups[g])return;const h=document.createElement("div");h.className="group-title";h.textContent=g;root.appendChild(h);groups[g].forEach(c=>{const item=document.createElement("div");item.className="chat-item"+(c.id===currentChatId?" active":"");item.tabIndex=0;const label=document.createElement("span");label.className="chat-label";label.textContent=c.title||"New chat";const t=document.createElement("span");t.className="chat-time";t.textContent=time(c.updated_at);const d=document.createElement("button");d.className="chat-delete";d.type="button";d.textContent="×";d.title="Delete chat";d.addEventListener("click",e=>{e.stopPropagation();deleteChat(c.id)});item.append(label,t,d);item.onclick=()=>selectChat(c.id);item.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectChat(c.id)}};root.appendChild(item)})})}
async function selectChat(id){if(busy)return;closeSidebar();currentChatId=id;status("Loading…","busy");const c=chats.find(x=>x.id===id);$("chatTitle").textContent=c?.title||"Chat";const r=await client.from("ai_messages").select("id,role,content,created_at").eq("chat_id",id).order("created_at",{ascending:true});if(r.error){showError("Could not load this chat.");status("Error");return}messages=r.data||[];renderMessages();status("Ready");renderChats()}
async function createChat(){const r=await client.from("ai_chats").insert({user_id:currentUser.id,title:"New chat"}).select("id,title,created_at,updated_at").single();if(r.error||!r.data)throw r.error||new Error("Could not create chat.");chats.unshift(r.data);currentChatId=r.data.id;messages=[];$("chatTitle").textContent="New chat";renderMessages();renderChats();closeSidebar()}
async function deleteChat(id){if(busy||!confirm("Delete this chat?"))return;const r=await client.from("ai_chats").delete().eq("id",id);if(r.error){alert("Could not delete this chat.");return}chats=chats.filter(c=>c.id!==id);if(currentChatId===id){currentChatId=null;messages=[];$("chatTitle").textContent="Our Space AI";renderMessages()}renderChats()}

function welcome(){const root=document.createElement("div");root.className="welcome";const inner=document.createElement("div");inner.className="welcome-inner";inner.innerHTML='<div class="welcome-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg></div><h1>What should we work on?</h1><p>Your private AI can use saved memories and the shared couple conversation when relevant. Conversations stay saved to your account.</p><div class="prompt-grid"><button class="prompt-card" type="button">Help me understand something that happened between us.</button><button class="prompt-card" type="button">Help me write a natural message to Salma.</button><button class="prompt-card" type="button">Analyze our recent communication honestly.</button><button class="prompt-card" type="button">Help me plan something thoughtful for us.</button></div>';root.appendChild(inner);root.querySelectorAll(".prompt-card").forEach(b=>b.onclick=()=>{$("prompt").value=b.textContent;resize();$("prompt").focus()});return root}
function messageEl(m){const row=document.createElement("article");row.className="message "+(m.role==="user"?"user":"ai");const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent="AI";const wrap=document.createElement("div");wrap.className="bubble-wrap";const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=m.content||"";const meta=document.createElement("div");meta.className="message-meta";const tm=document.createElement("span");tm.className="message-time";tm.textContent=m.created_at?time(m.created_at):"";meta.appendChild(tm);if(m.role==="model"){const cp=document.createElement("button");cp.className="message-action";cp.type="button";cp.textContent="Copy";cp.onclick=()=>copy(m.content||"",cp);meta.appendChild(cp)}wrap.append(bubble,meta);if(m.role==="model")row.append(avatar,wrap);else row.append(wrap);return row}
function renderMessages(){const root=$("messageStack");root.innerHTML="";if(!messages.length){root.appendChild(welcome());return}messages.forEach(m=>root.appendChild(messageEl(m)));scrollBottom(true)}
function typing(){const root=$("messageStack"),row=document.createElement("div");row.className="typing-row";row.id="typing";row.innerHTML='<div class="avatar">AI</div><div class="typing-bubble"><div class="typing" aria-label="AI is thinking"><span></span><span></span><span></span></div></div>';root.appendChild(row);scrollBottom(true)}
function streaming(){ $("typing")?.remove();const root=$("messageStack"),row=document.createElement("article");row.className="message ai";row.id="streamingMessage";row.innerHTML='<div class="avatar">AI</div><div class="bubble-wrap"><div class="bubble"></div><div class="message-meta"><span class="message-time"></span></div></div>';root.appendChild(row);streamingBubble=row.querySelector(".bubble");scrollBottom(true)}
function complete(text){const row=$("streamingMessage");if(!row)return;row.removeAttribute("id");row.querySelector(".bubble").textContent=text;const cp=document.createElement("button");cp.className="message-action";cp.type="button";cp.textContent="Copy";cp.onclick=()=>copy(text,cp);row.querySelector(".message-meta").appendChild(cp);messages.push({role:"model",content:text,created_at:new Date().toISOString()});streamingBubble=null}
function errorCard(msg){$("typing")?.remove();$("streamingMessage")?.remove();const c=document.createElement("div");c.className="error-card";c.innerHTML="<strong>AI error</strong> — ";c.appendChild(document.createTextNode(msg||"Something went wrong."));const a=document.createElement("div");a.className="error-actions";const b=document.createElement("button");b.type="button";b.textContent="Try again";b.onclick=retry;a.appendChild(b);c.appendChild(a);$("messageStack").appendChild(c);scrollBottom(true)}
async function copy(text,b){try{await navigator.clipboard.writeText(text);const old=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=old,1000)}catch{}}

async function insertUser(text){const r=await client.from("ai_messages").insert({chat_id:currentChatId,user_id:currentUser.id,role:"user",content:text}).select("id,role,content,created_at").single();if(r.error||!r.data)throw r.error||new Error("Could not save your message.");messages.push(r.data);const root=$("messageStack");if(root.querySelector(".welcome"))root.innerHTML="";root.appendChild(messageEl(r.data));scrollBottom(true)}
async function consume(response){if(!response.ok){const d=await response.json().catch(()=>({}));throw new Error(d.error||"The AI service returned an error.")}if(!response.body)throw new Error("The AI service returned no stream.");streaming();status("Writing…","busy");const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="",answer="";const event=raw=>{const line=raw.split(/\r?\n/).find(x=>x.startsWith("data:"));if(!line)return;let d;try{d=JSON.parse(line.slice(5).trim())}catch{return}if(d.type==="start"){status("Writing…","busy")}else if(d.type==="delta"){answer+=String(d.text||"");if(streamingBubble)streamingBubble.textContent=answer;scrollBottom(false)}else if(d.type==="error"){throw new Error(d.message||"AI generation failed.")}else if(d.type==="done"){complete(String(d.reply||answer));status(d.memory_saved?"Saved to memory":"Ready");loadChats().then(()=>{const c=chats.find(x=>x.id===currentChatId);if(c)$("chatTitle").textContent=c.title});scrollBottom(true)}};while(true){const x=await reader.read();if(x.done)break;buffer+=decoder.decode(x.value,{stream:true});const parts=buffer.split(/\n\n/);buffer=parts.pop()||"";parts.forEach(event)}buffer+=decoder.decode();if(buffer.trim())event(buffer);if(!answer)throw new Error("The AI returned an empty response.")}
async function generate(){if(!currentChatId||busy)return;busy=true;abortController=new AbortController();setBusy(true);status("Preparing…","busy");typing();try{const t=await token();const body=JSON.stringify({chat_id:currentChatId});let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+t},body,signal:abortController.signal});if(r.status===401){const fresh=await token(true);r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+fresh},body,signal:abortController.signal)}await consume(r)}catch(e){if(e?.name==="AbortError"){$("typing")?.remove();$("streamingMessage")?.remove();streamingBubble=null;status("Stopped")}else{errorCard(e?.message||"The AI service is temporarily unavailable.");status("Error")}}finally{abortController=null;busy=false;setBusy(false)}}
async function send(text){text=String(text||"").trim();if(!text||busy)return;try{if(!currentChatId)await createChat();setBusy(true);status("Saving…","busy");await insertUser(text);$("prompt").value="";resize();await generate()}catch(e){errorCard(e?.message||"Could not send your message.");status("Error");busy=false;setBusy(false)}}
async function retry(){if(busy||!currentChatId)return;document.querySelectorAll(".error-card").forEach(x=>x.remove());await generate()}
function newChat(){if(busy)return;currentChatId=null;messages=[];$("chatTitle").textContent="Our Space AI";status("Ready");renderMessages();renderChats();closeSidebar();$("prompt").focus()}
async function memories(){const root=$("memoryList");root.innerHTML='<div class="no-memories">Loading memories…</div>';const r=await client.from("ai_memories").select("id,memory,category").order("updated_at",{ascending:false}).limit(200);root.innerHTML="";if(r.error){root.innerHTML='<div class="no-memories">Could not load memories.</div>';return}if(!r.data?.length){root.innerHTML='<div class="no-memories">Nothing saved yet.<br>Say “Remember that…” in a chat to save something intentionally.</div>';return}r.data.forEach(m=>{const row=document.createElement("div");row.className="memory-item";const body=document.createElement("div");body.className="memory-body";const cat=document.createElement("div");cat.className="memory-cat";cat.textContent=m.category||"general";const text=document.createElement("div");text.className="memory-text";text.textContent=m.memory;body.append(cat,text);const del=document.createElement("button");del.className="memory-delete";del.type="button";del.textContent="×";del.title="Forget this memory";del.onclick=async()=>{const x=await client.from("ai_memories").delete().eq("id",m.id);if(!x.error)memories()};row.append(body,del);root.appendChild(row)})}

$("form").onsubmit=e=>{e.preventDefault();const t=$("prompt").value.trim();if(t)send(t)};
$("prompt").oninput=resize;$("prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}};
$("stop").onclick=()=>abortController?.abort();$("newChat").onclick=newChat;$("search").oninput=renderChats;$("menu").onclick=openSidebar;$("home").onclick=()=>location.href="index.html";$("settings").onclick=()=>location.href="settings.html";
$("memories").onclick=()=>{$("memoryModal").classList.add("open");memories();closeSidebar()};$("memoryBtn").onclick=()=>{$("memoryModal").classList.add("open");memories()};$("closeMemory").onclick=()=>$("memoryModal").classList.remove("open");$("memoryModal").onclick=e=>{if(e.target===$("memoryModal"))$("memoryModal").classList.remove("open")};document.onkeydown=e=>{if(e.key==="Escape"){$("memoryModal").classList.remove("open");closeSidebar()}};

async function init(){if(!await session()){location.href="login.html";return}if(!window.OurSpaceGateway?.isUnlocked(currentUser.id)){location.href="/calculator.html";return}document.documentElement.classList.remove("gateway-pending");window.OurSpaceTheme?.apply?.(window.OurSpaceTheme.getCookie?.()||"warm");$("username").textContent=currentUser?.user_metadata?.username||"Private AI";await migrateLocalHistory();await loadChats();if(chats.length)await selectChat(chats[0].id);else renderMessages();resize()}
client.auth.onAuthStateChange((event,s)=>{if(event==="SIGNED_OUT"||!s)location.href="login.html"});init();
</script>
