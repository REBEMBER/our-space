<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/calculator.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Space">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Space AI</title>
<script src="/theme.js?v=final"></script>
<style>
:root{--bg:#F8F0EC;--surface:#fff;--soft:#FFF8F5;--navy:#152B46;--text:#26313D;--muted:#7A8794;--border:rgba(21,43,70,.10);--accent:#F3B29F;--user:#152B46;--userText:#fff}
html[data-theme="dark"]{--bg:#0B121B;--surface:#182431;--soft:#202F3E;--navy:#F1F6FA;--text:#EDF3F7;--muted:#A6B5C1;--border:rgba(237,243,247,.14);--accent:#EFA58C;--user:#F1F6FA;--userText:#0B121B}
html[data-theme="ocean"]{--bg:#ECF7FC;--navy:#0E4266;--soft:#F4FBFE;--text:#193547;--muted:#6A8495;--border:rgba(14,66,102,.12);--accent:#72CAE6;--user:#0E4266}
html[data-theme="forest"]{--bg:#EEF6F1;--navy:#164638;--soft:#F4FAF6;--text:#253A32;--muted:#71857D;--border:rgba(22,70,56,.12);--accent:#DDA187;--user:#164638}
html[data-theme="blush"]{--bg:#FFF1F5;--navy:#762B49;--soft:#FFF7F9;--text:#3D2731;--muted:#8D6A78;--border:rgba(118,43,73,.12);--accent:#F3A2BC;--user:#762B49}
html[data-theme="sunset"]{--bg:#FFF4EC;--navy:#71381F;--soft:#FFF9F5;--text:#3E2A22;--muted:#8A6F63;--border:rgba(113,56,31,.12);--accent:#F4A77E;--user:#71381F}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(650px 400px at 100% 0%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),var(--bg)}
button,textarea{font:inherit}.app{height:100%;padding:10px}.shell{height:100%;max-width:1180px;margin:auto;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 10px}.brand{display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:13px;background:var(--navy);color:var(--surface);display:grid;place-items:center}.mark svg{width:18px}.title{font-weight:800;letter-spacing:.09em;font-size:14px;color:var(--navy)}.sub{font-size:10px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px}.topbtn{height:40px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--navy);font-size:11px;font-weight:700;cursor:pointer}.chat{min-height:0;flex:1;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 18px 55px rgba(21,43,70,.08)}.head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.ai{display:flex;gap:9px;align-items:center}.dot{width:30px;height:30px;border-radius:10px;background:var(--navy);color:var(--surface);display:grid;place-items:center}.dot svg{width:15px}.name{font-size:13px;font-weight:800;color:var(--navy)}.status{font-size:10px;color:var(--muted);margin-top:2px}.new{border:1px solid var(--border);background:var(--soft);color:var(--navy);border-radius:10px;padding:8px 10px;font-size:10px;font-weight:700;cursor:pointer}.messages{min-height:0;flex:1;overflow:auto;padding:17px 14px 22px;display:flex;flex-direction:column;gap:12px}.empty{margin:auto;text-align:center;max-width:480px;padding:20px}.empty h1{font-size:25px;color:var(--navy);letter-spacing:-.04em;margin:0}.empty p{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0 14px}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip{border:1px solid var(--border);background:var(--soft);color:var(--navy);border-radius:999px;padding:8px 11px;font-size:10px;cursor:pointer}.row{display:flex;align-items:flex-end;gap:7px}.row.user{justify-content:flex-end}.bubble{max-width:min(82%,720px);padding:11px 13px;border-radius:16px;background:var(--soft);border:1px solid var(--border);white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.62}.row.user .bubble{background:var(--user);color:var(--userText);border-color:transparent;border-bottom-right-radius:6px}.row.ai .bubble{border-bottom-left-radius:6px}.avatar{width:26px;height:26px;border-radius:9px;background:var(--soft);border:1px solid var(--border);color:var(--navy);display:grid;place-items:center;font-size:9px;font-weight:800}.composer{padding:9px;border-top:1px solid var(--border)}.composebox{display:flex;gap:7px;align-items:flex-end;background:var(--soft);border:1px solid var(--border);border-radius:15px;padding:7px}.prompt{flex:1;border:0;outline:0;background:transparent;color:var(--text);resize:none;min-height:22px;max-height:120px;padding:6px;font-size:12px;line-height:1.45}.send{width:36px;height:36px;border:0;border-radius:11px;background:var(--navy);color:var(--surface);display:grid;place-items:center;cursor:pointer}.send:disabled{opacity:.4;cursor:default}.send svg{width:16px}.hint{text-align:center;color:var(--muted);font-size:9px;padding:5px 2px 0}.typing{display:flex;gap:3px}.typing span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:p 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes p{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media(max-width:700px){.app{padding:7px}.top{padding-bottom:7px}.sub{display:none}.topbtn{width:40px;padding:0}.topbtn span{display:none}.chat{border-radius:18px}.messages{padding:14px 10px 18px}.bubble{max-width:88%}}
</style>
</head>
<body>
<div class="app"><div class="shell">
<header class="top">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg></div><div><div class="title">OUR SPACE</div><div class="sub">Private AI</div></div></div>
  <div class="actions"><button class="topbtn" id="home" title="Home" aria-label="Home">Home</button><button class="topbtn" id="settings" title="Settings" aria-label="Settings">Settings</button></div>
</header>
<section class="chat">
  <header class="head"><div class="ai"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg></div><div><div class="name">Our Space AI</div><div class="status" id="status">Ready</div></div></div><button class="new" id="new">New chat</button></header>
  <div class="messages" id="messages"><div class="empty" id="empty"><h1>What should we work on?</h1><p>Ask anything. This AI conversation is separate from your private couples chat.</p><div class="chips"><button class="chip">Help me plan something</button><button class="chip">Explain a topic simply</button><button class="chip">Write something for me</button></div></div></div>
  <form class="composer" id="form"><div class="composebox"><textarea id="prompt" class="prompt" rows="1" maxlength="6000" placeholder="Message Our Space AI..."></textarea><button id="send" class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg></button></div><div class="hint">Do not share passwords or API keys.</div></form>
</section>
</div></div>
<script>
const STORE="our_space_ai_history_v1";const ENDPOINT="/api/ai";const $=id=>document.getElementById(id);
let history=[];let busy=false;
function token(){for(const key of Object.keys(localStorage)){if(key.includes("auth-token")){try{const v=JSON.parse(localStorage.getItem(key));if(v?.access_token)return v.access_token}catch{}}}return ""}
function save(){try{localStorage.setItem(STORE,JSON.stringify(history.slice(-30)))}catch{}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||"[]");if(Array.isArray(v))history=v.filter(x=>x&&(x.role==="user"||x.role==="model")&&typeof x.content==="string").slice(-30)}catch{}}
function bottom(){requestAnimationFrame(()=>{$("messages").scrollTop=$("messages").scrollHeight})}
function add(role,text){$("empty")?.remove();const row=document.createElement("div");row.className="row "+(role==="user"?"user":"ai");if(role!=="user"){const a=document.createElement("div");a.className="avatar";a.textContent="AI";row.appendChild(a)}const b=document.createElement("div");b.className="bubble";b.textContent=text;row.appendChild(b);$("messages").appendChild(row);bottom()}
function typing(){const row=document.createElement("div");row.className="row ai";row.id="typing";const a=document.createElement("div");a.className="avatar";a.textContent="AI";const b=document.createElement("div");b.className="bubble";b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';row.append(a,b);$("messages").appendChild(row);bottom()}
function render(){const m=$("messages");m.innerHTML="";if(!history.length){m.innerHTML='<div class="empty" id="empty"><h1>What should we work on?</h1><p>Ask anything. This AI conversation is separate from your private couples chat.</p><div class="chips"><button class="chip">Help me plan something</button><button class="chip">Explain a topic simply</button><button class="chip">Write something for me</button></div></div>';bindChips();return}history.forEach(x=>add(x.role,x.content))}
function bindChips(){document.querySelectorAll(".chip").forEach(x=>x.addEventListener("click",()=>{$("prompt").value=x.textContent;resize();$("prompt").focus()}))}
function resize(){$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,120)+"px"}
async function init(){if(!token()){location.href="login.html";return}window.OurSpaceTheme?.apply?.(window.OurSpaceTheme.getCookie?.()||"warm");load();render();bindChips()}
async function send(text){if(!text||busy)return;history.push({role:"user",content:text});add("user",text);save();busy=true;$("send").disabled=true;$("prompt").disabled=true;$("status").textContent="Thinking…";typing();try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token()},body:JSON.stringify({messages:history.slice(-20)})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"AI request failed.");const reply=String(data.reply||"").trim();if(!reply)throw new Error("Empty AI response.");$("typing")?.remove();history.push({role:"model",content:reply});add("model",reply);save();$("status").textContent="Ready"}catch(e){$("typing")?.remove();add("model","Sorry — "+(e.message||"Something went wrong."));$("status").textContent="Error"}finally{busy=false;$("send").disabled=false;$("prompt").disabled=false;$("prompt").focus()}}
$("form").addEventListener("submit",e=>{e.preventDefault();const t=$("prompt").value.trim();if(!t)return;$("prompt").value="";resize();send(t)});$("prompt").addEventListener("input",resize);$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});$("new").addEventListener("click",()=>{history=[];save();render();bindChips();$("status").textContent="Ready"});$("home").onclick=()=>location.href="index.html";$("settings").onclick=()=>location.href="settings.html";init();
</script>
</body>
</html>
