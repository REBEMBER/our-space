<!-- production recovery baseline: keep chat deployment pinned to verified source -->
<!-- chat runtime stabilized -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/calculator.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Space">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Our Space</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js?v=final"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#F8F0EC;
      --navy:#152B46;
      --navy-light:#1D3B60;
      --peach:#F3B29F;
      --blue:#DCEAF5;
      --white:#FFFFFF;
      --text:#26313D;
      --muted:#7A8794;
      --border:rgba(21,43,70,.10);
      --input-border:rgba(21,43,70,.16);
      --soft-border:rgba(21,43,70,.07);
      --soft-surface:#FBF8F6;
      --action:#152B46;
      --action-text:#FFFFFF;
      --shadow:0 22px 60px rgba(21,43,70,.08);
      --small-shadow:0 10px 28px rgba(21,43,70,.07);
      --bubble-shadow:0 6px 20px rgba(21,43,70,.055);
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;height:100%;margin:0;
      background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body{overflow:hidden}
    button,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible{
      outline:3px solid color-mix(in srgb,var(--peach) 70%,#fff);
      outline-offset:2px;
    }

    .app{
      position:relative;width:100%;height:100dvh;min-height:0;overflow:hidden;
      display:flex;flex-direction:column;
      background:
        radial-gradient(520px 360px at 100% 0%,color-mix(in srgb,var(--peach) 23%,transparent),transparent 70%),
        radial-gradient(520px 360px at 0% 100%,color-mix(in srgb,var(--blue) 62%,transparent),transparent 72%),
        var(--bg);
    }

    /* APP BAR */
    .header{
      flex:0 0 auto;position:relative;z-index:50;
      padding:max(10px,env(safe-area-inset-top)) 14px 8px;
      background:transparent;
    }
    .header-inner{
      width:min(100%,920px);min-height:58px;margin:0 auto;padding:7px 8px 7px 7px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      border:1px solid var(--border);border-radius:20px;
      background:color-mix(in srgb,var(--white) 82%,transparent);
      box-shadow:var(--small-shadow);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    }
    .header-left,.header-right{display:flex;align-items:center;gap:8px}
    .header-left{min-width:0}.header-right{flex:0 0 auto}
    .header-button{
      width:40px;height:40px;flex:0 0 40px;
      border:1px solid var(--border);border-radius:13px;
      background:var(--white);color:var(--navy);
      display:grid;place-items:center;
      box-shadow:0 6px 14px rgba(21,43,70,.05);
      transition:transform .16s ease,background .16s ease,box-shadow .16s ease;
    }
    .header-button:hover{background:var(--blue);box-shadow:0 8px 18px rgba(21,43,70,.08)}
    .header-button:active{transform:scale(.96)}
    .header-button svg{width:18px;height:18px;stroke:currentColor}
    .header-copy{min-width:0}
    .header-title{
      margin:0;color:var(--navy);font-size:14px;line-height:1.15;
      font-weight:850;letter-spacing:-.015em;
    }
    .header-subtitle{margin:3px 0 0;color:var(--muted);font-size:10px;line-height:1;font-weight:650}
    .header-status{
      display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;
      border-radius:999px;background:var(--soft-surface);border:1px solid var(--soft-border);
      color:var(--muted);font-size:9px;font-weight:800;
    }
    .header-status-dot{
      width:7px;height:7px;border-radius:50%;background:#8BB9A2;
      box-shadow:0 0 0 3px color-mix(in srgb,#8BB9A2 16%,transparent);
    }

    /* TRANSCRIPT */
    .messages-scroll{
      position:relative;flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;
      padding:4px 0 0;-webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;overflow-anchor:none;
      scrollbar-width:thin;scrollbar-color:rgba(21,43,70,.12) transparent;
    }
    .messages-scroll::-webkit-scrollbar{width:7px}
    .messages-scroll::-webkit-scrollbar-track{background:transparent}
    .messages-scroll::-webkit-scrollbar-thumb{background:rgba(21,43,70,.12);border-radius:999px}
    .messages-container{
      width:min(100%,900px);min-height:100%;margin:0 auto;padding:18px 18px 14px;
      display:flex;flex-direction:column;justify-content:flex-start;
    }
    .date-divider{display:flex;justify-content:center;margin:18px 0 11px}
    .date-divider span{
      min-height:24px;padding:0 10px;display:inline-flex;align-items:center;
      border:1px solid var(--soft-border);border-radius:999px;
      background:color-mix(in srgb,var(--white) 74%,transparent);
      color:var(--muted);font-size:9px;line-height:1;font-weight:800;letter-spacing:.03em;
      box-shadow:0 5px 16px rgba(21,43,70,.035);
    }

    /* MESSAGE BUBBLES */
    .message-row{width:100%;display:flex;position:relative;margin:3px 0}
    .message-row.mine{justify-content:flex-end}
    .message-row.theirs{justify-content:flex-start}
    .message-content{position:relative;max-width:min(76%,560px)}
    .message-bubble{
      position:relative;padding:10px 13px 8px;border-radius:19px;
      box-shadow:var(--bubble-shadow);word-break:break-word;overflow-wrap:anywhere;
      transition:transform .12s ease,box-shadow .15s ease;
    }
    .message-row.mine .message-bubble{
      background:var(--action);color:var(--action-text);
      border:1px solid color-mix(in srgb,var(--action) 85%,#fff);
      border-bottom-right-radius:7px;
    }
    .message-row.theirs .message-bubble{
      background:var(--white);color:var(--text);
      border:1px solid var(--border);border-bottom-left-radius:7px;
    }
    .message-row.grouped-mine .message-bubble{border-top-right-radius:12px}
    .message-row.grouped-theirs .message-bubble{border-top-left-radius:12px}
    .message-text,.deleted-content{
      display:block;font-size:14px;line-height:1.48;letter-spacing:-.004em;
    }

    /* MEDIA */
    .message-image-link{
      display:block;max-width:min(100%,540px);overflow:hidden;border-radius:15px;
      background:color-mix(in srgb,var(--navy) 5%,transparent);
    }
    .message-image{
      display:block;width:auto;max-width:100%;max-height:540px;
      border-radius:15px;object-fit:contain;cursor:zoom-in;
    }
    .message-image-loading{
      display:block;min-width:180px;padding:28px 24px;color:var(--muted);
      font-size:10px;text-align:center;
    }
    .message-bubble.image-bubble{padding:6px}
    .message-bubble.image-bubble .message-meta{padding:0 4px 2px}

    /* DELETED */
    .message-bubble.deleted{box-shadow:var(--bubble-shadow)}
    .deleted-label{
      display:block;margin-bottom:4px;color:inherit;opacity:.56;
      font-size:8px;line-height:1;font-weight:850;letter-spacing:.08em;text-transform:uppercase;
    }

    /* META */
    .message-meta{
      margin-top:5px;display:flex;align-items:center;justify-content:flex-end;gap:5px;
      color:inherit;opacity:.55;font-size:8.5px;line-height:1;font-weight:650;
    }
    .message-status{font-weight:800}

    /* MESSAGE ACTIONS */
    .message-menu-trigger{
      position:absolute;right:5px;top:50%;width:27px;height:27px;padding:0;
      transform:translateY(-50%);border:1px solid transparent;border-radius:10px;
      background:transparent;color:currentColor;opacity:0;display:grid;place-items:center;
      transition:opacity .15s ease,background .15s ease,transform .15s ease;
    }
    .message-bubble:hover .message-menu-trigger,.message-menu-trigger:focus-visible{opacity:.52}
    .message-menu-trigger:hover{opacity:1;background:rgba(255,255,255,.10)}
    .message-menu-trigger svg{width:14px;height:14px;fill:currentColor;stroke:none}

    /* Existing JS menu is visually promoted into a centered action bubble. */
    body:has(.message-menu.open)::before{
      content:"";position:fixed;inset:0;z-index:1900;
      background:rgba(21,43,70,.13);backdrop-filter:blur(5px);pointer-events:none;
    }
    .message-menu{
      position:fixed;left:50%;top:50%;width:min(280px,calc(100vw - 36px));min-width:0;
      padding:10px;transform:translate(-50%,-50%);display:none;
      background:var(--white);border:1px solid var(--border);border-radius:21px;
      box-shadow:0 26px 80px rgba(21,43,70,.22);z-index:2000;
    }
    .message-menu.open{display:block;animation:menuPop .16s ease-out}
    .message-menu::before{
      content:"Message actions";display:block;padding:7px 10px 10px;
      color:var(--navy);font-size:13px;font-weight:850;
    }
    .message-menu button{
      width:100%;min-height:45px;padding:0 12px;border:0;border-radius:13px;
      background:transparent;color:var(--navy);text-align:left;font-size:12px;font-weight:800;
    }
    .message-menu button:hover{background:var(--soft-surface)}
    @keyframes menuPop{
      from{opacity:0;transform:translate(-50%,-50%) scale(.97)}
      to{opacity:1;transform:translate(-50%,-50%) scale(1)}
    }

    /* EMPTY / ERROR */
    .empty-state{min-height:100%;display:flex;align-items:center;justify-content:center;padding:50px 20px}
    .empty-card{
      width:min(100%,340px);padding:30px 25px;border:1px solid var(--border);border-radius:24px;
      background:color-mix(in srgb,var(--white) 88%,transparent);box-shadow:var(--shadow);text-align:center;
    }
    .empty-card h2{margin:0 0 7px;color:var(--navy);font-size:18px;font-weight:850}
    .empty-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
    .error-card{
      width:min(100%,580px);margin:28px auto;padding:17px 18px;
      border:1px solid color-mix(in srgb,#A84A42 20%,var(--border));border-radius:16px;
      background:var(--white);color:#7F3732;font-size:12px;line-height:1.5;box-shadow:var(--small-shadow);
    }
    .error-card strong{display:block;margin-bottom:5px}

    /* COMPOSER */
    .composer-area{
      position:relative;flex:0 0 auto;width:100%;z-index:60;
      padding:9px 14px max(13px,env(safe-area-inset-bottom));background:transparent;
    }
    .composer-row{width:min(100%,920px);margin:0 auto;display:flex;align-items:flex-end;gap:9px}
    .composer{
      width:min(100%,900px);margin:0 auto;display:flex;align-items:flex-end;gap:8px;
      padding:7px;border:1px solid var(--border);border-radius:21px;
      background:color-mix(in srgb,var(--white) 90%,transparent);
      box-shadow:0 18px 44px rgba(21,43,70,.10);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    }
    .composer-row .composer{width:auto;flex:1;margin:0}
    .photo-input{display:none}
    .attachment-button{
      width:42px;height:42px;flex:0 0 42px;padding:0;border:1px solid var(--border);
      border-radius:14px;background:var(--white);color:var(--navy);display:grid;place-items:center;
      box-shadow:0 5px 14px rgba(21,43,70,.045);transition:background .15s ease,transform .15s ease;
    }
    .attachment-button:hover:not(:disabled){background:var(--blue)}
    .attachment-button:active:not(:disabled){transform:scale(.95)}
    .attachment-button:disabled{opacity:.5;cursor:default}
    .attachment-button svg{width:18px;height:18px;stroke:currentColor}
    .input-shell{
      flex:1;min-width:0;display:flex;align-items:flex-end;min-height:44px;
      padding:2px 8px 2px 14px;border:1.5px solid var(--input-border);border-radius:16px;
      background:var(--white);box-shadow:0 5px 15px rgba(21,43,70,.045);
      transition:border-color .15s ease,box-shadow .15s ease;
    }
    .input-shell:focus-within{
      border-color:color-mix(in srgb,var(--navy) 42%,transparent);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 86%,transparent);
    }
    .input-icon{
      width:18px;height:18px;margin:0 8px 8px 0;flex:0 0 18px;
      color:var(--navy);opacity:.48;display:grid;place-items:center;
    }
    .input-icon svg{width:17px;height:17px;stroke:currentColor}
    .message-input{
      width:100%;min-height:38px;max-height:130px;padding:8px 2px;border:0;outline:0;resize:none;
      background:transparent;color:var(--text);font-size:14px;line-height:1.4;
    }
    .message-input::placeholder{color:var(--muted);opacity:1}
    .send-button{
      height:44px;min-width:68px;flex:0 0 auto;padding:0 13px;border:0;border-radius:15px;
      background:var(--action);color:var(--action-text);display:flex;align-items:center;justify-content:center;
      gap:7px;box-shadow:0 10px 22px color-mix(in srgb,var(--action) 20%,transparent);
      transition:transform .15s ease,background .15s ease;
    }
    .send-button:hover{background:var(--navy-light)}
    .send-button:active{transform:scale(.95)}
    .send-button:disabled{opacity:.55;cursor:default}
    .send-button svg{width:16px;height:16px;stroke:currentColor}
    .send-label{font-size:11px;font-weight:850}

    /* AI REPLY ASSIST */
    .reply-assist{
      width:min(100%,920px);margin:0 auto 8px;padding:10px;border:1px solid var(--border);
      border-radius:18px;background:color-mix(in srgb,var(--white) 94%,transparent);
      box-shadow:0 14px 34px rgba(21,43,70,.09);display:none;
      backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
    }
    .reply-assist.visible{display:block}
    .reply-assist-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
    .reply-assist-title{color:var(--navy);font-size:10px;font-weight:850;letter-spacing:.05em;text-transform:uppercase}
    .reply-assist-status{color:var(--muted);font-size:9px}
    .reply-assist-close{
      width:27px;height:27px;border:1px solid var(--border);border-radius:9px;
      background:var(--soft-surface);color:var(--navy);font-size:15px;line-height:1;
    }
    .reply-assist-suggestions{display:grid;gap:7px}
    .reply-assist-suggestion{
      width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--border);
      border-radius:13px;background:var(--soft-surface);color:var(--text);text-align:left;font-size:12px;
      line-height:1.45;white-space:pre-wrap;word-break:break-word;
      transition:background .15s ease,border-color .15s ease,opacity .15s ease,transform .15s ease;
    }
    .reply-assist-suggestion:hover:not(:disabled){
      background:var(--white);border-color:color-mix(in srgb,var(--navy) 20%,var(--border));transform:translateY(-1px);
    }
    .reply-assist-suggestion.sent{opacity:.65;cursor:default}
    .reply-assist-actions{display:flex;align-items:center;gap:6px;margin-top:7px}
    .reply-assist-note{color:var(--muted);font-size:9px}
    .best-reply-button{
      height:44px;min-width:94px;flex:0 0 auto;padding:0 12px;border:1px solid var(--border);
      border-radius:15px;background:var(--white);color:var(--navy);display:none;align-items:center;
      justify-content:center;gap:7px;box-shadow:0 8px 18px rgba(21,43,70,.065);font-size:10px;font-weight:850;
    }
    .best-reply-button.visible{display:flex}
    .best-reply-button:hover:not(:disabled){background:var(--blue)}
    .best-reply-button:disabled{opacity:.55;cursor:default}
    .best-reply-button svg{width:16px;height:16px;stroke:currentColor}

    /* THEMES */
    html[data-theme="dark"]{
      --bg:#0B121B;--navy:#F1F6FA;--navy-light:#C7D9E6;--peach:#EFA58C;--blue:#263B50;
      --white:#182431;--text:#EDF3F7;--muted:#A6B5C1;--border:rgba(237,243,247,.14);
      --input-border:rgba(237,243,247,.20);--soft-border:rgba(237,243,247,.10);--soft-surface:#121B27;
      --action:#F1F6FA;--action-text:#0B121B;
    }
    html[data-theme="ocean"]{
      --bg:#ECF7FC;--navy:#0E4266;--navy-light:#1E638F;--peach:#72CAE6;--blue:#D3EDF8;
      --white:#FFFFFF;--text:#193547;--muted:#6A8495;--border:rgba(14,66,102,.12);
      --input-border:rgba(14,66,102,.18);--soft-border:rgba(14,66,102,.07);--soft-surface:#F8FCFE;
      --action:#0E4266;--action-text:#FFFFFF;
    }
    html[data-theme="forest"]{
      --bg:#EEF6F1;--navy:#164638;--navy-light:#286554;--peach:#DDA187;--blue:#D7EAE1;
      --white:#FFFFFF;--text:#253A32;--muted:#71857D;--border:rgba(22,70,56,.12);
      --input-border:rgba(22,70,56,.18);--soft-border:rgba(22,70,56,.07);--soft-surface:#F7FBF8;
      --action:#164638;--action-text:#FFFFFF;
    }
    html[data-theme="blush"]{
      --bg:#FFF1F5;--navy:#762B49;--navy-light:#9B3F62;--peach:#F3A2BC;--blue:#FADCE7;
      --white:#FFFFFF;--text:#3D2731;--muted:#8D6A78;--border:rgba(118,43,73,.12);
      --input-border:rgba(118,43,73,.18);--soft-border:rgba(118,43,73,.07);--soft-surface:#FFF9FB;
      --action:#762B49;--action-text:#FFFFFF;
    }
    html[data-theme="sunset"]{
      --bg:#FFF4EC;--navy:#71381F;--navy-light:#9B583B;--peach:#F4A77E;--blue:#FBE0D1;
      --white:#FFFFFF;--text:#3E2A22;--muted:#8A6F63;--border:rgba(113,56,31,.12);
      --input-border:rgba(113,56,31,.18);--soft-border:rgba(113,56,31,.07);--soft-surface:#FFFBF8;
      --action:#71381F;--action-text:#FFFFFF;
    }

    /* RESPONSIVE */
    @media(max-width:760px){
      .header{padding-left:10px;padding-right:10px}
      .header-inner{border-radius:18px}
      .header-status{display:none}
      .messages-container{padding:14px 10px 12px}
      .message-content{max-width:84%}
      .message-text,.deleted-content{font-size:13.5px}
      .message-menu-trigger{opacity:.46}
      .composer-area{padding-left:9px;padding-right:9px}
      .composer-row{gap:7px}
      .composer{padding:6px;border-radius:18px}
      .input-icon{display:none}
      .best-reply-button{width:44px;min-width:44px;padding:0}
      .best-reply-button span{display:none}
      .send-button{width:47px;min-width:47px;padding:0}
      .send-label{display:none}
      .attachment-button{width:42px;min-width:42px}
    }
    @media(max-width:520px){
      .header-title{font-size:13px}
      .header-subtitle{font-size:9px}
      .header-button{width:37px;height:37px;flex-basis:37px}
      .header-right{gap:5px}
      .messages-container{padding-top:9px}
      .message-content{max-width:88%}
      .message-image{max-height:430px}
      .reply-assist{border-radius:16px}
    }
    @media(max-width:380px){
      .composer{gap:6px}
      .send-button{width:44px;min-width:44px}
      .message-input{font-size:13.5px}
      .attachment-button{width:40px;min-width:40px}
    }
    @media(prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="header-inner">

        <div class="header-left">

          <button
            class="header-button"
            id="homeButton"
            type="button"
            aria-label="Home"
            title="Home"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
              <path d="M4 10.5 12 4l8 6.5"></path>
              <path d="M6.5 9.5V20h11V9.5"></path>
              <path d="M10 20v-5h4v5"></path>
            </svg>
          </button>

          <div class="header-copy">
            <p class="header-title">Our Space</p>
            <p class="header-subtitle" id="headerSubtitle">Private conversation</p>
          </div>

        </div>

        <div class="header-right">
          <span class="header-status">
            <span class="header-status-dot"></span>
            Just us
          </span>

          <button class="header-button" id="galleryButton" type="button" aria-label="Gallery" title="Gallery">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
              <rect x="3.5" y="4" width="17" height="16" rx="2.5"></rect>
              <circle cx="8.5" cy="9" r="1.4"></circle>
              <path d="m4.5 17 4.7-4.8 3.4-3.4"></path>
            </svg>
          </button>

          <button class="header-button" id="settingsButton" type="button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
              <circle cx="12" cy="12" r="3.2"></circle>
              <path d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5"></path>
            </svg>
          </button>
        </div>

      </div>

    </header>

    <!-- MESSAGES -->

    <main
      class="messages-scroll"
      id="messagesScroll"
    >
      <div
        class="messages-container"
        id="messages"
      ></div>
    </main>

    <!-- COMPOSER -->

    <div class="composer-area">

    /* ==========================================

    let currentUser = null;

    const imageUrlCache = new Map();

    // Scroll state is centralized so initial entry, photo sends, realtime
    // inserts, and image/layout changes all use the same bottom-lock logic.
    let stickToBottom = false;
    let bottomScrollFrame = 0;
    let bottomScrollToken = 0;
    let bottomScrollTimers = [];

    /* ==========================================
       HELPERS
    ========================================== */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function timeLabel(value) {
      return new Date(value).toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

    // The message viewport ends naturally above the composer because both
    // elements participate in the same flex layout. The browser therefore
    // computes the true maximum scrollTop without any spacer or overlay math.
    function isAtBottom() {
      const distance =
        messagesScroll.scrollHeight -
        messagesScroll.clientHeight -
        messagesScroll.scrollTop;

      return distance <= 16;
    }

    function cancelBottomLock() {
      stickToBottom = false;
      bottomScrollToken += 1;

      if (bottomScrollFrame) {
        cancelAnimationFrame(bottomScrollFrame);
        bottomScrollFrame = 0;
      }

      bottomScrollTimers.forEach(clearTimeout);
      bottomScrollTimers = [];
    }

    function scrollToLatestNow() {
      syncLayoutMetrics();

      // The flex layout gives the scroll viewport exactly the visible space
      // above the composer, so this is the true visible bottom of the chat.
      messagesScroll.scrollTop =
        Math.max(0, messagesScroll.scrollHeight - messagesScroll.clientHeight);
    }

    function scrollToLatest(behavior = "auto") {
      stickToBottom = true;
      const token = ++bottomScrollToken;

      if (bottomScrollFrame) {
        cancelAnimationFrame(bottomScrollFrame);
      }

      bottomScrollFrame = requestAnimationFrame(() => {
        bottomScrollFrame = requestAnimationFrame(() => {
          bottomScrollFrame = 0;

          if (token !== bottomScrollToken) return;

          if (behavior === "smooth") {
            messagesScroll.scrollTo({
              top: Math.max(
                0,
                messagesScroll.scrollHeight - messagesScroll.clientHeight
              ),
              behavior: "smooth"
            });
          } else {
            scrollToLatestNow();
          }
        });
      });

      // Normal realtime/composer-driven scrolls only need a short
      // stabilization window. Explicit entry/photo settling uses the
      // longer lock below.
      bottomScrollTimers.forEach(clearTimeout);
      bottomScrollTimers = [
        setTimeout(() => {
          if (token === bottomScrollToken) {
            stickToBottom = false;
            bottomScrollTimers = [];
          }
        }, 1200)
      ];

      return token;
    }

    // A forced bottom lock is used only when the app itself knows that the
    // user should be at the latest message (chat entry / sending a photo).
    // It survives image decoding and any resulting layout reflow.
    function lockToLatestForSettling() {
      stickToBottom = true;
      const token = ++bottomScrollToken;

      if (bottomScrollFrame) {
        cancelAnimationFrame(bottomScrollFrame);
        bottomScrollFrame = 0;
      }

      bottomScrollTimers.forEach(clearTimeout);
      bottomScrollTimers = [];

      const settle = () => {
        if (!stickToBottom || token !== bottomScrollToken) return;
        scrollToLatestNow();
      };

      requestAnimationFrame(() => {
        requestAnimationFrame(settle);
      });

      // Image loading and decoding can change scrollHeight well after the
      // first paint. ResizeObserver below handles exact changes; these
      // bounded passes cover browser scheduling gaps as well.
      [50, 120, 250, 500, 900, 1400].forEach((delay) => {
        bottomScrollTimers.push(
          setTimeout(settle, delay)
        );
      });

      bottomScrollTimers.push(
        setTimeout(() => {
          if (token === bottomScrollToken) {
            stickToBottom = false;
            bottomScrollTimers = [];
          }
        }, 1800)
      );
    }

    function userStartedScrollingChat() {
      cancelBottomLock();
    }

    messagesScroll.addEventListener("wheel", userStartedScrollingChat, {
      passive: true
    });
    messagesScroll.addEventListener("touchstart", userStartedScrollingChat, {
      passive: true
    });
    messagesScroll.addEventListener("pointerdown", userStartedScrollingChat, {
      passive: true
    });

    messagesScroll.addEventListener("scroll", () => {
      // If the user manually moves away from the bottom, don't let a
      // late image/layout callback pull them back down.
      if (!stickToBottom) return;

      const distance =
        messagesScroll.scrollHeight -
        messagesScroll.clientHeight -
        messagesScroll.scrollTop;

      if (distance > 24) {
        cancelBottomLock();
      }
    }, { passive: true });

    messagesScroll.addEventListener("keydown", (event) => {
      if (
        event.key === "ArrowUp" ||
        event.key === "ArrowDown" ||
        event.key === "PageUp" ||
        event.key === "PageDown" ||
        event.key === "Home" ||
        event.key === "End" ||
        event.key === " "
      ) {
        userStartedScrollingChat();
      }
    });

    function dateKey(value) {
      const d = new Date(value);

      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
      ].join("-");
    }
    function dateLabel(value) {
      return new Date(value).toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );
    }

    function isMine(message) {
      return (
        currentUser &&
        message.sender_id ===
          currentUser.id
      );
    }

    async function hydrateImageUrls(list) {
      const imageMessages = (list || []).filter(
        (message) => message.media_path && message.message_type === "image"
      );

      const missingPaths = [
        ...new Set(
          imageMessages
            .map((message) => message.media_path)
            .filter((path) => {
              const cached = imageUrlCache.get(path);
              return !cached || cached.expiresAt <= Date.now() + 60_000;
            })
        )
      ];

      if (missingPaths.length) {
        const { data, error } = await client.storage
          .from("chat-media")
          .createSignedUrls(missingPaths, 3600);

        if (error) {
          console.warn("Could not create signed image URLs:", error);
        } else {
          (data || []).forEach((item, index) => {
            const path = missingPaths[index];
            if (path && item?.signedUrl) {
              imageUrlCache.set(path, {
                url: item.signedUrl,
                expiresAt: Date.now() + 55 * 60 * 1000
              });
            }
          });
        }
      }

      imageMessages.forEach((message) => {
        const cached = imageUrlCache.get(message.media_path);
        message.media_url = cached?.url || null;
      });
    }

    function scrollToLatestAfterImages() {
      lockToLatestForSettling();
    }

    function closeMenus() {
      document
        .querySelectorAll(".message-menu.open")
        .forEach((menu) => {
          menu.classList.remove("open");
        });
    }

    function syncLayoutMetrics() {
      const header = document.querySelector(".header");
      const composerArea = document.querySelector(".composer-area");

      if (header) {
        document.documentElement.style.setProperty(
          "--header-height",
          `${header.getBoundingClientRect().height}px`
        );
      }

      if (composerArea) {
        document.documentElement.style.setProperty(
          "--composer-height",
          `${composerArea.getBoundingClientRect().height}px`
        );
      }
    }

    const messagesContentResizeObserver = new ResizeObserver(() => {
      if (!stickToBottom) return;

      // ResizeObserver fires when images finish decoding or message layout
      // changes. Defer the scroll one frame so the new geometry is committed.
      requestAnimationFrame(() => {
        if (stickToBottom) {
          scrollToLatestNow();
        }
      });
    });

    const headerResizeObserver = new ResizeObserver(() => {
      syncLayoutMetrics();
    });

    const composerResizeObserver = new ResizeObserver(() => {
      const wasAtBottom = isAtBottom();

      syncLayoutMetrics();

      if (wasAtBottom) {
        scrollToLatest();
      }
    });

    const headerElement =
      document.querySelector(".header");

    const composerAreaElement =
      document.querySelector(".composer-area");

    if (headerElement) {
      headerResizeObserver.observe(headerElement);
    }

    if (composerAreaElement) {
      composerResizeObserver.observe(composerAreaElement);
    }

    if (messagesEl) {
      messagesContentResizeObserver.observe(messagesEl);
    }

    syncLayoutMetrics();

    // iOS Safari can change the visual viewport when the keyboard opens,
    // closes, or the browser chrome expands/collapses. Keep the measured
    // composer height and bottom spacer synchronized with those changes.
    let viewportSyncFrame = 0;

    function syncVisualViewport() {
      if (viewportSyncFrame) return;

      viewportSyncFrame = requestAnimationFrame(() => {
        viewportSyncFrame = 0;

        const wasAtBottom = isAtBottom();
        syncLayoutMetrics();

        if (wasAtBottom) {
          scrollToLatest();
        }
      });
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        syncVisualViewport,
        { passive: true }
      );
      window.visualViewport.addEventListener(
        "scroll",
        syncVisualViewport,
        { passive: true }
      );
    }

    window.addEventListener(
      "resize",
      syncVisualViewport,
      { passive: true }
    );

function renderError(message) {
      messagesEl.innerHTML = `
        <div class="error-card">
          <strong>Unable to load the chat</strong>
          ${escapeHtml(message)}
        </div>
      `;
    }

    /* ==========================================
       STATUS
    ========================================== */

    function messageStatus(message) {
      if (message.seen_at) {
        return "Seen";
      }

      return "Sent";
    }

    /* ==========================================
       RENDER
    ========================================== */

    function renderMessages() {

      closeMenus();

      if (!messages.length) {

        messagesEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-card">
              <h2>Our Space</h2>
              <p>
                Start your conversation here.
              </p>
            </div>
          </div>
        `;

        return;
      }

      let html = "";
      let previousDate = null;

      for (
        let i = 0;
        i < messages.length;
        i++
      ) {

        const message = messages[i];

        const mine =
          isMine(message);

        const deleted =
          Boolean(
            message.deleted_at

                  dateLabel(
                    message.created_at
                  )
                )}

          `;

          previousDate =
            currentDate;
        }

        const previous =
          i > 0
            ? messages[i - 1]

        const grouped =
          previous &&
          previous.sender_id ===
            message.sender_id &&
          dateKey(
            previous.created_at
          ) === currentDate;

        const rowClass = [

          currentUser?.id === MOHAMMAD_USER_ID;

          message.message_type === "image" &&

                  </span>
                `

                  ${escapeHtml(message.content)}

        const statusHtml =

            ? `

                ${escapeHtml(
                  messageStatus(
                    message

            `

        const menuHtml =

            ? `

              >

                    cy="12"
                    r="1.7"
                  ></circle>
                  <circle
                    cx="19"
                    cy="12"
                    r="1.7"
                  ></circle>
                </svg>
              </button>

              <div
                class="message-menu"
                data-menu="${message.id}"
              >
                <button
                  type="button"
                  data-delete-direct="${message.id}"
                >
                  Delete
                </button>
              </div>
            `
            : "";

        html += `
          <div
            class="${rowClass}"
            data-row="${message.id}"
          >

            <div class="message-content">

              <div
                class="message-bubble ${
                  [
                    deleted ? "deleted" : "",
                    isImage ? "image-bubble" : ""
                  ]
                    .filter(Boolean)
                    .join(" ")
                }"
              >

                ${deletedHtml}

                ${contentHtml}

                <div class="message-meta">

                  <span>
                    ${escapeHtml(
                      timeLabel(
                        message.created_at
                      )
                    )}
                  </span>

                  ${statusHtml}

                </div>

                ${menuHtml}

              </div>

            </div>

          </div>
        `;
      }

      messagesEl.innerHTML = html;

      setupVisibleMessageObserver();
    }

    /* ==========================================
       SEEN
    ========================================== */

    async function markMessageSeen(messageId) {
      if (!currentUser || !messageId) return;

      const message = messages.find(
        (item) => Number(item.id) === Number(messageId)
      );

      if (!message) return;
      if (message.sender_id === currentUser.id) return;
      if (message.seen_at) return;

      const { error } = await client.rpc(
        "mark_message_seen",
        { p_message_id: message.id }
      );

      if (error) {
        console.warn("Could not mark message as seen:", error);
        return;
      }

      const local = messages.find(
        (item) => Number(item.id) === Number(message.id)
      );
      if (local) {
        local.seen_at = new Date().toISOString();
      }
    }

    function setupVisibleMessageObserver() {
      if (visibleMessageObserver) {
        visibleMessageObserver.disconnect();
      }

      visibleMessageObserver = new IntersectionObserver(
        (entries) => {
          if (document.visibilityState !== "visible") return;

          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;

            const id = Number(entry.target.dataset.row);
            markMessageSeen(id);
          });
        },
        {
          root: messagesScroll,
          threshold: 0.65
        }
      );

      document.querySelectorAll("[data-row]").forEach((row) => {
        const message = messages.find(
          (item) => Number(item.id) === Number(row.dataset.row)
        );

        if (
          message &&
          message.sender_id !== currentUser?.id &&
          !message.seen_at
        ) {
          visibleMessageObserver.observe(row);
        }
      });
    }

    function updateChatVisibility() {
      isChatVisible = document.visibilityState === "visible";
      if (isChatVisible) {
        setupVisibleMessageObserver();
      }
    }

    document.addEventListener("visibilitychange", updateChatVisibility);

    function latestIncomingMessage() {
      if (!currentUser) return null;

      for (let i = messages.length - 1; i >= 0; i--) {
        const message = messages[i];
        if (
          message &&
          !message.deleted_at &&
          message.sender_id !== currentUser.id
        ) {
          return message;
        }
      }

      return null;
    }

    function clearReplySuggestion() {
      replySuggestions = [];
      replySuggestionSent = false;
      replyAssist.classList.remove("visible");
      replyAssistSuggestions.innerHTML = "";
      replyAssistStatus.textContent = "Ready";
      syncLayoutMetrics();
    }

    function normalizeReplySuggestions(raw) {
      return String(raw || "")
        .split("\n")
        .map((line) =>
          line
            .replace(/^\s*(?:[-*•]|\d+[.)])\s*/, "")
            .replace(/^[\"“”']+|[\"“”']+$/g, "")
            .trim()
        )
        .filter(Boolean)
        .slice(0, 3);
    }

    function showReplyAssist(data) {
      const suggestions = Array.isArray(data.suggestions)
        ? data.suggestions
        : normalizeReplySuggestions(data.suggestion);

      if (suggestions.length !== 3) {
        throw new Error("The AI returned an invalid set of three replies.");
      }

      replySuggestions = suggestions.map((suggestion) => ({
        suggestion,
        suggestion_id: data.suggestion_id,
        source_message_id: Number(data.source_message_id)
      }));
      replySuggestionSent = false;

      replyAssistSuggestions.innerHTML = replySuggestions
        .map(
          (item, index) => `
            <button
              class="reply-assist-suggestion"
              type="button"
              data-reply-index="${index}"
              aria-label="Send suggested reply ${index + 1}"
            >${escapeHtml(item.suggestion)}</button>
          `
        )
        .join("");

      replyAssist.classList.add("visible");
      replyAssistStatus.textContent = "Choose a reply";
      syncLayoutMetrics();
    }

    async function requestBestReply() {
      if (!currentUser || currentUser.id !== MOHAMMAD_USER_ID) return;

      const incoming = latestIncomingMessage();

      if (!incoming) {
        alert("There is no message from Salma to reply to yet.");
        return;
      }

      clearReplySuggestion();
      bestReplyButton.disabled = true;
      bestReplyButton.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path><circle cx="12" cy="12" r="4"></circle></svg><span>Thinking...</span>';

      replyAssist.classList.add("visible");
      replyAssistStatus.textContent = "Thinking...";
      replyAssistSuggestions.textContent = "Generating three reply options...";
      syncLayoutMetrics();

      try {
        const sessionResult = await client.auth.getSession();
        const session = sessionResult?.data?.session;

        if (!session) {
          throw new Error("Your session has expired. Please sign in again.");
        }

        const response = await fetch("/api/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + session.access_token
          },
          body: JSON.stringify({
            mode: "suggest_reply",
            source_message_id: Number(incoming.id)
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Could not generate a reply.");
        }

        if (!data.suggestion || !data.suggestion_id) {
          throw new Error("The AI returned an empty suggestion.");
        }

        const suggestions = normalizeReplySuggestions(data.suggestion);

        if (suggestions.length !== 3) {
          throw new Error("The AI returned an invalid set of three replies.");
        }

        showReplyAssist({
          suggestion_id: data.suggestion_id,
          source_message_id: Number(data.source_message_id),
          suggestions
        });
      } catch (error) {
        replyAssistStatus.textContent = "Error";
        replyAssistSuggestions.textContent =
          error.message || "Could not generate a reply.";
      } finally {
        bestReplyButton.disabled = false;
        bestReplyButton.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path><circle cx="12" cy="12" r="4"></circle></svg><span>Best reply</span>';
        syncLayoutMetrics();
      }
    }

    async function sendReplySuggestion(index) {
      if (replySuggestionSent || busyReplySuggestion) return;

      const selected = replySuggestions[index];
      if (!selected) return;

      const incoming = latestIncomingMessage();

      if (
        !incoming ||
        Number(incoming.id) !== Number(selected.source_message_id)
      ) {
        clearReplySuggestion();
        alert("A newer message from Salma arrived. Generate a fresh reply.");
        return;
      }

      busyReplySuggestion = true;
      replyAssistStatus.textContent = "Sending...";

      const buttons = replyAssistSuggestions.querySelectorAll(
        "[data-reply-index]"
      );
      buttons.forEach((button) => {
        button.disabled = true;
      });

      try {
        await sendMessage(selected.suggestion, true);
        replySuggestionSent = true;

        buttons.forEach((button) => {
          button.classList.toggle(
            "sent",
            Number(button.dataset.replyIndex) === Number(index)
          );
        });

        replyAssistStatus.textContent = "Sent";
      } catch (error) {
        buttons.forEach((button) => {
          button.disabled = false;
        });
        replyAssistStatus.textContent =
          error.message || "Could not send.";
      } finally {
        busyReplySuggestion = false;
        syncLayoutMetrics();
      }
    }

        /* ==========================================
       LOAD
    ========================================== */

    async function loadMessages(
      shouldScroll = false
    ) {

      if (!currentUser) {        return;
      }

      let result =
        await client
          .from("messages")
          .select(
            `
              id,
              space_id,
              sender_id,
              content,
              message_type,
              media_path,
              created_at,
              deleted_at,
              deleted_by,
              seen_at
            `
          )
          .eq(
            "space_id",
            SPACE_ID
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

      if (result.error) {

        console.warn(
          "Extended message query failed.",
          result.error
        );

        result =
          await client
            .from("messages")
            .select(
              `
                id,
                space_id,
                sender_id,
                content,
                message_type,
                media_path,
                created_at,
                deleted_at,
                deleted_by,
                seen_at
              `
            )
            .eq(
              "space_id",
              SPACE_ID
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );
      }

      if (result.error) {

        console.error(
          result.error
        );

        renderError(
          result.error.message
        );

        return;
      }

      messages =
        result.data || [];

      await hydrateImageUrls(messages);

      renderMessages();

      if (shouldScroll) {
        scrollToLatestAfterImages();
      }
    }

    /* ==========================================
       SEND
    ========================================== */

    async function sendMessage(
      messageOverride = null,
      preserveReplySuggestion = false
    ) {

      const value =
        String(messageOverride ?? input.value).trim();

      if (!value) {
        return;
      }

      if (!currentUser) {
        return;
      }

      sendButton.disabled = true;

      const { data: sentMessage, error } =
        await client
          .from("messages")
          .insert({
            space_id: SPACE_ID,
            sender_id: currentUser.id,
            content: value
          })
          .select("id, space_id, sender_id, content, created_at")
          .single();

      sendButton.disabled = false;

      if (error) {

        console.error(
          "Send error:",
          error
        );

        alert(
          error.message
        );

        return;
      }

      input.value = "";
      input.style.height =
        "40px";
      syncLayoutMetrics();

      await loadMessages(true);

      if (sentMessage && window.OurSpaceNotifications) {
        await window.OurSpaceNotifications.sendMessage(sentMessage);
      }

      if (!preserveReplySuggestion) {
        clearReplySuggestion();
      }

      input.focus();
    }

    async function sendImage(file) {
      if (!file || !currentUser) return;

      if (!file.type.startsWith("image/")) {
        throw new Error("Please choose an image file.");
      }

      const maxBytes = 10 * 1024 * 1024;
      if (file.size > maxBytes) {
        throw new Error("That photo is too large. The maximum size is 10 MB.");
      }

      const extensionMap = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp",
        "image/gif": "gif"
      };
      const extension = extensionMap[file.type];
      if (!extension) {
        throw new Error("This image format is not supported.");
      }

      const path =
        `${SPACE_ID}/${currentUser.id}/${crypto.randomUUID()}.${extension}`;

      attachmentButton.disabled = true;
      sendButton.disabled = true;
      headerSubtitle.textContent = "Uploading photo...";

      try {
        const { error: uploadError } = await client.storage
          .from("chat-media")
          .upload(path, file, {
            cacheControl: "31536000",
            contentType: file.type,
            upsert: false
          });

        if (uploadError) {
          throw uploadError;
        }

        const { data: sentMessage, error: insertError } = await client
          .from("messages")
          .insert({
            space_id: SPACE_ID,
            sender_id: currentUser.id,
            content: "Photo",
            message_type: "image",
            media_path: path
          })
          .select("id, space_id, sender_id, content, message_type, media_path, created_at")
          .single();

        if (insertError) {
          await client.storage.from("chat-media").remove([path]);
          throw insertError;
        }

        await hydrateImageUrls([sentMessage]);
        messages.push(sentMessage);
        messages.sort(
          (a, b) => new Date(a.created_at) - new Date(b.created_at)
        );
        renderMessages();
        scrollToLatestAfterImages();

        if (sentMessage && window.OurSpaceNotifications) {
          await window.OurSpaceNotifications.sendMessage(sentMessage);
        }
      } finally {
        attachmentButton.disabled = false;
        sendButton.disabled = false;
        headerSubtitle.textContent = "Private chat";
      }
    }

    async function deleteMessageDirect(message) {
      if (!message || !currentUser) return;
      if (message.sender_id !== currentUser.id) return;
      if (message.deleted_at) return;

      try {
        // Primary path: secure database RPC.
        const { data: rpcChanged, error: rpcError } = await client.rpc(
          "delete_message_for_everyone",
          { p_message_id: message.id }
        );

        if (rpcError) {
          console.warn("Delete RPC failed; trying direct update:", rpcError);
        }

        // Compatibility fallback: this also works if the RPC has not yet
        // been installed, provided the sender has the required UPDATE policy.
        if (rpcError || rpcChanged === false) {
          const { error: directError } = await client
            .from("messages")
            .update({
              deleted_at: new Date().toISOString(),
              deleted_by: currentUser.id
            })
            .eq("id", message.id)
            .eq("sender_id", currentUser.id)
            .is("deleted_at", null);

          if (directError) throw directError;
        }

        // The deletion RPC itself is the database confirmation.
        // Deleted rows are intentionally hidden from Salma by RLS, so a follow-up
        // SELECT can legitimately return no row on her device.
        const localIndex = messages.findIndex(
          (item) => Number(item.id) === Number(message.id)
        );

        if (localIndex !== -1) {
          if (currentUser.id === MOHAMMAD_USER_ID) {
            // Mohammad keeps the original message visible with a Deleted label.
            messages[localIndex] = {
              ...messages[localIndex],
              deleted_at: new Date().toISOString(),
              deleted_by: currentUser.id
            };
          } else {
            // Salma must lose the message from her device immediately.
            messages = messages.filter(
              (item) => Number(item.id) !== Number(message.id)
            );
          }
        }

        if (message.media_path) {
          const { error: mediaDeleteError } = await client.storage
            .from("chat-media")
            .remove([message.media_path]);

          if (mediaDeleteError) {
            console.warn("Could not delete the photo file:", mediaDeleteError);
          } else {
            imageUrlCache.delete(message.media_path);
          }
        }

        renderMessages();
      } catch (error) {
        console.error("Delete error:", error);
        alert(error.message || "Could not delete the message.");
      }
    }

    let syncInProgress = false;

    async function syncMessagesSilently() {
      if (!currentUser || syncInProgress) return;
      syncInProgress = true;
      try {
        const { data, error } = await client
          .from("messages")
          .select("id, space_id, sender_id, content, message_type, media_path, created_at, deleted_at, deleted_by, seen_at")
          .eq("space_id", SPACE_ID)
          .order("created_at", { ascending: true });

        if (error) throw error;
        const nextMessages = data || [];
        const currentIds = new Set(
          messages.map((item) => Number(item.id))
        );

        const hasNewMessage = nextMessages.some(
          (item) => !currentIds.has(Number(item.id))
        );

        const changed =
          nextMessages.length !== messages.length ||
          nextMessages.some((next, index) => {
            const current = messages[index];
            return !current ||
              Number(current.id) !== Number(next.id) ||
              current.content !== next.content ||
              current.deleted_at !== next.deleted_at ||
              current.deleted_by !== next.deleted_by ||
              current.seen_at !== next.seen_at;
          });

        if (
          hasNewMessage &&
          currentUser?.id === MOHAMMAD_USER_ID
        ) {
          const latestNextMessage =
            nextMessages[nextMessages.length - 1];

          if (
            latestNextMessage &&
            latestNextMessage.sender_id !== currentUser.id &&
            !latestNextMessage.deleted_at
          ) {
            clearReplySuggestion();
          }
        }

        if (changed) {
          const wasNearBottom =
            messagesScroll.scrollHeight -
            messagesScroll.scrollTop -
            messagesScroll.clientHeight < 80;
          messages = nextMessages;
          await hydrateImageUrls(messages);
          renderMessages();
          if (hasNewMessage || wasNearBottom) {
            scrollToLatest();
          }
        }
      } catch (error) {
        console.warn("Background message sync failed:", error);
      } finally {
        syncInProgress = false;
      }
    }
    /* ==========================================
       REALTIME
    ========================================== */

    function subscribeRealtime() {
      if (realtimeChannel) {
        client.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      const channelName = "our-space-chat-" + SPACE_ID;

      // Do NOT filter the Postgres Changes subscription here.
      // The database/RLS layer decides which rows the user may receive,
      // then we filter by SPACE_ID in the browser. This avoids a common
      // Supabase failure mode where a filtered UPDATE subscription silently
      // receives nothing even though the table itself is in the publication.
      realtimeChannel = client
        .channel(channelName, {
          config: {
            private: true
          }
        })
        .on(
          "broadcast",
          {
            event: "message_deleted"
          },
          (payload) => {
            const deletedId = Number(payload?.payload?.message_id);
            const deletedSpace = String(payload?.payload?.space_id || "");

            if (
              !deletedId ||
              deletedSpace !== String(SPACE_ID)
            ) {
              return;
            }

            const localIndex = messages.findIndex(
              (item) => Number(item.id) === deletedId
            );

            if (localIndex === -1) {
              return;
            }

            if (currentUser?.id === MOHAMMAD_USER_ID) {
              messages[localIndex] = {
                ...messages[localIndex],
                deleted_at:
                  messages[localIndex].deleted_at ||
                  new Date().toISOString()
              };
            } else {
              messages = messages.filter(
                (item) => Number(item.id) !== deletedId
              );
            }

            renderMessages();
          }
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "messages"
          },
          async (payload) => {
            const incoming = payload.new || payload.old || {};

            if (
              incoming.space_id &&
              String(incoming.space_id) !== String(SPACE_ID)
            ) {
              return;
            }

            if (payload.eventType === "INSERT") {
              const inserted = payload.new;

              if (!inserted?.id) {
                await loadMessages(true);
                return;
              }

              const alreadyExists = messages.some(
                (item) => Number(item.id) === Number(inserted.id)
              );

              if (!alreadyExists) {
                if (
                  currentUser?.id === MOHAMMAD_USER_ID &&
                  inserted.sender_id !== currentUser.id &&
                  !inserted.deleted_at
                ) {
                  clearReplySuggestion();
                }

                if (inserted.message_type === "image" && inserted.media_path) {
                  await hydrateImageUrls([inserted]);
                }

                messages.push(inserted);
                messages.sort(
                  (a, b) =>
                    new Date(a.created_at) - new Date(b.created_at)
                );

                renderMessages();

                // New messages must always bring the conversation to the latest message.
                scrollToLatest();
              }

              return;
            }

            if (payload.eventType === "UPDATE") {
              const updated = payload.new;

              if (!updated?.id) {
                await syncMessagesSilently();
                return;
              }

              const index = messages.findIndex(
                (item) => Number(item.id) === Number(updated.id)
              );

              if (index === -1) {
                await loadMessages(false);
                return;
              }

              // Merge the event immediately. If Supabase omits a field,
              // the existing local value remains intact.
              const current = messages[index];
              messages[index] = {
                ...current,
                ...updated
              };

              const seenOnlyUpdate =
                current.content === messages[index].content &&
                current.deleted_at === messages[index].deleted_at &&
                current.seen_at !== messages[index].seen_at;

              if (seenOnlyUpdate) {
                const status = document.querySelector(
                  `[data-status="${updated.id}"]`
                );
                if (status) {
                  status.textContent =
                    messages[index].seen_at ? "Seen" : "Sent";
                }
                return;
              }

              const wasNearBottom =
                messagesScroll.scrollHeight -
                messagesScroll.scrollTop -
                messagesScroll.clientHeight < 80;

              renderMessages();

              if (wasNearBottom) {
                scrollToLatest();
              }

              return;
            }

            // A hard DELETE is not used by our app, but handle it safely.
            if (payload.eventType === "DELETE") {
              const deletedId = Number(payload.old?.id);
              if (!deletedId) return;

              messages = messages.filter(
                (item) => Number(item.id) !== deletedId
              );
              renderMessages();
            }
          }
        )
        .subscribe((status, error) => {
          console.log("Our Space realtime:", status, error || "");

          if (
            status === "CHANNEL_ERROR" ||
            status === "TIMED_OUT" ||
            status === "CLOSED"
          ) {
            setTimeout(() => {
              if (document.visibilityState === "visible") {
                subscribeRealtime();
              }
            }, 1000);
          }
        });
    }

    /* ==========================================
       EVENTS
    ========================================== */

    bestReplyButton.addEventListener(
      "click",
      requestBestReply
    );

    replyAssistClose.addEventListener(
      "click",
      clearReplySuggestion
    );

    replyAssistSuggestions.addEventListener(
      "click",
      async (event) => {
        const button = event.target.closest("[data-reply-index]");
        if (!button) return;

        const index = Number(button.dataset.replyIndex);
        await sendReplySuggestion(index);
      }
    );

    attachmentButton.addEventListener("click", () => {
      if (!attachmentButton.disabled) {
        photoInput.click();
      }
    });

    photoInput.addEventListener("change", async () => {
      const files = Array.from(photoInput.files || []);
      photoInput.value = "";

      if (!files.length || !currentUser) return;

      try {
        for (const file of files) {
          await sendImage(file);
        }
      } catch (error) {
        console.error("Photo send error:", error);
        alert(error.message || "Could not send the photo.");
      } finally {
        attachmentButton.disabled = false;
        sendButton.disabled = false;
        headerSubtitle.textContent = "Private chat";
      }
    });

    composer.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        await sendMessage();
      }
    );

    input.addEventListener(
      "input",
      () => {
        if (replySuggestions.length && input.value.trim()) {
          clearReplySuggestion();
        }
      }
    );

    input.addEventListener(
      "keydown",
      async (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing
        ) {

          event.preventDefault();

          await sendMessage();
        }
      }
    );

    input.addEventListener(
      "input",
      () => {

        input.style.height =
          "auto";

        input.style.height =
          Math.min(
            input.scrollHeight,
            130
          ) + "px";

        syncLayoutMetrics();
      }
    );

    messagesEl.addEventListener(
      "click",
      async (event) => {

        const trigger =
          event.target.closest(
            "[data-menu-trigger]"
          );

        if (trigger) {

          event.stopPropagation();

          const id =
            trigger.dataset
              .menuTrigger;

          const menu =
            document.querySelector(
              `[data-menu="${id}"]`
            );

          if (!menu) {
            return;
          }

          const wasOpen =
            menu.classList.contains(
              "open"
            );

          closeMenus();

          if (!wasOpen) {
            menu.classList.add(
              "open"
            );
          }

          return;
        }

        const deleteButton =
          event.target.closest(
            "[data-delete-direct]"
          );

        if (deleteButton) {
          event.stopPropagation();
          closeMenus();

          const id = Number(deleteButton.dataset.deleteDirect);
          const message = messages.find(
            (item) => Number(item.id) === id
          );

          if (
            message &&
            currentUser &&
            message.sender_id === currentUser.id &&
            !message.deleted_at
          ) {
            await deleteMessageDirect(message);
          }

          return;
        }

        return;
      }
    );

    document.addEventListener(
      "click",
      (event) => {

        if (
          !event.target.closest(
            ".message-menu"
          ) &&
          !event.target.closest(
            ".message-menu-trigger"
          )
        ) {
          closeMenus();
        }
      }
    );


    homeButton.addEventListener(
      "click",
      () => {
        window.location.href =
          "index.html";
      }
    );

    document.getElementById("galleryButton").addEventListener(
      "click",
      () => {
        window.location.href = "gallery.html";
      }
    );

    document.getElementById("settingsButton").addEventListener(
      "click",
      () => {
        window.location.href = "settings.html";
      }
    );

    client.auth.onAuthStateChange(
      (event, session) => {

        if (
          event === "SIGNED_OUT" ||
          !session
        ) {
          window.location.href =
            "login.html";
        }
      }
    );

    /* ==========================================
       START
    ========================================== */

    async function start() {

      const {
        data: {
          user
        },
        error
      } =
        await client.auth.getUser();

      if (error) {

        console.error(
          error
        );

        window.location.href =
          "login.html";

        return;
      }

      if (!user) {

        window.location.href =
          "login.html";

        return;
      }

      currentUser =
        user;

      // Gate the reply coach by the canonical profile username, not only by
      // a hard-coded UUID. This keeps the UI aligned with the same identity
      // rule enforced by the AI Edge Function.
      const { data: profile, error: profileError } = await client
        .from("user_profiles")
        .select("username")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      const isMohammadAccount =
        !profileError &&
        String(profile?.username || "").toLowerCase() === "mohammad";

      if (isMohammadAccount) {
        bestReplyButton.classList.add("visible");
      } else {
        bestReplyButton.classList.remove("visible");
        clearReplySuggestion();
      }

      window.OurSpaceTheme.syncFromUser(currentUser);

      headerSubtitle.textContent =
        "Private chat";

      await loadMessages(true);

      if (window.OurSpaceNotifications) {
        await window.OurSpaceNotifications.register(currentUser);
      }

      subscribeRealtime();

      // Keep both accounts synchronized even if a realtime event is delayed.
      setInterval(syncMessagesSilently, 500);

      input.focus();
    }

    start();
  </script>
