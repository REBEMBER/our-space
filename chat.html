<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#F8F0EC"
  />

  <title>Our Space — Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy: #152B46;
      --peach: #F3B29F;
      --blue: #DCEAF5;
      --background: #F8F0EC;
      --surface: #FFFFFF;
      --soft-surface: #FFF8F5;
      --text: #26313D;
      --muted: #7A8794;
      --border: rgba(21, 43, 70, 0.09);

      --shadow: 0 18px 50px rgba(21, 43, 70, 0.08);

      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 17px;
      --radius-sm: 13px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(243, 178, 159, 0.16),
          transparent 29%
        ),
        var(--background);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: none;
    }

    /* ==========================================
       PAGE
    ========================================== */

    .page {
      width: 100%;
      height: 100vh;
      padding: 14px;
    }

    .chat-shell {
      width: 100%;
      max-width: 1000px;
      height: calc(100vh - 28px);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==========================================
       HEADER
    ========================================== */

    .chat-header {
      flex: 0 0 auto;
      min-height: 78px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-button,
    .header-button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 14px;
      background: var(--soft-surface);
      color: var(--navy);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition:
        background 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .back-button:hover,
    .header-button:hover {
      background: var(--blue);
      transform: translateY(-1px);
    }

    .back-button svg,
    .header-button svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.9;
    }

    .conversation-identity {
      min-width: 0;
    }

    .conversation-title {
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ==========================================
       MESSAGE AREA
    ========================================== */

    .messages-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 20px;
      background:
        linear-gradient(
          180deg,
          rgba(248, 240, 236, 0.78),
          rgba(248, 240, 236, 0.97)
        );
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color:
        rgba(21, 43, 70, 0.15)
        transparent;
    }

    .messages-area::-webkit-scrollbar {
      width: 7px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: rgba(21, 43, 70, 0.13);
      border-radius: 999px;
    }

    .message-list {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ==========================================
       DATE SEPARATOR
    ========================================== */

    .date-separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0 20px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .date-separator::before,
    .date-separator::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(21, 43, 70, 0.08);
    }

    /* ==========================================
       MESSAGE
    ========================================== */

    .message-row {
      display: flex;
      margin-bottom: 14px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      max-width: min(76%, 560px);
    }

    .message-sender {
      margin: 0 0 5px 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .message-row.mine .message-sender {
      margin:
        0
        5px
        5px
        0;

      text-align: right;
    }

    .message-bubble {
      padding: 12px 15px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow:
        0 6px 18px rgba(21, 43, 70, 0.035);
    }

    .message-row.theirs .message-bubble {
      border-bottom-left-radius: 6px;
    }

    .message-row.mine .message-bubble {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--surface);
      border-bottom-right-radius: 6px;
    }

    .message-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
    }

    .message-row.mine .message-meta {
      text-align: right;
    }

    /* ==========================================
       EMPTY STATE
    ========================================== */

    .empty-state {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 45px 25px;
    }

    .empty-card {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid var(--border);
      text-align: center;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 17px;
      border-radius: 16px;
      background: var(--blue);
      color: var(--navy);
      display: grid;
      place-items: center;
    }

    .empty-icon svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.7;
    }

    .empty-title {
      color: var(--navy);
      font-size: 17px;
      font-weight: 800;
    }

    .empty-description {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    /* ==========================================
       COMPOSER
    ========================================== */

    .composer-area {
      flex: 0 0 auto;
      padding: 13px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .composer {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .input-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .message-input {
      display: block;
      width: 100%;
      min-height: 48px;
      max-height: 150px;
      padding:
        13px
        46px
        13px
        15px;
      border-radius: 16px;
      border: 1px solid var(--border);
      outline: none;
      resize: none;
      overflow-y: auto;
      background: var(--soft-surface);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .message-input:focus {
      background: var(--surface);
      border-color: rgba(21, 43, 70, 0.20);
      box-shadow:
        0 0 0 3px
        rgba(21, 43, 70, 0.05);
    }

    .message-input::placeholder {
      color: #9CA6B0;
    }

    .input-hint {
      position: absolute;
      right: 13px;
      bottom: 12px;
      color: #A1ABB4;
      font-size: 9px;
      pointer-events: none;
    }

    .send-button {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 16px;
      background: var(--navy);
      color: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow:
        0 10px 22px rgba(21, 43, 70, 0.15);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .send-button:hover {
      transform: translateY(-1px);
      background: #1C3553;
      box-shadow:
        0 13px 26px rgba(21, 43, 70, 0.19);
    }

    .send-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .send-button svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.9;
    }

    .composer-note {
      width: 100%;
      max-width: 760px;
      margin: 7px auto 0;
      padding-left: 2px;
      color: #99A3AD;
      font-size: 9px;
    }

    /* ==========================================
       TOAST
    ========================================== */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      max-width: calc(100vw - 32px);
      padding: 11px 15px;
      border-radius: 13px;
      background: var(--navy);
      color: var(--surface);
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ==========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 700px) {
      .page {
        padding: 0;
      }

      .chat-shell {
        width: 100%;
        height: 100vh;
        max-width: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .chat-header {
        min-height: 72px;
        padding:
          12px
          12px
          11px;
      }

      .messages-area {
        padding:
          18px
          13px
          20px;
      }

      .composer-area {
        padding:
          10px
          11px
          calc(10px + env(safe-area-inset-bottom));
      }

      .message-content {
        max-width: 84%;
      }

      .composer-note {
        display: none;
      }

      .input-hint {
        display: none;
      }

      .conversation-title {
        font-size: 15px;
      }
    }

    @media (max-width: 430px) {
      .back-button,
      .header-button {
        width: 41px;
        height: 41px;
        flex-basis: 41px;
        border-radius: 13px;
      }

      .header-left {
        gap: 8px;
      }

      .message-input {
        min-height: 46px;
        padding:
          12px
          13px;
      }

      .send-button {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
        border-radius: 14px;
      }

      .message-bubble {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="chat-shell">

      <!-- HEADER -->
      <header class="chat-header">

        <div class="header-left">

          <button
            class="back-button"
            id="backButton"
            type="button"
            aria-label="Back to Our Space"
            title="Back"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5" />
              <path d="m11 18-6-6 6-6" />
            </svg>
          </button>

          <div class="conversation-identity">

            <div class="conversation-title">
              Our conversation
            </div>

            <div class="conversation-subtitle">
              Private space for two
            </div>

          </div>

        </div>

        <div class="header-right">

          <button
            class="header-button"
            id="homeButton"
            type="button"
            aria-label="Home"
            title="Home"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m3 10 9-7 9 7" />
              <path d="M5 9.5V20h14V9.5" />
              <path d="M9 20v-6h6v6" />
            </svg>
          </button>

        </div>

      </header>

      <!-- MESSAGES -->
      <section
        class="messages-area"
        id="messagesArea"
        aria-label="Conversation"
      >

        <div
          class="message-list"
          id="messageList"
        >

          <div class="empty-state">

            <div class="empty-card">

              <div class="empty-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M7 9h10" />
                  <path d="M7 13h6" />
                  <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H11l-4.5 4V16H6.5A2.5 2.5 0 0 1 4 13.5z" />
                </svg>
              </div>

              <div class="empty-title">
                Loading conversation
              </div>

              <div class="empty-description">
                Your messages will appear here.
              </div>

            </div>

          </div>

        </div>

      </section>

      <!-- COMPOSER -->
      <footer class="composer-area">

        <form
          class="composer"
          id="messageForm"
        >

          <div class="input-wrap">

            <textarea
              class="message-input"
              id="messageInput"
              rows="1"
              maxlength="4000"
              placeholder="Write a message..."
              autocomplete="off"
              aria-label="Message"
            ></textarea>

            <span class="input-hint">
              Enter
            </span>

          </div>

          <button
            class="send-button"
            id="sendButton"
            type="submit"
            aria-label="Send message"
            title="Send"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m22 2-7 20-4-9-9-4Z" />
              <path d="M22 2 11 13" />
            </svg>
          </button>

        </form>

        <div class="composer-note">
          Shift + Enter for a new line
        </div>

      </footer>

    </section>

  </main>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    /* ==========================================
       SUPABASE CONFIG
    ========================================== */

    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const SPACE_ID =
      "6547fe99-ed80-421c-8572-50ae3fb6fbe4";

    const { createClient } = supabase;

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    /* ==========================================
       STATE
    ========================================== */

    let currentUser = null;
    let currentUsername = "You";
    let partnerName = "Other";
    let realtimeChannel = null;

    let toastTimer = null;
    let isSending = false;

    /* ==========================================
       ELEMENTS
    ========================================== */

    const messageList =
      document.getElementById(
        "messageList"
      );

    const messagesArea =
      document.getElementById(
        "messagesArea"
      );

    const messageForm =
      document.getElementById(
        "messageForm"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const backButton =
      document.getElementById(
        "backButton"
      );

    const homeButton =
      document.getElementById(
        "homeButton"
      );

    const toast =
      document.getElementById("toast");

    /* ==========================================
       HELPERS
    ========================================== */

    function escapeHtml(value) {
      const div =
        document.createElement("div");

      div.textContent = value;

      return div.innerHTML;
    }

    function showToast(text) {
      clearTimeout(toastTimer);

      toast.textContent = text;

      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function formatTime(timestamp) {
      const date =
        new Date(timestamp);

      return date.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

    function getDateKey(timestamp) {
      const date =
        new Date(timestamp);

      return [
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      ].join("-");
    }

    function formatDateLabel(
      timestamp
    ) {
      const date =
        new Date(timestamp);

      const now =
        new Date();

      const yesterday =
        new Date();

      yesterday.setDate(
        yesterday.getDate() - 1
      );

      const isToday =
        date.toDateString() ===
        now.toDateString();

      const isYesterday =
        date.toDateString() ===
        yesterday.toDateString();

      if (isToday) {
        return "Today";
      }

      if (isYesterday) {
        return "Yesterday";
      }

      return date.toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );
    }

    function scrollToBottom(
      smooth = true
    ) {
      requestAnimationFrame(() => {
        messagesArea.scrollTo({
          top:
            messagesArea.scrollHeight,
          behavior:
            smooth
              ? "smooth"
              : "auto"
        });
      });
    }

    function messageAlreadyRendered(
      messageId
    ) {
      return Boolean(
        messageList.querySelector(
          `[data-message-id="${messageId}"]`
        )
      );
    }

    /* ==========================================
       AUTH
    ========================================== */

    async function checkAuthentication() {
      const {
        data: { user },
        error
      } = await client.auth.getUser();

      if (
        error ||
        !user
      ) {
        window.location.href =
          "login.html";

        return false;
      }

      currentUser = user;

      return true;
    }

    /* ==========================================
       PROFILE
    ========================================== */

    async function loadProfile() {
      const {
        data,
        error
      } = await client
        .from("user_profiles")
        .select("username")
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();

      if (
        !error &&
        data?.username
      ) {
        currentUsername =
          data.username;
      }

      const normalized =
        currentUsername
          .trim()
          .toLowerCase();

      if (
        normalized ===
        "mohammad"
      ) {
        partnerName =
          "Salma";
      } else if (
        normalized ===
        "salma"
      ) {
        partnerName =
          "Mohammad";
      } else {
        partnerName =
          "Other";
      }

      document.title =
        `Our Space — Chat`;
    }

    /* ==========================================
       RENDER ONE MESSAGE
    ========================================== */

    function createMessageElement(
      message
    ) {
      const isMine =
        message.sender_id ===
        currentUser.id;

      const row =
        document.createElement(
          "div"
        );

      row.className =
        `message-row ${
          isMine
            ? "mine"
            : "theirs"
        }`;

      row.dataset.messageId =
        message.id;

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "message-content";

      const sender =
        document.createElement(
          "div"
        );

      sender.className =
        "message-sender";

      sender.textContent =
        isMine
          ? "You"
          : partnerName;

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "message-bubble";

      bubble.textContent =
        message.content;

      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "message-meta";

      meta.textContent =
        formatTime(
          message.created_at
        );

      content.appendChild(
        sender
      );

      content.appendChild(
        bubble
      );

      content.appendChild(
        meta
      );

      row.appendChild(
        content
      );

      return row;
    }

    /* ==========================================
       DATE SEPARATOR
    ========================================== */

    function createDateSeparator(
      timestamp
    ) {
      const separator =
        document.createElement(
          "div"
        );

      separator.className =
        "date-separator";

      separator.dataset.date =
        getDateKey(timestamp);

      separator.textContent =
        formatDateLabel(
          timestamp
        );

      return separator;
    }

    /* ==========================================
       EMPTY STATE
    ========================================== */

    function renderEmptyState() {
      messageList.innerHTML = "";

      const empty =
        document.createElement(
          "div"
        );

      empty.className =
        "empty-state";

      empty.innerHTML = `
        <div class="empty-card">

          <div class="empty-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 9h10" />
              <path d="M7 13h6" />
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H11l-4.5 4V16H6.5A2.5 2.5 0 0 1 4 13.5z" />
            </svg>
          </div>

          <div class="empty-title">
            Start your conversation
          </div>

          <div class="empty-description">
            Send the first message and your
            conversation will stay here.
          </div>

        </div>
      `;

      messageList.appendChild(
        empty
      );
    }

    /* ==========================================
       LOADING STATE
    ========================================== */

    function renderLoadingState() {
      messageList.innerHTML = `
        <div class="empty-state">

          <div class="empty-card">

            <div class="empty-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M7 9h10" />
                <path d="M7 13h6" />
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H11l-4.5 4V16H6.5A2.5 2.5 0 0 1 4 13.5z" />
              </svg>
            </div>

            <div class="empty-title">
              Loading conversation
            </div>

            <div class="empty-description">
              Getting your messages...
            </div>

          </div>

        </div>
      `;
    }

    /* ==========================================
       RENDER MESSAGES
    ========================================== */

    function renderMessages(
      messages
    ) {
      messageList.innerHTML = "";

      if (
        !messages ||
        !messages.length
      ) {
        renderEmptyState();
        return;
      }

      let previousDate = null;

      messages.forEach(
        (message) => {
          const currentDate =
            getDateKey(
              message.created_at
            );

          if (
            currentDate !==
            previousDate
          ) {
            messageList.appendChild(
              createDateSeparator(
                message.created_at
              )
            );

            previousDate =
              currentDate;
          }

          messageList.appendChild(
            createMessageElement(
              message
            )
          );
        }
      );
    }

    /* ==========================================
       LOAD MESSAGES
    ========================================== */

    async function loadMessages(
      scroll = true
    ) {
      renderLoadingState();

      const {
        data,
        error
      } = await client
        .from("messages")
        .select(
          "id, sender_id, content, created_at"
        )
        .eq(
          "space_id",
          SPACE_ID
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        )
        .limit(500);

      if (error) {
        console.error(
          "Message loading error:",
          error
        );

        messageList.innerHTML = `
          <div class="empty-state">

            <div class="empty-card">

              <div class="empty-title">
                Unable to load messages
              </div>

              <div class="empty-description">
                Please refresh the page and try again.
              </div>

            </div>

          </div>
        `;

        return;
      }

      renderMessages(
        data || []
      );

      if (scroll) {
        scrollToBottom(false);
      }
    }

    /* ==========================================
       APPEND REALTIME MESSAGE
    ========================================== */

    function appendRealtimeMessage(
      message
    ) {
      if (
        !message ||
        message.space_id !==
          SPACE_ID
      ) {
        return;
      }

      if (
        messageAlreadyRendered(
          message.id
        )
      ) {
        return;
      }

      const lastMessage =
        messageList.querySelector(
          ".message-row:last-of-type"
        );

      const lastDateSeparator =
        messageList.querySelector(
          ".date-separator:last-of-type"
        );

      const currentDate =
        getDateKey(
          message.created_at
        );

      let needsSeparator =
        true;

      if (
        lastDateSeparator?.dataset.date ===
        currentDate
      ) {
        needsSeparator = false;
      }

      if (
        lastMessage &&
        !needsSeparator
      ) {
        messageList.appendChild(
          createMessageElement(
            message
          )
        );
      } else {
        messageList.appendChild(
          createDateSeparator(
            message.created_at
          )
        );

        messageList.appendChild(
          createMessageElement(
            message
          )
        );
      }

      scrollToBottom(true);
    }

    /* ==========================================
       SEND MESSAGE
    ========================================== */

    async function sendMessage() {
      if (isSending) {
        return;
      }

      const content =
        messageInput.value.trim();

      if (!content) {
        return;
      }

      if (!currentUser) {
        return;
      }

      isSending = true;
      sendButton.disabled = true;

      const {
        data,
        error
      } = await client
        .from("messages")
        .insert({
          space_id:
            SPACE_ID,

          sender_id:
            currentUser.id,

          content
        })
        .select(
          "id, sender_id, content, created_at"
        )
        .single();

      if (error) {
        console.error(
          "Message send error:",
          error
        );

        showToast(
          "Message could not be sent."
        );

        isSending = false;
        sendButton.disabled = false;

        return;
      }

      messageInput.value = "";
      autoResizeInput();

      /*
       * Add immediately in case Realtime takes
       * a moment. The Realtime listener prevents
       * duplicate rendering.
       */
      appendRealtimeMessage(
        data
      );

      isSending = false;
      sendButton.disabled = false;

      messageInput.focus();
    }

    /* ==========================================
       REALTIME
    ========================================== */

    function subscribeToMessages() {
      if (realtimeChannel) {
        client.removeChannel(
          realtimeChannel
        );
      }

      realtimeChannel =
        client
          .channel(
            "our-space-chat"
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter:
                `space_id=eq.${SPACE_ID}`
            },
            (payload) => {
              appendRealtimeMessage(
                payload.new
              );
            }
          )
          .subscribe(
            (status) => {
              if (
                status ===
                "CHANNEL_ERROR"
              ) {
                console.error(
                  "Realtime channel error."
                );
              }
            }
          );
    }

    /* ==========================================
       INPUT RESIZE
    ========================================== */

    function autoResizeInput() {
      messageInput.style.height =
        "48px";

      messageInput.style.height =
        `${Math.min(
          messageInput.scrollHeight,
          150
        )}px`;
    }

    /* ==========================================
       NAVIGATION
    ========================================== */

    function goHome() {
      window.location.href =
        "index.html";
    }

    backButton.addEventListener(
      "click",
      goHome
    );

    homeButton.addEventListener(
      "click",
      goHome
    );

    /* ==========================================
       FORM
    ========================================== */

    messageForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        await sendMessage();
      }
    );

    messageInput.addEventListener(
      "input",
      autoResizeInput
    );

    messageInput.addEventListener(
      "keydown",
      async (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          await sendMessage();
        }
      }
    );

    /* ==========================================
       AUTH STATE
    ========================================== */

    client.auth.onAuthStateChange(
      (event, session) => {
        if (
          event ===
            "SIGNED_OUT" ||
          !session
        ) {
          window.location.href =
            "login.html";
        }
      }
    );

    /* ==========================================
       CLEANUP
    ========================================== */

    window.addEventListener(
      "beforeunload",
      () => {
        if (realtimeChannel) {
          client.removeChannel(
            realtimeChannel
          );
        }
      }
    );

    /* ==========================================
       INITIALIZE
    ========================================== */

    async function initializeChat() {
      const authenticated =
        await checkAuthentication();

      if (!authenticated) {
        return;
      }

      await loadProfile();

      await loadMessages(false);

      subscribeToMessages();

      scrollToBottom(false);

      setTimeout(() => {
        messageInput.focus();
      }, 150);
    }

    initializeChat();
  </script>

</body>
</html>
