  <style>
    :root {

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,

        sans-serif;

    body {
      overflow: hidden;

    button,
    textarea {
      font: inherit;
    }

    button {

    .app {
      width: 100%;

      display: flex;
      flex-direction: column;

    /* HEADER */

    .header {
      flex-shrink: 0;
      padding:
        max(12px, env(safe-area-inset-top))
        16px
        12px;
      background: rgba(248, 240, 236, 0.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 20;
    }

    .header-inner {
      width: min(100%, 760px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;

    .header-left,

      display: flex;
      align-items: center;

    .icon-button {

      border-radius: 12px;
      background: rgba(255, 255, 255, 0.8);

      justify-content: flex-start;

    .bubble {
      max-width: min(80%, 520px);

      white-space: pre-wrap;
      word-break: break-word;

    .mine .bubble {
      background: var(--navy);
      color: var(--white);
      border-bottom-right-radius: 7px;
    }

    .theirs .bubble {
      background: var(--white);
      color: var(--text);
      border: 1px solid var(--border);

    .message-text {

      display: block;

      font-size: 8px;

      opacity: 0.62;
    }

    .deleted-content {
      font-style: normal;
    }

    .date-separator {
      display: flex;

    }

    .date-separator span {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
    }

    .empty {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .empty-card {
      width: min(100%, 330px);
      padding: 26px 22px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
      border-radius: 22px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .empty-card h2 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 17px;
    }

    .empty-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .error-card {
      width: min(100%, 560px);
      margin: 30px auto;
      padding: 16px;
      border-radius: 15px;
      background: var(--white);
      border: 1px solid rgba(150, 60, 55, 0.2);
      color: #873C36;
      font-size: 12px;
      line-height: 1.5;
    }

    .error-card strong {
      display: block;
      margin-bottom: 5px;
    }

    /* COMPOSER */

    .composer-area {
      flex-shrink: 0;
      padding:
        9px 12px
        max(12px, env(safe-area-inset-bottom));
      background: rgba(248, 240, 236, 0.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .composer {
      width: min(100%, 760px);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-end;
      padding: 3px 6px 3px 12px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    textarea {
      width: 100%;
      min-height: 40px;
      max-height: 130px;
      margin: 0;
      padding: 9px 3px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--text);
      line-height: 1.4;
      font-size: 14px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-button {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: var(--navy);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-button:active {
      transform: scale(0.96);
    }

    .send-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .send-button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    @media (max-width: 600px) {
      .messages {
        padding-left: 10px;
        padding-right: 10px;
      }

      .bubble {
        max-width: 86%;
      }

      .message-text {
        font-size: 13.5px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="header-inner">

        <div class="header-left">
          <button
            class="icon-button"
            id="homeButton"
            type="button"
            aria-label="Home"
            title="Home"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
              <path d="M4 10.5 12 4l8 6.5"></path>
              <path d="M6.5 9.5V20h11V9.5"></path>
              <path d="M10 20v-5h4v5"></path>
            </svg>
          </button>

          <div class="heading">
            <p class="title">Our Space</p>
            <p class="subtitle" id="subtitle">Private chat</p>
          </div>
        </div>

        <div class="header-right">
          <button
            class="icon-button"
            id="logoutButton"
            type="button"
            aria-label="Log out"
            title="Log out"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
              <path d="M10 4H5.8A1.8 1.8 0 0 0 4 5.8v12.4A1.8 1.8 0 0 0 5.8 20H10"></path>
              <path d="M14 8l4 4-4 4"></path>
              <path d="M9 12h9"></path>
            </svg>
          </button>
        </div>

      </div>
    </header>

    <main class="messages-scroll" id="messagesScroll">
      <div class="messages" id="messages"></div>
    </main>

    <div class="composer-area">
      <form class="composer" id="composer">

        <div class="input-wrap">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Write a message..."
            autocomplete="off"
          ></textarea>
        </div>

        <button
          class="send-button"
          id="sendButton"
          type="submit"
          aria-label="Send"
          title="Send"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
            <path d="M21 3 10.5 13.5"></path>
            <path d="m21 3-6.5 18-4-7.5L3 9.5 21 3Z"></path>
          </svg>
        </button>

      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ywflohxufmfydkpkkqly.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const SPACE_ID =
      "6547fe99-ed80-421c-8572-50ae3fb6fbe4";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const messagesEl = document.getElementById("messages");
    const scrollEl = document.getElementById("messagesScroll");
    const form = document.getElementById("composer");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const homeButton = document.getElementById("homeButton");
    const logoutButton = document.getElementById("logoutButton");

    let currentUser = null;
    let channel = null;
    let messageRows = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(value) {
      if (!value) return "";

      return new Date(value).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getDateKey(value) {
      const d = new Date(value);

      return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
      );
    }

    function formatDate(value) {
      return new Date(value).toLocaleDateString([], {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function showError(message) {
      messagesEl.innerHTML = `
        <div class="error-card">
          <strong>Chat error</strong>
          ${escapeHtml(message)}
        </div>
      `;
    }

    function renderMessages() {
      if (!messageRows.length) {
        messagesEl.innerHTML = `
          <div class="empty">
            <div class="empty-card">
              <h2>No messages yet</h2>
              <p>Send a message to start the conversation.</p>
            </div>
          </div>
        `;
        return;
      }

      let html = "";
      let previousDate = "";

      for (const row of messageRows) {
        const date = getDateKey(row.created_at);

        if (date !== previousDate) {
          html += `
            <div class="date-separator">
              <span>${escapeHtml(formatDate(row.created_at))}</span>
            </div>
          `;

          previousDate = date;
        }

        const mine =
          currentUser &&
          row.sender_id === currentUser.id;

        const deleted = Boolean(row.deleted_at);

        const deletedLabel = deleted
          ? `<span class="deleted-label">Deleted</span>`
          : "";

        const status = mine
          ? (
              row.seen_at
                ? "Seen"
                : row.delivered_at
                  ? "Delivered"
                  : "Sent"
            )
          : "";

        html += `
          <div class="message ${mine ? "mine" : "theirs"}">
            <div class="bubble">
              ${deletedLabel}
              <div class="${deleted ? "deleted-content" : "message-text"}">
                ${escapeHtml(row.content)}
              </div>

              <div class="message-meta">
                <span>${escapeHtml(formatTime(row.created_at))}</span>
                ${mine ? `<span>${escapeHtml(status)}</span>` : ""}
              </div>
            </div>
          </div>
        `;
      }

      messagesEl.innerHTML = html;

      requestAnimationFrame(() => {
        scrollEl.scrollTop = scrollEl.scrollHeight;
      });
    }

    async function loadMessages() {
      if (!currentUser) return;

      /*
        IMPORTANT:
        The first query only uses the ORIGINAL message columns.
        That means newer delete/status columns cannot break the chat.
      */

      const { data, error } = await client
        .from("messages")
        .select(
          "id,space_id,sender_id,content,created_at"
        )
        .eq("space_id", SPACE_ID)
        .order("created_at", { ascending: true });

      if (error) {
        console.error("MESSAGE LOAD ERROR:", error);
        showError(error.message);
        return;
      }

      messageRows = data || [];

      /*
        Try to enrich with the newer columns.
        If they don't exist, the normal chat still works.
      */

      if (messageRows.length) {
        try {
          const ids = messageRows.map((row) => row.id);

          const { data: extraRows, error: extraError } =
            await client
              .from("messages")
              .select(
                "id,deleted_at,deleted_by,delivered_at,seen_at"
              )
              .in("id", ids);

          if (!extraError && extraRows) {
            const extraMap = new Map(
              extraRows.map((row) => [
                row.id,
                row
              ])
            );

            messageRows = messageRows.map((row) => ({
              ...row,
              ...(extraMap.get(row.id) || {})
            }));
          }
        } catch (extraError) {
          console.warn(
            "Optional message fields unavailable:",
            extraError
          );
        }
      }

      renderMessages();
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) {
        return;
      }

      if (!currentUser) {
        return;
      }

      sendButton.disabled = true;

      const { error } = await client
        .from("messages")
        .insert({
          space_id: SPACE_ID,
          sender_id: currentUser.id,
          content: text
        });

      sendButton.disabled = false;

      if (error) {
        console.error("SEND ERROR:", error);
        alert(error.message);
        return;
      }

      input.value = "";
      input.style.height = "40px";

      await loadMessages();

      input.focus();
    }

    async function markIncomingMessages() {
      if (!currentUser || !messageRows.length) {
        return;
      }

      const ids = messageRows
        .filter(
          (row) =>
            row.sender_id !== currentUser.id
        )
        .map((row) => row.id);

      if (!ids.length) {
        return;
      }

      try {
        await client.rpc(
          "mark_messages_delivered",
          {
            p_message_ids: ids
          }
        );
      } catch (error) {
        console.warn(
          "Delivered status unavailable:",
          error
        );
      }

      try {
        await client.rpc(
          "mark_messages_seen",
          {
            p_message_ids: ids
          }
        );
      } catch (error) {
        console.warn(
          "Seen status unavailable:",
          error
        );
      }
    }

    function subscribeRealtime() {
      if (channel) {
        client.removeChannel(channel);
      }

      channel = client
        .channel("our-space-chat")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter: "space_id=eq." + SPACE_ID
          },
          async () => {
            await loadMessages();
          }
        )
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "messages",
            filter: "space_id=eq." + SPACE_ID
          },
          async () => {
            await loadMessages();
          }
        )
        .subscribe();
    }

    async function initialise() {
      const { data, error } =
        await client.auth.getSession();

      if (error) {
        console.error("SESSION ERROR:", error);
        window.location.href = "login.html";
        return;
      }

      if (!data.session || !data.session.user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = data.session.user;

      await loadMessages();
      await markIncomingMessages();
      await loadMessages();

      subscribeRealtime();
    }

    /*
      SEND BUTTON
    */

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      event.stopPropagation();

      await sendMessage();
    });

    /*
      ENTER KEY
      Enter = send
      Shift + Enter = new line
    */

    input.addEventListener("keydown", async (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        event.stopPropagation();

        await sendMessage();
      }
    });

    /*
      AUTO-RESIZE TEXTAREA
    */

    input.addEventListener("input", () => {
      input.style.height = "auto";

      const height = Math.min(
        input.scrollHeight,
        130
      );

      input.style.height = height + "px";
    });

    homeButton.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    logoutButton.addEventListener(
      "click",
      async () => {
        await client.auth.signOut();
        window.location.href = "login.html";
      }
    );

    client.auth.onAuthStateChange(
      (event, session) => {
        if (
          event === "SIGNED_OUT" ||
          !session
        ) {
          window.location.href = "login.html";
        }
      }
    );

    initialise();
  </script>
</body>
</html>
