
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Our Space</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #F8F0EC;
      --navy: #152B46;
      --navy-light: #1D3B60;
      --peach: #F3B29F;
      --blue: #DCEAF5;
      --white: #FFFFFF;
      --text: #26313D;
      --muted: #7A8794;
      --border: rgba(21, 43, 70, 0.09);
      --input-border: rgba(21, 43, 70, 0.18);
      --soft-border: rgba(21, 43, 70, 0.06);
      --shadow: 0 10px 30px rgba(21, 43, 70, 0.06);
      --input-shadow: 0 8px 24px rgba(21, 43, 70, 0.08);
      --bubble-shadow: 0 5px 18px rgba(21, 43, 70, 0.045);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      flex-shrink: 0;
      position: relative;
      z-index: 40;

      padding:
        max(12px, env(safe-area-inset-top))
        18px
        12px;

      background: rgba(248, 240, 236, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(100%, 820px);
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-button {
      width: 38px;
      height: 38px;
      flex-shrink: 0;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.82);
      color: var(--navy);

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .header-button:hover {
      background: var(--white);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    .header-button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    .header-copy {
      min-width: 0;
    }

    .header-title {
      margin: 0;

      color: var(--navy);
      font-size: 15px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .header-subtitle {
      margin: 3px 0 0;

      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
      font-weight: 500;
    }

    /* =========================
       SELECTION TOOLBAR
    ========================= */

    .selection-toolbar {
      width: min(100%, 820px);
      margin: 10px auto 0;

      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 8px 9px;

      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(243, 178, 159, 0.55);
      border-radius: 15px;

      box-shadow: 0 5px 18px rgba(21, 43, 70, 0.04);
    }

    .selection-toolbar.visible {
      display: flex;
    }

    .selection-info {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 5px;
    }

    .selection-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--peach);
    }

    .selection-count {
      color: var(--navy);
      font-size: 11px;
      font-weight: 800;
    }

    .selection-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-button {
      height: 32px;
      border: 0;
      border-radius: 10px;
      padding: 0 11px;

      font-size: 10px;
      font-weight: 800;
    }

    .toolbar-delete {
      width: 32px;
      padding: 0;

      background: var(--navy);
      color: var(--white);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toolbar-delete svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    .toolbar-cancel {
      background: var(--blue);
      color: var(--navy);
    }

    /* =========================
       MESSAGES AREA
    ========================= */

    .messages-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;

      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;

      scrollbar-width: thin;
      scrollbar-color: rgba(21, 43, 70, 0.12) transparent;
    }

    .messages-scroll::-webkit-scrollbar {
      width: 7px;
    }

    .messages-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-scroll::-webkit-scrollbar-thumb {
      background: rgba(21, 43, 70, 0.12);
      border-radius: 999px;
    }

    .messages-container {
      width: min(100%, 800px);
      margin: 0 auto;

      padding:
        22px 17px
        24px;
    }

    /* =========================
       DATE DIVIDER
    ========================= */

    .date-divider {
      display: flex;
      justify-content: center;

      margin:
        15px 0
        11px;
    }

    .date-divider span {
      padding: 5px 10px;

      background: rgba(255, 255, 255, 0.68);
      border: 1px solid var(--soft-border);
      border-radius: 999px;

      color: var(--muted);
      font-size: 9px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0.025em;
    }

    /* =========================
       MESSAGE ROW
    ========================= */

    .message-row {
      width: 100%;

      display: flex;
      position: relative;

      margin: 4px 0;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      position: relative;
      max-width: min(77%, 560px);
    }

    /* =========================
       MESSAGE BUBBLE
    ========================= */

    .message-bubble {
      position: relative;

      padding:
        10px 14px
        8px;

      border-radius: 19px;

      box-shadow: var(--bubble-shadow);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.1s ease;

      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message-row.mine .message-bubble {
      background: var(--navy);
      color: var(--white);

      border: 1px solid var(--navy);

      border-bottom-right-radius: 7px;
    }

    .message-row.theirs .message-bubble {
      background: var(--white);
      color: var(--text);

      border: 1px solid var(--border);

      border-bottom-left-radius: 7px;
    }

    .message-row.grouped-mine .message-bubble {
      border-top-right-radius: 12px;
    }

    .message-row.grouped-theirs .message-bubble {
      border-top-left-radius: 12px;
    }

    .message-row.selected .message-bubble {      border-color: var(--peach);
      box-shadow:
        0 0 0 2px rgba(243, 178, 159, 0.20),
        var(--bubble-shadow);
    }

    .message-text {
      display: block;

      font-size: 14px;
      line-height: 1.48;
      letter-spacing: -0.004em;
    }

    /* =========================
       DELETED MESSAGE
    ========================= */

    .message-bubble.deleted {
      opacity: 1;
      box-shadow: var(--bubble-shadow);
    }

    .message-row.mine .message-bubble.deleted {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--white);
    }

    .message-row.theirs .message-bubble.deleted {
      background: var(--white);
      border-color: var(--border);
      color: var(--text);
    }

    .deleted-label {
      display: block;

      margin-bottom: 4px;

      color: inherit;
      opacity: 0.58;

      font-size: 8px;
      line-height: 1;

      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .deleted-content {
      display: block;

      color: inherit;
      font-size: 14px;
      line-height: 1.48;
      font-style: normal;
    }

    /* =========================
       MESSAGE META
    ========================= */

    .message-meta {
      margin-top: 5px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;

      color: inherit;
      opacity: 0.56;

      font-size: 8.5px;
      line-height: 1;
      font-weight: 600;
    }

    .message-status {
      font-weight: 750;
    }

    /* =========================
       MESSAGE MENU
    ========================= */

    .message-menu-trigger {
      position: absolute;

      right: 5px;
      top: 50%;

      width: 22px;
      height: 22px;

      padding: 0;

      transform: translateY(-50%);

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: currentColor;

      opacity: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity 0.15s ease,
        background 0.15s ease;
    }

    .message-bubble:hover .message-menu-trigger,
    .message-menu-trigger:focus-visible {
      opacity: 0.5;
    }

    .message-menu-trigger:hover {
      opacity: 0.9;
      background: rgba(255, 255, 255, 0.10);
    }

    .message-menu-trigger svg {
      width: 13px;
      height: 13px;

      fill: currentColor;
      stroke: none;
    }

    .message-menu {
      position: absolute;

      right: 4px;
      top: calc(100% + 6px);

      min-width: 86px;

      padding: 5px;

      display: none;

      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 11px;

      box-shadow: var(--shadow);

      z-index: 30;
    }

    .message-menu.open {
      display: block;
    }

    .message-menu button {
      width: 100%;

      border: 0;
      border-radius: 7px;

      padding: 8px 9px;

      background: transparent;
      color: var(--navy);

      text-align: left;

      font-size: 10px;
      font-weight: 750;
    }

    .message-menu button:hover {
      background: var(--blue);
    }

    /* =========================
       EMPTY / ERROR
    ========================= */

    .empty-state {
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 20px;
    }

    .empty-card {
      width: min(100%, 320px);

      padding: 28px 24px;

      background: rgba(255, 255, 255, 0.74);
      border: 1px solid var(--border);
      border-radius: 23px;

      box-shadow: var(--shadow);

      text-align: center;
    }

    .empty-card h2 {
      margin: 0 0 7px;

      color: var(--navy);
      font-size: 17px;
      font-weight: 800;
    }

    .empty-card p {
      margin: 0;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .error-card {
      width: min(100%, 560px);

      margin: 28px auto;

      padding: 16px 17px;

      background: var(--white);
      border: 1px solid rgba(170, 75, 65, 0.20);
      border-radius: 15px;

      color: #863C36;

      font-size: 12px;
      line-height: 1.5;
    }

    .error-card strong {
      display: block;
      margin-bottom: 5px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      flex-shrink: 0;

      padding:
        11px 17px
        max(13px, env(safe-area-inset-bottom));

      background: rgba(248, 240, 236, 0.97);
      border-top: 1px solid rgba(21, 43, 70, 0.08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .composer {
      width: min(100%, 800px);
      margin: 0 auto;

      display: flex;
      align-items: flex-end;

      gap: 9px;
    }

    /*
      MUCH MORE OBVIOUS INPUT
    */

    .input-shell {
      flex: 1;
      min-width: 0;

      display: flex;
      align-items: flex-end;

      min-height: 49px;

      padding:
        4px 7px
        4px 15px;

      background: var(--white);

      border:
        1.5px solid
        var(--input-border);

      border-radius: 17px;

      box-shadow: var(--input-shadow);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .input-shell:focus-within {
      border-color: rgba(21, 43, 70, 0.35);

      box-shadow:
        0 0 0 3px rgba(220, 234, 245, 0.8),
        var(--input-shadow);
    }

    .input-icon {
      width: 18px;
      height: 18px;

      margin:
        0 8px 10px 0;

      flex-shrink: 0;

      color: var(--navy);
      opacity: 0.55;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    .message-input {
      width: 100%;

      min-height: 40px;
      max-height: 130px;

      padding:
        9px 2px;

      border: 0;
      outline: 0;
      resize: none;

      background: transparent;
      color: var(--text);

      font-size: 14px;
      line-height: 1.4;
    }

    .message-input::placeholder {
      color: #6F7D89;
      opacity: 1;
    }

    /*
      CLEAR SEND BUTTON
    */

    .send-button {
      height: 49px;
      min-width: 76px;

      flex-shrink: 0;

      padding: 0 14px;

      border: 0;
      border-radius: 15px;

      background: var(--navy);
      color: var(--white);

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      box-shadow:
        0 8px 19px rgba(21, 43, 70, 0.17);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .send-button:hover {
      background: var(--navy-light);
    }

    .send-button:active {      transform: scale(0.95);
    }

    .send-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .send-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .send-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 620px) {

      .header {
        padding-left: 12px;
        padding-right: 12px;
      }

      .messages-container {
        padding-left: 10px;
        padding-right: 10px;
      }

      .composer-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .message-content {
        max-width: 84%;
      }

      .message-text,
      .deleted-content {
        font-size: 13.5px;
      }

      .message-menu-trigger {
        opacity: 0.42;
      }

      .selection-toolbar {
        margin-left: 10px;
        margin-right: 10px;
        width: auto;
      }

      .input-shell {
        min-height: 48px;
        padding-left: 12px;
      }

      .input-icon {
        display: none;
      }

      .send-button {
        min-width: 50px;
        width: 50px;
        padding: 0;
      }

      .send-label {
        display: none;
      }
    }

    @media (max-width: 380px) {

      .composer {
        gap: 7px;
      }

      .send-button {
        width: 47px;
        min-width: 47px;
      }

      .message-input {
        font-size: 13.5px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="header-inner">

        <div class="header-left">

          <button
            class="header-button"
            id="homeButton"
            type="button"
            aria-label="Home"
            title="Home"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="1.7"
            >
              <path d="M4 10.5 12 4l8 6.5"></path>
              <path d="M6.5 9.5V20h11V9.5"></path>
              <path d="M10 20v-5h4v5"></path>
            </svg>
          </button>

          <div class="header-copy">
            <p class="header-title">Our Space</p>
            <p
              class="header-subtitle"
              id="headerSubtitle"
            >
              Private chat
            </p>
          </div>

        </div>

        <div class="header-right">

          <button
            class="header-button"
            id="logoutButton"
            type="button"
            aria-label="Log out"
            title="Log out"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="1.7"
            >
              <path d="M10 4H5.8A1.8 1.8 0 0 0 4 5.8v12.4A1.8 1.8 0 0 0 5.8 20H10"></path>
              <path d="M14 8l4 4-4 4"></path>
              <path d="M9 12h9"></path>
            </svg>
          </button>

        </div>

      </div>

      <!-- SELECTION TOOLBAR -->

      <div
        class="selection-toolbar"
        id="selectionToolbar"
      >

        <div class="selection-info">
          <span class="selection-dot"></span>

          <span
            class="selection-count"
            id="selectionCount"
          >
            0 selected
          </span>
        </div>

        <div class="selection-actions">

          <button
            class="toolbar-button toolbar-delete"
            id="deleteButton"
            type="button"
            aria-label="Delete"
            title="Delete"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="1.7"
            >
              <path d="M4 7h16"></path>
              <path d="M9 7V4h6v3"></path>
              <path d="M7 7l1 13h8l1-13"></path>
            </svg>
          </button>

          <button
            class="toolbar-button toolbar-cancel"
            id="cancelSelectionButton"
            type="button"
          >
            Cancel
          </button>

        </div>

      </div>

    </header>

    <!-- MESSAGES -->

    <main
      class="messages-scroll"
      id="messagesScroll"
    >
      <div
        class="messages-container"
        id="messages"
      ></div>
    </main>

    <!-- COMPOSER -->

    <div class="composer-area">

      <form
        class="composer"
        id="composer"
      >

        <div class="input-shell">

          <div class="input-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="1.7"
            >
              <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 7.8 7.8 0 0 1-3.3-.7L4 20l1.7-4.6A7.4 7.4 0 0 1 5 11.5 7.5 7.5 0 1 1 20 11.5Z"></path>
            </svg>
          </div>

          <textarea
            class="message-input"
            id="messageInput"
            rows="1"
            placeholder="Type a message..."
            autocomplete="off"
          ></textarea>

        </div>

        <button
          class="send-button"
          id="sendButton"
          type="submit"
          aria-label="Send message"
          title="Send message"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
          >
            <path d="M21 3 10.5 13.5"></path>
            <path d="m21 3-6.5 18-4-7.5L3 9.5 21 3Z"></path>
          </svg>

          <span class="send-label">
            Send
          </span>

        </button>

      </form>

    </div>

  </div>

  <script src="/notifications.js"></script>
  <script>
    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const SPACE_ID =
      "6547fe99-ed80-421c-8572-50ae3fb6fbe4";

    const client =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    /* ==========================================
       ELEMENTS
    ========================================== */

    const messagesEl =
      document.getElementById("messages");

    const messagesScroll =
      document.getElementById("messagesScroll");

    const input =
      document.getElementById("messageInput");

    const composer =
      document.getElementById("composer");

    const sendButton =
      document.getElementById("sendButton");

    const homeButton =
      document.getElementById("homeButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const headerSubtitle =
      document.getElementById("headerSubtitle");

    const selectionToolbar =
      document.getElementById("selectionToolbar");

    const selectionCount =
      document.getElementById("selectionCount");

    const deleteButton =
      document.getElementById("deleteButton");

    const cancelSelectionButton =
      document.getElementById(
        "cancelSelectionButton"
      );

    /* ==========================================
       STATE
    ========================================== */

    let currentUser = null;
    let messages = [];
    let selectedIds = new Set();
    let selectionMode = false;
    let realtimeChannel = null;
    let visibleMessageObserver = null;
    let isChatVisible = document.visibilityState === "visible";

    /* ==========================================
       HELPERS
    ========================================== */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function timeLabel(value) {
      return new Date(value).toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

    function dateKey(value) {
      const d = new Date(value);

      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
      ].join("-");
    }
    function dateLabel(value) {
      return new Date(value).toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );
    }

    function isMine(message) {
      return (
        currentUser &&
        message.sender_id ===
          currentUser.id
      );
    }

    function closeMenus() {
      document
        .querySelectorAll(".message-menu.open")
        .forEach((menu) => {
          menu.classList.remove("open");
        });
    }

    function scrollBottom() {
      requestAnimationFrame(() => {
        messagesScroll.scrollTo({
          top: messagesScroll.scrollHeight,
          behavior: "smooth"
        });
      });
    }

    function renderError(message) {
      messagesEl.innerHTML = `
        <div class="error-card">
          <strong>Unable to load the chat</strong>
          ${escapeHtml(message)}
        </div>
      `;
    }

    /* ==========================================
       STATUS
    ========================================== */

    function messageStatus(message) {
      if (message.seen_at) {
        return "Seen";
      }

      return "Sent";
    }

    /* ==========================================
       RENDER
    ========================================== */

    function renderMessages() {

      closeMenus();

      if (!messages.length) {

        messagesEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-card">
              <h2>Our Space</h2>
              <p>
                Start your conversation here.
              </p>
            </div>
          </div>
        `;

        updateSelectionToolbar();
        return;
      }

      let html = "";
      let previousDate = null;

      for (
        let i = 0;
        i < messages.length;
        i++
      ) {

        const message = messages[i];

        const mine =
          isMine(message);

        const deleted =
          Boolean(
            message.deleted_at
          );

        const currentDate =
          dateKey(
            message.created_at
          );

        if (
          currentDate !==
          previousDate
        ) {

          html += `
            <div class="date-divider">
              <span>
                ${escapeHtml(
                  dateLabel(
                    message.created_at
                  )
                )}
              </span>
            </div>
          `;

          previousDate =
            currentDate;
        }

        const previous =
          i > 0
            ? messages[i - 1]
            : null;

        const grouped =
          previous &&
          previous.sender_id ===
            message.sender_id &&
          dateKey(
            previous.created_at
          ) === currentDate;

        const selected =
          selectedIds.has(
            message.id
          );

        const rowClass = [
          "message-row",
          mine ? "mine" : "theirs",
          grouped
            ? (
                mine
                  ? "grouped-mine"
                  : "grouped-theirs"
              )
            : "",
          selected
            ? "selected"
            : ""
        ]
          .filter(Boolean)
          .join(" ");

        const deletedHtml =
          deleted
            ? `
              <span class="deleted-label">
                Deleted
              </span>
            `
            : "";

        const contentClass =
          deleted
            ? "deleted-content"
            : "message-text";

        const statusHtml =
          mine
            ? `
              <span class="message-status">
                ${escapeHtml(
                  messageStatus(
                    message
                  )
                )}
              </span>
            `
            : "";

        const menuHtml =
          mine && !deleted
            ? `
              <button
                class="message-menu-trigger"
                type="button"
                data-menu-trigger="${message.id}"
                aria-label="Message options"
              >
                <svg viewBox="0 0 24 24">
                  <circle
                    cx="5"
                    cy="12"
                    r="1.7"
                  ></circle>
                  <circle
                    cx="12"
                    cy="12"
                    r="1.7"
                  ></circle>
                  <circle
                    cx="19"
                    cy="12"
                    r="1.7"
                  ></circle>
                </svg>
              </button>

              <div
                class="message-menu"
                data-menu="${message.id}"
              >
                <button
                  type="button"
                  data-select="${message.id}"
                >
                  Select
                </button>
              </div>
            `
            : "";

        html += `
          <div
            class="${rowClass}"
            data-row="${message.id}"
          >

            <div class="message-content">

              <div
                class="message-bubble ${
                  deleted
                    ? "deleted"
                    : ""
                }"
              >

                ${deletedHtml}

                <span
                  class="${contentClass}"
                >
                  ${escapeHtml(
                    message.content
                  )}
                </span>

                <div class="message-meta">

                  <span>
                    ${escapeHtml(
                      timeLabel(
                        message.created_at
                      )
                    )}
                  </span>

                  ${statusHtml}

                </div>

                ${menuHtml}

              </div>

            </div>

          </div>
        `;
      }

      messagesEl.innerHTML =
        html;

      updateSelectionToolbar();
      setupVisibleMessageObserver();
    }

    /* ==========================================
       SELECTION
    ========================================== */

    function enterSelection(id) {
      selectionMode = true;
      selectedIds.add(
        Number(id)
      );

      updateSelectionToolbar();
    }

    function toggleSelection(id) {

      const numericId =
        Number(id);

      if (
        selectedIds.has(
          numericId
        )
      ) {
        selectedIds.delete(
          numericId
        );
      } else {
        selectedIds.add(
          numericId
        );
      }

      if (!selectedIds.size) {
        exitSelection();
        return;
      }

      updateSelectionToolbar();
    }

    function exitSelection() {

      selectionMode = false;
      selectedIds.clear();

      closeMenus();

      updateSelectionToolbar();

      document
        .querySelectorAll(
          ".message-row.selected"
        )
        .forEach((row) => {
          row.classList.remove(
            "selected"
          );
        });
    }

    function updateSelectionToolbar() {

      if (!selectionMode) {

        selectionToolbar.classList.remove(
          "visible"
        );

        return;
      }

      selectionToolbar.classList.add(
        "visible"
      );

      selectionCount.textContent =
        `${selectedIds.size} ${
          selectedIds.size === 1
            ? "message"
            : "messages"
        } selected`;

      document
        .querySelectorAll(
          "[data-row]"
        )
        .forEach((row) => {

          const id =
            Number(
              row.dataset.row
            );

          row.classList.toggle(
            "selected",
            selectedIds.has(id)
          );
        });
    }

    /* ==========================================
       SEEN
    ========================================== */

    async function markMessageSeen(messageId) {
      if (!currentUser || !messageId) return;

      const message = messages.find(
        (item) => Number(item.id) === Number(messageId)
      );

      if (!message) return;
      if (message.sender_id === currentUser.id) return;
      if (message.seen_at) return;

      const { error } = await client
        .from("messages")
        .update({ seen_at: new Date().toISOString() })
        .eq("id", messageId)
        .eq("space_id", SPACE_ID)
        .neq("sender_id", currentUser.id)
        .is("seen_at", null);

      if (error) {
        console.warn("Could not mark message as seen:", error);
      }
    }

    function setupVisibleMessageObserver() {
      if (visibleMessageObserver) {
        visibleMessageObserver.disconnect();
      }

      visibleMessageObserver = new IntersectionObserver(
        (entries) => {
          if (document.visibilityState !== "visible") return;

          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;

            const id = Number(entry.target.dataset.row);
            markMessageSeen(id);
          });
        },
        {
          root: messagesScroll,
          threshold: 0.65
        }
      );

      document.querySelectorAll("[data-row]").forEach((row) => {
        const message = messages.find(
          (item) => Number(item.id) === Number(row.dataset.row)
        );

        if (
          message &&
          message.sender_id !== currentUser?.id &&
          !message.seen_at
        ) {
          visibleMessageObserver.observe(row);
        }
      });
    }

    function updateChatVisibility() {
      isChatVisible = document.visibilityState === "visible";
      if (isChatVisible) {
        setupVisibleMessageObserver();
      }
    }

    document.addEventListener("visibilitychange", updateChatVisibility);

    /* ==========================================
       LOAD
    ========================================== */

    async function loadMessages(
      shouldScroll = false
    ) {

      if (!currentUser) {        return;
      }

      let result =
        await client
          .from("messages")
          .select(
            `
              id,
              space_id,
              sender_id,
              content,
              created_at,
              deleted_at,
              deleted_by,
              seen_at
            `
          )
          .eq(
            "space_id",
            SPACE_ID
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

      if (result.error) {

        console.warn(
          "Extended message query failed.",
          result.error
        );

        result =
          await client
            .from("messages")
            .select(
              `
                id,
                space_id,
                sender_id,
                content,
                created_at
              `
            )
            .eq(
              "space_id",
              SPACE_ID
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );
      }

      if (result.error) {

        console.error(
          result.error
        );

        renderError(
          result.error.message
        );

        return;
      }

      messages =
        result.data || [];

      renderMessages();

      if (shouldScroll) {
        scrollBottom();
      }
    }

    /* ==========================================
       SEND
    ========================================== */

    async function sendMessage() {

      const value =
        input.value.trim();

      if (!value) {
        return;
      }

      if (!currentUser) {
        return;
      }

      sendButton.disabled = true;

      const { error } =
        await client
          .from("messages")
          .insert({
            space_id:
              SPACE_ID,

            sender_id:
              currentUser.id,

            content:
              value
          });

      sendButton.disabled = false;

      if (error) {

        console.error(
          "Send error:",
          error
        );

        alert(
          error.message
        );

        return;
      }

      input.value = "";
      input.style.height =
        "40px";

      await loadMessages(true);

      const { data: sentMessage } = await client
        .from("messages")
        .select("id, space_id, sender_id, content")
        .eq("space_id", SPACE_ID)
        .eq("sender_id", currentUser.id)
        .eq("content", value)
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();

      if (sentMessage && window.OurSpaceNotifications) {
        await window.OurSpaceNotifications.sendMessage(sentMessage);
      }

      input.focus();
    }

    /* ==========================================
       DELETE
    ========================================== */

    async function deleteSelected() {

      if (!selectedIds.size) {
        return;
      }

      const ids =
        Array.from(
          selectedIds
        );

      deleteButton.disabled = true;

      try {

        for (const id of ids) {

          const message =
            messages.find(
              (item) =>
                Number(
                  item.id
                ) ===
                Number(id)
            );

          if (!message) {
            continue;
          }

          if (
            message.sender_id !==
            currentUser.id
          ) {
            continue;
          }

          const { error } =
            await client.rpc(
              "soft_delete_message",
              {
                p_message_id:
                  id
              }
            );

          if (error) {
            throw error;
          }
        }

        exitSelection();

        await loadMessages();

      } catch (error) {

        console.error(
          "Delete error:",
          error
        );

        alert(
          error.message ||
          "Could not delete the message."
        );

      } finally {

        deleteButton.disabled =
          false;
      }
    }

    /* ==========================================
       REALTIME
    ========================================== */

    function subscribeRealtime() {

      if (realtimeChannel) {

        client.removeChannel(
          realtimeChannel
        );
      }

      realtimeChannel =
        client
          .channel(
            "our-space-chat"
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter:
                `space_id=eq.${SPACE_ID}`
            },
            async () => {
              await loadMessages(
                true
              );
            }
          )
          .on(
            "postgres_changes",
            {
              event: "UPDATE",
              schema: "public",
              table: "messages",
              filter:
                `space_id=eq.${SPACE_ID}`
            },
            async () => {
              await loadMessages(
                false
              );
            }
          )
          .subscribe();
    }

    /* ==========================================
       EVENTS
    ========================================== */

    composer.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        await sendMessage();
      }
    );

    input.addEventListener(
      "keydown",
      async (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing
        ) {

          event.preventDefault();

          await sendMessage();
        }
      }
    );

    input.addEventListener(
      "input",
      () => {

        input.style.height =
          "auto";

        input.style.height =
          Math.min(
            input.scrollHeight,
            130
          ) + "px";
      }
    );

    messagesEl.addEventListener(
      "click",
      (event) => {

        const trigger =
          event.target.closest(
            "[data-menu-trigger]"
          );

        if (trigger) {

          event.stopPropagation();

          const id =
            trigger.dataset
              .menuTrigger;

          const menu =
            document.querySelector(
              `[data-menu="${id}"]`
            );

          if (!menu) {
            return;
          }

          const wasOpen =
            menu.classList.contains(
              "open"
            );

          closeMenus();

          if (!wasOpen) {
            menu.classList.add(
              "open"
            );
          }

          return;
        }

        const selectButton =
          event.target.closest(
            "[data-select]"
          );

        if (selectButton) {

          event.stopPropagation();

          enterSelection(
            selectButton.dataset
              .select
          );

          closeMenus();

          return;
        }

        if (!selectionMode) {
          return;
        }

        const row =
          event.target.closest(
            "[data-row]"
          );

        if (!row) {
          return;
        }

        const id =
          Number(
            row.dataset.row
          );

        const message =
          messages.find(
            (item) =>
              Number(                item.id
              ) === id
          );

        if (
          message &&
          message.sender_id ===
            currentUser.id &&
          !message.deleted_at
        ) {
          toggleSelection(id);
        }
      }
    );

    document.addEventListener(
      "click",
      (event) => {

        if (
          !event.target.closest(
            ".message-menu"
          ) &&
          !event.target.closest(
            ".message-menu-trigger"
          )
        ) {
          closeMenus();
        }
      }
    );

    cancelSelectionButton.addEventListener(
      "click",
      () => {
        exitSelection();
      }
    );

    deleteButton.addEventListener(
      "click",
      async () => {
        await deleteSelected();
      }
    );

    homeButton.addEventListener(
      "click",
      () => {
        window.location.href =
          "index.html";
      }
    );

    logoutButton.addEventListener(
      "click",
      async () => {

        await client.auth.signOut();

        window.location.href =
          "login.html";
      }
    );

    client.auth.onAuthStateChange(
      (event, session) => {

        if (
          event === "SIGNED_OUT" ||
          !session
        ) {
          window.location.href =
            "login.html";
        }
      }
    );

    /* ==========================================
       START
    ========================================== */

    async function start() {

      const {
        data,
        error
      } =
        await client.auth.getSession();

      if (error) {

        console.error(
          error
        );

        window.location.href =
          "login.html";

        return;
      }

      if (
        !data.session ||
        !data.session.user
      ) {

        window.location.href =
          "login.html";

        return;
      }

      currentUser =
        data.session.user;

      headerSubtitle.textContent =
        "Private chat";

      await loadMessages(true);

      if (window.OurSpaceNotifications) {
        await window.OurSpaceNotifications.register(currentUser);
      }

      subscribeRealtime();

      input.focus();
    }

    start();
  </script>

</body>
</html>
