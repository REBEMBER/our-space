
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Space">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Our Space</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js?v=final"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #F8F0EC;
      --navy: #152B46;
      --navy-light: #1D3B60;
      --peach: #F3B29F;
      --blue: #DCEAF5;
      --white: #FFFFFF;
      --text: #26313D;
      --muted: #7A8794;
      --border: rgba(21, 43, 70, 0.09);
      --input-border: rgba(21, 43, 70, 0.18);
      --soft-border: rgba(21, 43, 70, 0.06);
      --shadow: 0 10px 30px rgba(21, 43, 70, 0.06);
      --input-shadow: 0 8px 24px rgba(21, 43, 70, 0.08);
      --bubble-shadow: 0 5px 18px rgba(21, 43, 70, 0.045);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      flex-shrink: 0;
      position: relative;
      z-index: 40;

      padding:
        max(12px, env(safe-area-inset-top))
        18px
        12px;

      background: rgba(248, 240, 236, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(100%, 820px);
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-button {
      width: 38px;
      height: 38px;
      flex-shrink: 0;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.82);
      color: var(--navy);

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .header-button:hover {
      background: var(--white);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    .header-button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    .header-copy {
      min-width: 0;
    }

    .header-title {
      margin: 0;

      color: var(--navy);
      font-size: 15px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .header-subtitle {
      margin: 3px 0 0;

      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
      font-weight: 500;
    }

    /* =========================
       MESSAGES AREA
    ========================= */

    .messages-scroll {
      position: absolute;
      top: var(--header-height, 0px);
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;

      /*
        The composer is fixed above this scroll layer. Do NOT rely on
        padding on the scroll container to create the safe area: browsers
        can treat that padding differently when calculating the maximum
        scroll position. The messages content gets a real bottom spacer
        instead (see .messages-container::after below).
      */
      padding-bottom: 0;
      scroll-padding-bottom: calc(var(--composer-height, 100px) + 24px);

      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overflow-anchor: none;

      scrollbar-width: thin;
      scrollbar-color: rgba(21, 43, 70, 0.12) transparent;
    }

    .messages-scroll::-webkit-scrollbar {
      width: 7px;
    }

    .messages-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-scroll::-webkit-scrollbar-thumb {
      background: rgba(21, 43, 70, 0.12);
      border-radius: 999px;
    }

    .messages-container {
      width: min(100%, 800px);
      margin: 0 auto;

      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding:
        24px 17px 12px;
    }

    /*
      Real scrollable bottom clearance.

      This is deliberately an actual flex item inside the scroll content,
      rather than scroll-container padding. The composer is position:fixed,
      so the final message needs enough real document height to move above
      it when the user reaches the absolute bottom.
    */
    .messages-container::after {
      content: "";
      display: block;
      flex: 0 0 calc(var(--composer-height, 100px) + 24px);
      height: calc(var(--composer-height, 100px) + 24px);
      width: 100%;
      pointer-events: none;
    }

    /* =========================
       DATE DIVIDER
    ========================= */

    .date-divider {
      display: flex;
      justify-content: center;

      margin:
        15px 0
        11px;
    }

    .date-divider span {
      padding: 5px 10px;

      background: rgba(255, 255, 255, 0.68);
      border: 1px solid var(--soft-border);
      border-radius: 999px;

      color: var(--muted);
      font-size: 9px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0.025em;
    }

    /* =========================
       MESSAGE ROW
    ========================= */

    .message-row {
      width: 100%;

      display: flex;
      position: relative;

      margin: 4px 0;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      position: relative;
      max-width: min(77%, 560px);
    }

    /* =========================
       MESSAGE BUBBLE
    ========================= */

    .message-bubble {
      position: relative;

      padding:
        10px 14px
        8px;

      border-radius: 19px;

      box-shadow: var(--bubble-shadow);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.1s ease;

      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message-row.mine .message-bubble {
      background: var(--navy);
      color: var(--white);

      border: 1px solid var(--navy);

      border-bottom-right-radius: 7px;
    }

    .message-row.theirs .message-bubble {
      background: var(--white);
      color: var(--text);

      border: 1px solid var(--border);

      border-bottom-left-radius: 7px;
    }

    .message-row.grouped-mine .message-bubble {
      border-top-right-radius: 12px;
    }

    .message-row.grouped-theirs .message-bubble {
      border-top-left-radius: 12px;
    }


    .message-text {
      display: block;

      font-size: 14px;
      line-height: 1.48;
      letter-spacing: -0.004em;
    }

    .message-image-link {
      display: block;
      max-width: min(100%, 520px);
      border-radius: 15px;
      overflow: hidden;
      background: rgba(21, 43, 70, 0.06);
    }

    .message-image {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 520px;
      border-radius: 15px;
      object-fit: contain;
      cursor: zoom-in;
    }

    .message-image-loading {
      display: block;
      min-width: 180px;
      padding: 28px 24px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .message-bubble.image-bubble {
      padding: 6px;
    }

    .message-bubble.image-bubble .message-meta {
      padding: 0 4px 2px;
    }

    .attachment-button {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      padding: 0;
      border: 1px solid var(--input-border);
      border-radius: 13px;
      background: var(--white);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--input-shadow);
      transition: background .15s ease, transform .15s ease, opacity .15s ease;
    }

    .attachment-button:hover:not(:disabled) {
      background: var(--blue);
    }

    .attachment-button:active:not(:disabled) {
      transform: scale(.95);
    }

    .attachment-button:disabled {
      opacity: .5;
      cursor: default;
    }

    .attachment-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .photo-input {
      display: none;
    }

    /* =========================
       DELETED MESSAGE
    ========================= */

    .message-bubble.deleted {
      opacity: 1;
      box-shadow: var(--bubble-shadow);
    }

    .message-row.mine .message-bubble.deleted {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--white);
    }

    .message-row.theirs .message-bubble.deleted {
      background: var(--white);
      border-color: var(--border);
      color: var(--text);
    }

    .deleted-label {
      display: block;

      margin-bottom: 4px;

      color: inherit;
      opacity: 0.58;

      font-size: 8px;
      line-height: 1;

      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .deleted-content {
      display: block;

      color: inherit;
      font-size: 14px;
      line-height: 1.48;
      font-style: normal;
    }

    /* =========================
       MESSAGE META
    ========================= */

    .message-meta {
      margin-top: 5px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;

      color: inherit;
      opacity: 0.56;

      font-size: 8.5px;
      line-height: 1;
      font-weight: 600;
    }

    .message-status {
      font-weight: 750;
    }

    /* =========================
       MESSAGE MENU
    ========================= */

    .message-menu-trigger {
      position: absolute;

      right: 5px;
      top: 50%;

      width: 22px;
      height: 22px;

      padding: 0;

      transform: translateY(-50%);

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: currentColor;

      opacity: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity 0.15s ease,
        background 0.15s ease;
    }

    .message-bubble:hover .message-menu-trigger,
    .message-menu-trigger:focus-visible {
      opacity: 0.5;
    }

    .message-menu-trigger:hover {
      opacity: 0.9;
      background: rgba(255, 255, 255, 0.10);
    }

    .message-menu-trigger svg {
      width: 13px;
      height: 13px;

      fill: currentColor;
      stroke: none;
    }

    .message-menu {
      position: absolute;

      right: 4px;
      top: calc(100% + 6px);

      min-width: 86px;

      padding: 5px;

      display: none;

      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 11px;

      box-shadow: var(--shadow);

      z-index: 30;
    }

    .message-menu.open {
      display: block;
    }

    .message-menu button {
      width: 100%;

      border: 0;
      border-radius: 7px;

      padding: 8px 9px;

      background: transparent;
      color: var(--navy);

      text-align: left;

      font-size: 10px;
      font-weight: 750;
    }

    .message-menu button:hover {
      background: var(--blue);
    }

    /* =========================
       EMPTY / ERROR
    ========================= */

    .empty-state {
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 20px;
    }

    .empty-card {
      width: min(100%, 320px);

      padding: 28px 24px;

      background: rgba(255, 255, 255, 0.74);
      border: 1px solid var(--border);
      border-radius: 23px;

      box-shadow: var(--shadow);

      text-align: center;
    }

    .empty-card h2 {
      margin: 0 0 7px;

      color: var(--navy);
      font-size: 17px;
      font-weight: 800;
    }

    .empty-card p {
      margin: 0;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .error-card {
      width: min(100%, 560px);

      margin: 28px auto;

      padding: 16px 17px;

      background: var(--white);
      border: 1px solid rgba(170, 75, 65, 0.20);
      border-radius: 15px;

      color: #863C36;

      font-size: 12px;
      line-height: 1.5;
    }

    .error-card strong {
      display: block;
      margin-bottom: 5px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 999;

      padding:
        11px 17px
        max(13px, env(safe-area-inset-bottom));

      background: rgba(248, 240, 236, 0.97);
      border-top: 1px solid rgba(21, 43, 70, 0.08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .composer {
      width: min(100%, 800px);
      margin: 0 auto;

      display: flex;
      align-items: flex-end;

      gap: 9px;
    }

    /*
      MUCH MORE OBVIOUS INPUT
    */

    .input-shell {
      flex: 1;
      min-width: 0;

      display: flex;
      align-items: flex-end;

      min-height: 49px;

      padding:
        4px 7px
        4px 15px;

      background: var(--white);

      border:
        1.5px solid
        var(--input-border);

      border-radius: 17px;

      box-shadow: var(--input-shadow);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .input-shell:focus-within {
      border-color: rgba(21, 43, 70, 0.35);

      box-shadow:
        0 0 0 3px rgba(220, 234, 245, 0.8),
        var(--input-shadow);
    }

    .input-icon {
      width: 18px;
      height: 18px;

      margin:
        0 8px 10px 0;

      flex-shrink: 0;

      color: var(--navy);
      opacity: 0.55;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    .message-input {
      width: 100%;

      min-height: 40px;
      max-height: 130px;

      padding:
        9px 2px;

      border: 0;
      outline: 0;
      resize: none;

      background: transparent;
      color: var(--text);

      font-size: 14px;
      line-height: 1.4;
    }

    .message-input::placeholder {
      color: #6F7D89;
      opacity: 1;
    }

    /*
      CLEAR SEND BUTTON
    */

    .send-button {
      height: 49px;
      min-width: 76px;

      flex-shrink: 0;

      padding: 0 14px;

      border: 0;
      border-radius: 15px;

      background: var(--navy);
      color: var(--white);

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      box-shadow:
        0 8px 19px rgba(21, 43, 70, 0.17);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .send-button:hover {
      background: var(--navy-light);
    }

    .send-button:active {      transform: scale(0.95);
    }

    .send-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .send-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .send-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    /* =========================
       MOHAMMAD AI REPLY ASSISTANT
    ========================= */

    .composer-row {
      width: min(100%, 800px);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .composer-row .composer {
      width: auto;
      flex: 1;
      margin: 0;
    }

    .reply-assist {
      width: min(100%, 800px);
      margin: 0 auto 9px;
      padding: 10px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(21,43,70,.08);
      display: none;
    }

    .reply-assist.visible {
      display: block;
    }

    .reply-assist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .reply-assist-title {
      color: var(--navy);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .reply-assist-status {
      color: var(--muted);
      font-size: 9px;
    }

    .reply-assist-note {
      color: var(--muted);
      font-size: 9px;
    }

    .reply-assist-close {
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--soft-surface, var(--blue));
      color: var(--navy);
      font-size: 15px;
      line-height: 1;
    }

    .reply-assist-suggestion {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--soft-surface, var(--blue));
      color: var(--text);
      padding: 11px 12px;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      transition: border-color .15s ease, background .15s ease;
    }

    .reply-assist-suggestion:hover:not(:disabled) {
      background: var(--white);
      border-color: rgba(21,43,70,.20);
    }

    .reply-assist-suggestion.sent {
      cursor: default;
      opacity: .72;
    }

    .reply-assist-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }

    .reply-assist-action {
      height: 31px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--white);
      color: var(--navy);
      font-size: 9px;
      font-weight: 800;
    }

    .reply-assist-action:hover:not(:disabled) {
      background: var(--blue);
    }

    .reply-assist-action.active {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    .reply-assist-action.send-reply {
      margin-left: auto;
    }

    .best-reply-button {
      height: 49px;
      min-width: 103px;
      flex-shrink: 0;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--white);
      color: var(--navy);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 8px 19px rgba(21,43,70,.08);
      font-size: 10px;
      font-weight: 850;
    }

    .best-reply-button.visible {
      display: flex;
    }

    .best-reply-button:hover:not(:disabled) {
      background: var(--blue);
    }

    .best-reply-button:disabled {
      opacity: .55;
      cursor: default;
    }

    .best-reply-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 620px) {

      .header {
        padding-left: 12px;
        padding-right: 12px;
      }

      .messages-container {
        padding-left: 10px;
        padding-right: 10px;
      }

      .composer-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .messages-container {
        padding-bottom: 12px;
      }

      .message-content {
        max-width: 84%;
      }

      .message-text,
      .deleted-content {
        font-size: 13.5px;
      }

      .message-menu-trigger {
        opacity: 0.42;
      }


      .input-shell {
        min-height: 48px;
        padding-left: 12px;
      }

      .input-icon {
        display: none;
      }

      .best-reply-button {
        width: 50px;
        min-width: 50px;
        padding: 0;
      }

      .best-reply-button span {
        display: none;
      }

      .send-button {
        min-width: 50px;
        width: 50px;
        padding: 0;
      }

      .send-label {
        display: none;
      }
    }

    @media (max-width: 380px) {

      .composer {
        gap: 7px;
      }

      .send-button {
        width: 47px;
        min-width: 47px;
      }

      .message-input {
        font-size: 13.5px;
      }
    }
  
    /* ==========================================
       ACCOUNT THEME SYSTEM
    ========================================== */
    html[data-theme="dark"] {
      --bg: #101722;
      --navy: #EAF1F7;
      --navy-light: #CFE0EE;
      --peach: #E7A58F;
      --blue: #24394E;
      --white: #182231;
      --text: #EAF1F7;
      --muted: #9EADBB;
      --border: rgba(234,241,247,.11);
    }

    html[data-theme="ocean"] {
      --bg: #EEF6FB;
      --navy: #123B5D;
      --navy-light: #1C557F;
      --peach: #8BCDE5;
      --blue: #D7ECF7;
      --white: #FFFFFF;
      --text: #1F3445;
      --muted: #6E8798;
      --border: rgba(18,59,93,.11);
    }

    html[data-theme="forest"] {
      --bg: #EEF4F0;
      --navy: #173A31;
      --navy-light: #255447;
      --peach: #D8A58F;
      --blue: #D9E9E0;
      --white: #FFFFFF;
      --text: #273932;
      --muted: #71817A;
      --border: rgba(23,58,49,.11);
    }

    html[data-theme="dark"] body {
      background: #101722 !important;

  <script>
    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://ywflohxufmfydkpkkqly.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qTMUO8KxerEQBDQ-A7Huyg_8N2Tqpmr";

    const SPACE_ID =
      "6547fe99-ed80-421c-8572-50ae3fb6fbe4";

    // Product rule: Mohammad can always see the original content of a
    // deleted message. Salma must always see only the Deleted state.
    const MOHAMMAD_USER_ID =
      "28c4929b-ed2c-4eec-a850-88d50bce8e91";

    const client =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    /* ==========================================
       ELEMENTS
    ========================================== */

    const messagesEl =
      document.getElementById("messages");

    const messagesScroll =
      document.getElementById("messagesScroll");

    const input =
      document.getElementById("messageInput");

    const composer =
      document.getElementById("composer");

    const sendButton =
      document.getElementById("sendButton");

    const attachmentButton =
      document.getElementById("attachmentButton");

    const photoInput =
      document.getElementById("photoInput");

    const homeButton =
      document.getElementById("homeButton");
    const headerSubtitle =
      document.getElementById("headerSubtitle");

    const replyAssist =
      document.getElementById("replyAssist");
    const replyAssistStatus =
      document.getElementById("replyAssistStatus");
    const replyAssistSuggestion =
      document.getElementById("replyAssistSuggestion");
    const replyAssistSend =
      document.getElementById("replyAssistSend");
    const replyAssistClose =
      document.getElementById("replyAssistClose");
    const bestReplyButton =
      document.getElementById("bestReplyButton");


    /* ==========================================
       STATE
    ========================================== */

    let currentUser = null;
    let messages = [];
    let realtimeChannel = null;
    let visibleMessageObserver = null;
    let isChatVisible = document.visibilityState === "visible";
    let replySuggestion = null;
    let replySuggestionSent = false;
    let busyReplySuggestion = false;
    const imageUrlCache = new Map();

    // Scroll state is centralized so initial entry, photo sends, realtime
    // inserts, and image/layout changes all use the same bottom-lock logic.
    let stickToBottom = false;
    let bottomScrollFrame = 0;
    let bottomScrollToken = 0;
    let bottomScrollTimers = [];

    /* ==========================================
       HELPERS
    ========================================== */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function timeLabel(value) {
      return new Date(value).toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

    // Keep the last message above the fixed composer. We intentionally
    // scroll using the container's real scrollHeight; assigning scrollTop
    // to scrollHeight clamps to the browser's true maximum scroll position.
    function isAtBottom() {
      const distance =
        messagesScroll.scrollHeight -
        messagesScroll.clientHeight -
        messagesScroll.scrollTop;

      return distance <= 16;
    }

    function cancelBottomLock() {
      stickToBottom = false;
      bottomScrollToken += 1;

      if (bottomScrollFrame) {
        cancelAnimationFrame(bottomScrollFrame);
        bottomScrollFrame = 0;
      }

      bottomScrollTimers.forEach(clearTimeout);
      bottomScrollTimers = [];
    }

    function scrollToLatestNow() {
      syncLayoutMetrics();
      messagesScroll.scrollTop = messagesScroll.scrollHeight;
    }

    function scrollToLatest(behavior = "auto") {
      stickToBottom = true;
      const token = ++bottomScrollToken;

      if (bottomScrollFrame) {
        cancelAnimationFrame(bottomScrollFrame);
      }

      bottomScrollFrame = requestAnimationFrame(() => {
        bottomScrollFrame = requestAnimationFrame(() => {
          bottomScrollFrame = 0;

          if (token !== bottomScrollToken) return;

          if (behavior === "smooth") {
            messagesScroll.scrollTo({
              top: messagesScroll.scrollHeight,
              behavior: "smooth"
            });
          } else {
            scrollToLatestNow();
          }
        });
      });

      return token;
    }

    // A forced bottom lock is used only when the app itself knows that the
    // user should be at the latest message (chat entry / sending a photo).
    // It survives image decoding and any resulting layout reflow.
    function lockToLatestForSettling() {
      stickToBottom = true;
      const token = ++bottomScrollToken;

      if (bottomScrollFrame) {
        cancelAnimationFrame(bottomScrollFrame);
        bottomScrollFrame = 0;
      }

      bottomScrollTimers.forEach(clearTimeout);
      bottomScrollTimers = [];

      const settle = () => {
        if (!stickToBottom || token !== bottomScrollToken) return;
        scrollToLatestNow();
      };

      requestAnimationFrame(() => {
        requestAnimationFrame(settle);
      });

      // Image loading and decoding can change scrollHeight well after the
      // first paint. ResizeObserver below handles exact changes; these
      // bounded passes cover browser scheduling gaps as well.
      [50, 120, 250, 500, 900, 1400].forEach((delay) => {
        bottomScrollTimers.push(
          setTimeout(settle, delay)
        );
      });

      bottomScrollTimers.push(
        setTimeout(() => {
          if (token === bottomScrollToken) {
            stickToBottom = false;
            bottomScrollTimers = [];
          }
        }, 1800)
      );
    }

    function userStartedScrollingChat() {
      cancelBottomLock();
    }

    messagesScroll.addEventListener("wheel", userStartedScrollingChat, {
      passive: true
    });
    messagesScroll.addEventListener("touchstart", userStartedScrollingChat, {
      passive: true
    });
    messagesScroll.addEventListener("pointerdown", userStartedScrollingChat, {
      passive: true
    });

    function dateKey(value) {
      const d = new Date(value);

      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
      ].join("-");
    }
    function dateLabel(value) {
      return new Date(value).toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );
    }

    function isMine(message) {
      return (
        currentUser &&
        message.sender_id ===
          currentUser.id
      );
    }

    async function hydrateImageUrls(list) {
      const imageMessages = (list || []).filter(
        (message) => message.media_path && message.message_type === "image"
      );

      const missingPaths = [
        ...new Set(
          imageMessages
            .map((message) => message.media_path)
            .filter((path) => {
              const cached = imageUrlCache.get(path);
              return !cached || cached.expiresAt <= Date.now() + 60_000;
            })
        )
      ];

      if (missingPaths.length) {
        const { data, error } = await client.storage
          .from("chat-media")
          .createSignedUrls(missingPaths, 3600);

        if (error) {
          console.warn("Could not create signed image URLs:", error);
        } else {
          (data || []).forEach((item, index) => {
            const path = missingPaths[index];
            if (path && item?.signedUrl) {
              imageUrlCache.set(path, {
                url: item.signedUrl,
                expiresAt: Date.now() + 55 * 60 * 1000
              });
            }
          });
        }
      }

      imageMessages.forEach((message) => {
        const cached = imageUrlCache.get(message.media_path);
        message.media_url = cached?.url || null;
      });
    }

    function scrollToLatestAfterImages() {
      lockToLatestForSettling();
    }

    function closeMenus() {
      document
        .querySelectorAll(".message-menu.open")
        .forEach((menu) => {
          menu.classList.remove("open");
        });
    }

    function syncLayoutMetrics() {
      const header = document.querySelector(".header");
      const composerArea = document.querySelector(".composer-area");

      if (header) {
        document.documentElement.style.setProperty(
          "--header-height",
          `${header.getBoundingClientRect().height}px`
        );
      }

      if (composerArea) {
        document.documentElement.style.setProperty(
          "--composer-height",
          `${composerArea.getBoundingClientRect().height}px`
        );
      }
    }

    const messagesContentResizeObserver = new ResizeObserver(() => {
      if (!stickToBottom) return;

      // ResizeObserver fires when images finish decoding or message layout
      // changes. Defer the scroll one frame so the new geometry is committed.
      requestAnimationFrame(() => {
        if (stickToBottom) {
          scrollToLatestNow();
        }
      });
    });

    const headerResizeObserver = new ResizeObserver(() => {
      syncLayoutMetrics();
    });

    const composerResizeObserver = new ResizeObserver(() => {
      const wasAtBottom = isAtBottom();

      syncLayoutMetrics();

      if (wasAtBottom) {
        scrollToLatest();
      }
    });

    const headerElement =
      document.querySelector(".header");

    const composerAreaElement =
      document.querySelector(".composer-area");

    if (headerElement) {
      headerResizeObserver.observe(headerElement);
    }

    if (composerAreaElement) {
      composerResizeObserver.observe(composerAreaElement);
    }

    if (messagesEl) {
      messagesContentResizeObserver.observe(messagesEl);
    }

    syncLayoutMetrics();

    // iOS Safari can change the visual viewport when the keyboard opens,
    // closes, or the browser chrome expands/collapses. Keep the measured
    // composer height and bottom spacer synchronized with those changes.
    let viewportSyncFrame = 0;

    function syncVisualViewport() {
      if (viewportSyncFrame) return;

      viewportSyncFrame = requestAnimationFrame(() => {
        viewportSyncFrame = 0;

        const wasAtBottom = isAtBottom();
        syncLayoutMetrics();

        if (wasAtBottom) {
          scrollToLatest();
        }
      });
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        syncVisualViewport,
        { passive: true }
      );
      window.visualViewport.addEventListener(
        "scroll",
        syncVisualViewport,
        { passive: true }
      );
    }

    window.addEventListener(
      "resize",
      syncVisualViewport,
      { passive: true }
    );

function renderError(message) {
      messagesEl.innerHTML = `
        <div class="error-card">
          <strong>Unable to load the chat</strong>
          ${escapeHtml(message)}
        </div>
      `;
    }

    /* ==========================================
       STATUS
    ========================================== */

    function messageStatus(message) {
      if (message.seen_at) {
        return "Seen";
      }

      return "Sent";
    }

    /* ==========================================
       RENDER
    ========================================== */

    function renderMessages() {

      closeMenus();

      if (!messages.length) {

        messagesEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-card">
              <h2>Our Space</h2>
              <p>
                Start your conversation here.
              </p>
            </div>
          </div>
        `;

        return;
      }

      let html = "";
      let previousDate = null;

      for (
        let i = 0;
        i < messages.length;
        i++
      ) {

        const message = messages[i];

        const mine =
          isMine(message);

        const deleted =
          Boolean(
            message.deleted_at
          );

        const currentDate =
          dateKey(
            message.created_at
          );

        if (
          currentDate !==
          previousDate
        ) {

          html += `
            <div class="date-divider">
              <span>
                ${escapeHtml(
                  dateLabel(
                    message.created_at
                  )
                )}
              </span>
            </div>
          `;

          previousDate =
            currentDate;
        }

        const previous =
          i > 0
            ? messages[i - 1]
            : null;

        const grouped =
          previous &&
          previous.sender_id ===
            message.sender_id &&
          dateKey(
            previous.created_at
          ) === currentDate;

        const rowClass = [
          "message-row",
          mine ? "mine" : "theirs",
          grouped
            ? (
                mine
                  ? "grouped-mine"
                  : "grouped-theirs"
              )
            : ""
        ]
          .filter(Boolean)
          .join(" ");

        const deletedHtml =
          deleted
            ? `
              <span class="deleted-label">
                Deleted
              </span>
            `
            : "";

        // Deleted-message visibility is intentionally asymmetric:
        // Mohammad always sees the original content;
        // Salma never sees the original content after deletion.
        const showDeletedOriginal =
          currentUser?.id === MOHAMMAD_USER_ID;

        const isImage =
          message.message_type === "image" &&
          Boolean(message.media_path);

        const contentHtml =
          deleted && !showDeletedOriginal
            ? ""
            : isImage
              ? message.media_url
                ? `
                  <a
                    class="message-image-link"
                    href="${escapeHtml(message.media_url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Open photo"
                  >
                    <img
                      class="message-image"
                      src="${escapeHtml(message.media_url)}"
                      alt="Photo"
                      loading="eager"
                      decoding="async"
                    >
                  </a>
                `
                : `
                  <span class="message-image-loading">
                    Photo unavailable
                  </span>
                `
              : `
                <span class="message-text">
                  ${escapeHtml(message.content)}
                </span>
              `;

        const statusHtml =
          mine
            ? `
              <span class="message-status" data-status="${message.id}">
                ${escapeHtml(
                  messageStatus(
                    message
                  )
                )}
              </span>
            `
            : "";

        const menuHtml =
          mine && !deleted
            ? `
              <button
                class="message-menu-trigger"
                type="button"
                data-menu-trigger="${message.id}"
                aria-label="Message options"
              >
                <svg viewBox="0 0 24 24">
                  <circle
                    cx="5"
                    cy="12"
                    r="1.7"
                  ></circle>
                  <circle
                    cx="12"
                    cy="12"
                    r="1.7"
                  ></circle>
                  <circle
                    cx="19"
                    cy="12"
                    r="1.7"
                  ></circle>
                </svg>
              </button>

              <div
                class="message-menu"
                data-menu="${message.id}"
              >
                <button
                  type="button"
                  data-delete-direct="${message.id}"
                >
                  Delete
                </button>
              </div>
            `
            : "";

        html += `
          <div
            class="${rowClass}"
            data-row="${message.id}"
          >

            <div class="message-content">

              <div
                class="message-bubble ${
                  [
                    deleted ? "deleted" : "",
                    isImage ? "image-bubble" : ""
                  ]
                    .filter(Boolean)
                    .join(" ")
                }"
              >

                ${deletedHtml}

                ${contentHtml}

                <div class="message-meta">

                  <span>
                    ${escapeHtml(
                      timeLabel(
                        message.created_at
                      )
                    )}
                  </span>

                  ${statusHtml}

                </div>

                ${menuHtml}

              </div>

            </div>

          </div>
        `;
      }

      messagesEl.innerHTML =
        html;

      setupVisibleMessageObserver();
    }

    /* ==========================================
       SEEN
    ========================================== */

    async function markMessageSeen(messageId) {
      if (!currentUser || !messageId) return;

      const message = messages.find(
        (item) => Number(item.id) === Number(messageId)
      );

      if (!message) return;
      if (message.sender_id === currentUser.id) return;
      if (message.seen_at) return;

      const { error } = await client.rpc(
        "mark_message_seen",
        { p_message_id: message.id }
      );

      if (error) {
        console.warn("Could not mark message as seen:", error);
        return;
      }

      const local = messages.find(
        (item) => Number(item.id) === Number(message.id)
      );
      if (local) {
        local.seen_at = new Date().toISOString();
      }
    }

    function setupVisibleMessageObserver() {
      if (visibleMessageObserver) {
        visibleMessageObserver.disconnect();
      }

      visibleMessageObserver = new IntersectionObserver(
        (entries) => {
          if (document.visibilityState !== "visible") return;

          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;

            const id = Number(entry.target.dataset.row);
            markMessageSeen(id);
          });
        },
        {
          root: messagesScroll,
          threshold: 0.65
        }
      );

      document.querySelectorAll("[data-row]").forEach((row) => {
        const message = messages.find(
          (item) => Number(item.id) === Number(row.dataset.row)
        );

        if (
          message &&
          message.sender_id !== currentUser?.id &&
          !message.seen_at
        ) {
          visibleMessageObserver.observe(row);
        }
      });
    }

    function updateChatVisibility() {
      isChatVisible = document.visibilityState === "visible";
      if (isChatVisible) {
        setupVisibleMessageObserver();
      }
    }

    document.addEventListener("visibilitychange", updateChatVisibility);

    function latestIncomingMessage() {
      if (!currentUser) return null;

      for (let i = messages.length - 1; i >= 0; i--) {
        const message = messages[i];
        if (
          message &&
          !message.deleted_at &&
          message.sender_id !== currentUser.id
        ) {
          return message;
        }
      }

      return null;
    }

      replyAssistSuggestion.classList.remove("sent");

    async function requestBestReply() {
      if (!currentUser || currentUser.id !== MOHAMMAD_USER_ID) return;

      const incoming = latestIncomingMessage();

      if (!incoming) {
        alert("There is no message from Salma to reply to yet.");
        return;
      }

      clearReplySuggestion();
      bestReplyButton.disabled = true;
      bestReplyButton.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path><circle cx="12" cy="12" r="4"></circle></svg><span>Thinking...</span>';

      replyAssist.classList.add("visible");
      replyAssistStatus.textContent = "Thinking...";
      replyAssistSuggestion.textContent = "Generating the best reply for this moment...";
      setReplyButtonsEnabled(false);
      syncLayoutMetrics();

      try {
        const sessionResult = await client.auth.getSession();
        const session = sessionResult?.data?.session;

        if (!session) {
          throw new Error("Your session has expired. Please sign in again.");
        }

        const response = await fetch("/api/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + session.access_token
          },
          body: JSON.stringify({
            mode: "suggest_reply",
            source_message_id: Number(incoming.id)
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Could not generate a reply.");
        }

        if (!data.suggestion || !data.suggestion_id) {
          throw new Error("The AI returned an empty suggestion.");
        }

        showReplyAssist({
          suggestion_id: data.suggestion_id,
          source_message_id: Number(data.source_message_id),
          suggestion: String(data.suggestion)
        });
      } catch (error) {
        replyAssistStatus.textContent = "Error";
        replyAssistSuggestion.textContent =
          error.message || "Could not generate a reply.";
        setReplyButtonsEnabled(false);
      } finally {
        bestReplyButton.disabled = false;
        bestReplyButton.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path><circle cx="12" cy="12" r="4"></circle></svg><span>Best reply</span>';
        syncLayoutMetrics();
      }
    }

    async function sendReplySuggestion() {
      if (!replySuggestion || replySuggestionSent || busyReplySuggestion) return;

      const incoming = latestIncomingMessage();

      if (
        !incoming ||
        Number(incoming.id) !== Number(replySuggestion.source_message_id)
      ) {
        clearReplySuggestion();
        alert("A newer message from Salma arrived. Generate a fresh reply.");
        return;
      }

      busyReplySuggestion = true;
      replyAssistStatus.textContent = "Sending...";
      setReplyButtonsEnabled(false);

      try {
        await sendMessage(replySuggestion.suggestion, true);
        replySuggestionSent = true;
        replyAssistSuggestion.classList.add("sent");
        replyAssistSuggestion.disabled = true;
        replyAssistSend.disabled = true;
        replyAssistStatus.textContent = "Sent";
      } catch (error) {
        replyAssistStatus.textContent =
          error.message || "Could not send.";
        setReplyButtonsEnabled(true);
      } finally {
        busyReplySuggestion = false;
        syncLayoutMetrics();
      }
    }

    async function sendMessage(

      preserveReplySuggestion = false
    ) {

      const value =

      if (!value) {
        return;

      const { data: sentMessage, error } =
        await client
          .from("messages")

        "40px";

    async function sendImage(file) {
      if (!file || !currentUser) return;

      if (!file.type.startsWith("image/")) {
        throw new Error("Please choose an image file.");
      }

      const maxBytes = 10 * 1024 * 1024;
      if (file.size > maxBytes) {
        throw new Error("That photo is too large. The maximum size is 10 MB.");
      }

      const extensionMap = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp",
        "image/gif": "gif"
      };
      const extension = extensionMap[file.type];
      if (!extension) {
        throw new Error("This image format is not supported.");
      }

      const path =
        `${SPACE_ID}/${currentUser.id}/${crypto.randomUUID()}.${extension}`;

      attachmentButton.disabled = true;
      sendButton.disabled = true;
      headerSubtitle.textContent = "Uploading photo...";

      try {
        const { error: uploadError } = await client.storage
          .from("chat-media")
          .upload(path, file, {
            cacheControl: "31536000",
            contentType: file.type,
            upsert: false
          });

        if (uploadError) {
          throw uploadError;
        }

        const { data: sentMessage, error: insertError } = await client
          .from("messages")
          .insert({
            space_id: SPACE_ID,
            sender_id: currentUser.id,
            content: "Photo",
            message_type: "image",
            media_path: path
          })
          .select("id, space_id, sender_id, content, message_type, media_path, created_at")
          .single();

        if (insertError) {
          await client.storage.from("chat-media").remove([path]);
          throw insertError;
        }

        await hydrateImageUrls([sentMessage]);
        messages.push(sentMessage);
        messages.sort(
          (a, b) => new Date(a.created_at) - new Date(b.created_at)
        );
        renderMessages();
        scrollToLatestAfterImages();

        if (sentMessage && window.OurSpaceNotifications) {
          await window.OurSpaceNotifications.sendMessage(sentMessage);
        }
      } finally {
        attachmentButton.disabled = false;
        sendButton.disabled = false;
        headerSubtitle.textContent = "Private chat";
      }
    }

    async function deleteMessageDirect(message) {
      if (!message || !currentUser) return;
      if (message.sender_id !== currentUser.id) return;
      if (message.deleted_at) return;

      try {
        // Primary path: secure database RPC.
        const { data: rpcChanged, error: rpcError } = await client.rpc(
          "delete_message_for_everyone",
          { p_message_id: message.id }
        );

        if (rpcError) {
          console.warn("Delete RPC failed; trying direct update:", rpcError);
        }

        // Compatibility fallback: this also works if the RPC has not yet
        // been installed, provided the sender has the required UPDATE policy.
        if (rpcError || rpcChanged === false) {
          const { error: directError } = await client
            .from("messages")
            .update({
              deleted_at: new Date().toISOString(),
              deleted_by: currentUser.id
            })
            .eq("id", message.id)
            .eq("sender_id", currentUser.id)
            .is("deleted_at", null);

          if (directError) throw directError;
        }

        // The deletion RPC itself is the database confirmation.
        // Deleted rows are intentionally hidden from Salma by RLS, so a follow-up
        // SELECT can legitimately return no row on her device.
        const localIndex = messages.findIndex(
          (item) => Number(item.id) === Number(message.id)
        );

        if (localIndex !== -1) {
          if (currentUser.id === MOHAMMAD_USER_ID) {
            // Mohammad keeps the original message visible with a Deleted label.
            messages[localIndex] = {
              ...messages[localIndex],
              deleted_at: new Date().toISOString(),
              deleted_by: currentUser.id
            };
          } else {
            // Salma must lose the message from her device immediately.
            messages = messages.filter(
              (item) => Number(item.id) !== Number(message.id)
            );
          }
        }

        if (message.media_path) {
          const { error: mediaDeleteError } = await client.storage
            .from("chat-media")
            .remove([message.media_path]);

          if (mediaDeleteError) {
            console.warn("Could not delete the photo file:", mediaDeleteError);
          } else {
            imageUrlCache.delete(message.media_path);
          }
        }

        renderMessages();
      } catch (error) {
        console.error("Delete error:", error);
        alert(error.message || "Could not delete the message.");
      }
    }

    let syncInProgress = false;

    async function syncMessagesSilently() {
      if (!currentUser || syncInProgress) return;
      syncInProgress = true;
      try {
        const { data, error } = await client
          .from("messages")
          .select("id, space_id, sender_id, content, message_type, media_path, created_at, deleted_at, deleted_by, seen_at")
          .eq("space_id", SPACE_ID)
          .order("created_at", { ascending: true });

        if (error) throw error;
        const nextMessages = data || [];
        const currentIds = new Set(
          messages.map((item) => Number(item.id))
        );

        const hasNewMessage = nextMessages.some(
          (item) => !currentIds.has(Number(item.id))
        );

        const changed =
          nextMessages.length !== messages.length ||
          nextMessages.some((next, index) => {
            const current = messages[index];
            return !current ||
              Number(current.id) !== Number(next.id) ||
              current.content !== next.content ||
              current.deleted_at !== next.deleted_at ||
              current.deleted_by !== next.deleted_by ||
              current.seen_at !== next.seen_at;
          });

        if (
          hasNewMessage &&
          currentUser?.id === MOHAMMAD_USER_ID
        ) {
          const latestNextMessage =
            nextMessages[nextMessages.length - 1];

          if (
            latestNextMessage &&
            latestNextMessage.sender_id !== currentUser.id &&
            !latestNextMessage.deleted_at
          ) {
            clearReplySuggestion();
          }
        }

        if (
          hasNewMessage &&
          currentUser?.id === MOHAMMAD_USER_ID
        ) {
          const latestNextMessage =
            nextMessages[nextMessages.length - 1];

          if (
            latestNextMessage &&
            latestNextMessage.sender_id !== currentUser.id &&
            !latestNextMessage.deleted_at
          ) {
            clearReplySuggestion();
          }
        }

        if (changed) {
          const wasNearBottom =
            messagesScroll.scrollHeight -
            messagesScroll.scrollTop -
            messagesScroll.clientHeight < 80;
          messages = nextMessages;
          await hydrateImageUrls(messages);
          renderMessages();
          if (hasNewMessage || wasNearBottom) {
            scrollToLatest();
          }
        }
      } catch (error) {
        console.warn("Background message sync failed:", error);
      } finally {
        syncInProgress = false;
      }
    }

    ========================================== */

    function subscribeRealtime() {
      if (realtimeChannel) {
        client.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      const channelName = "our-space-chat-" + SPACE_ID;

      // Do NOT filter the Postgres Changes subscription here.
      // The database/RLS layer decides which rows the user may receive,
      // then we filter by SPACE_ID in the browser. This avoids a common
      // Supabase failure mode where a filtered UPDATE subscription silently
      // receives nothing even though the table itself is in the publication.
      realtimeChannel = client
        .channel(channelName, {
          config: {
            private: true
          }
        })
        .on(
          "broadcast",
          {
            event: "message_deleted"
          },
          (payload) => {
            const deletedId = Number(payload?.payload?.message_id);
            const deletedSpace = String(payload?.payload?.space_id || "");

            if (
              !deletedId ||
              deletedSpace !== String(SPACE_ID)
            ) {
              return;
            }

            const localIndex = messages.findIndex(
              (item) => Number(item.id) === deletedId
            );

            if (localIndex === -1) {
              return;
            }

            if (currentUser?.id === MOHAMMAD_USER_ID) {
              messages[localIndex] = {
                ...messages[localIndex],
                deleted_at:
                  messages[localIndex].deleted_at ||
                  new Date().toISOString()
              };
            } else {
              messages = messages.filter(
                (item) => Number(item.id) !== deletedId
              );
            }

            renderMessages();
          }
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "messages"
          },
          async (payload) => {
            const incoming = payload.new || payload.old || {};

            if (
              incoming.space_id &&
              String(incoming.space_id) !== String(SPACE_ID)
            ) {
              return;
            }

            if (payload.eventType === "INSERT") {
              const inserted = payload.new;

              if (!inserted?.id) {
                await loadMessages(true);
                return;
              }

              const alreadyExists = messages.some(
                (item) => Number(item.id) === Number(inserted.id)
              );

              if (!alreadyExists) {
                if (
                  currentUser?.id === MOHAMMAD_USER_ID &&
                  inserted.sender_id !== currentUser.id &&
                  !inserted.deleted_at
                ) {
                  clearReplySuggestion();
                }

                if (inserted.message_type === "image" && inserted.media_path) {
                  await hydrateImageUrls([inserted]);
                }

                messages.push(inserted);
                messages.sort(
                  (a, b) =>
                    new Date(a.created_at) - new Date(b.created_at)
                );

                renderMessages();

                // New messages must always bring the conversation to the latest message.
                scrollToLatest();
              }

              return;
            }

            if (payload.eventType === "UPDATE") {
              const updated = payload.new;

              if (!updated?.id) {
                await syncMessagesSilently();
                return;
              }

              const index = messages.findIndex(
                (item) => Number(item.id) === Number(updated.id)
              );

              if (index === -1) {
                await loadMessages(false);
                return;
              }

              // Merge the event immediately. If Supabase omits a field,
              // the existing local value remains intact.
              const current = messages[index];
              messages[index] = {
                ...current,
                ...updated
              };

              const seenOnlyUpdate =
                current.content === messages[index].content &&
                current.deleted_at === messages[index].deleted_at &&
                current.seen_at !== messages[index].seen_at;

              if (seenOnlyUpdate) {
                const status = document.querySelector(
                  `[data-status="${updated.id}"]`
                );
                if (status) {
                  status.textContent =
                    messages[index].seen_at ? "Seen" : "Sent";
                }
                return;
              }

              const wasNearBottom =
                messagesScroll.scrollHeight -
                messagesScroll.scrollTop -
                messagesScroll.clientHeight < 80;

              renderMessages();

              if (wasNearBottom) {
                scrollToLatest();
              }

              return;
            }

            // A hard DELETE is not used by our app, but handle it safely.
            if (payload.eventType === "DELETE") {
              const deletedId = Number(payload.old?.id);
              if (!deletedId) return;

              messages = messages.filter(
                (item) => Number(item.id) !== deletedId
              );
              renderMessages();
            }
          }
        )
        .subscribe((status, error) => {
          console.log("Our Space realtime:", status, error || "");

          if (
            status === "CHANNEL_ERROR" ||
            status === "TIMED_OUT" ||
            status === "CLOSED"
          ) {
            setTimeout(() => {
              if (document.visibilityState === "visible") {
                subscribeRealtime();
              }
            }, 1000);
          }
        });
    }

    async function start() {

      const {
        data: {
          user
        },
        error
      } =
        await client.auth.getUser();

      if (error) {

        console.error(
          error
        );

        window.location.href =
          "login.html";

        return;
      }

      if (!user) {

        window.location.href =
          "login.html";

        return;
      }

      currentUser =
        user;

      // Gate the reply coach by the canonical profile username, not only by
      // a hard-coded UUID. This keeps the UI aligned with the same identity
      // rule enforced by the AI Edge Function.
      const { data: profile, error: profileError } = await client
        .from("user_profiles")
        .select("username")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      const isMohammadAccount =
        !profileError &&
        String(profile?.username || "").toLowerCase() === "mohammad";

      if (isMohammadAccount) {
        bestReplyButton.classList.add("visible");
      } else {
        bestReplyButton.classList.remove("visible");
        clearReplySuggestion();
      }

      window.OurSpaceTheme.syncFromUser(currentUser);

      headerSubtitle.textContent =
        "Private chat";

      await loadMessages(true);

      if (window.OurSpaceNotifications) {
        await window.OurSpaceNotifications.register(currentUser);
      }

      subscribeRealtime();

      // Keep both accounts synchronized even if a realtime event is delayed.
      setInterval(syncMessagesSilently, 500);

      input.focus();
    }

    start();
  </script>

</body>
</html>
